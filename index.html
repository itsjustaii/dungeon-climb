<script>
const W=144,H=256,cv=document.getElementById('g'),cx=cv.getContext('2d'),wrap=document.getElementById('wrap');
// PICO-8 style palette
const P={k:'#000000',n:'#1d2b53',u:'#7e2553',g:'#008751',h:'#ab5236',d:'#5f574f',l:'#c2c3c7',w:'#fff1e8',r:'#ff004d',o:'#ffa300',y:'#ffec27',G:'#00e436',b:'#29adff',v:'#83769c',s:'#ffccaa'};
const LX=[40,72,104];
const WARM=400; // height of the slow, sparse warm-up at the start of a run
// no bait until you've picked up some speed and height (260M, about 40s in): the early climb is orange trail only
const BAIT_START=2080;
// power-ups start a little after that (300M). shield and rope are held until used; the rest run on a timer (seconds).
const PUP_START=2400;
const PUPS={shield:{c:'b',name:'SHIELD'},rope:{c:'#e0a060',name:'ROPE'},magnet:{c:'r',name:'MAGNET',t:8},x2:{c:'y',name:'DOUBLE GEMS',t:10},cool:{c:'b',name:'LAVA COOLED',t:8}};
const PUP_KINDS=['shield','magnet','x2','rope','cool']; // picked at random each time

// explorer: authored at 16x24, upscaled 1.5x (Scale3x then halved) to 24x36 fine px = 12x18 world, auto outline
const SPC={o:'#291814',H:'#ab5236',h:'#742f29',d:'#5a3a22',s:'#ffccaa',z:'#e0a07a',B:'#29adff',b:'#065ab5',n:'#c9a66b',N:'#8a6a45',p:'#5f574f',P:'#3a3438',w:'#5a3a22'};
const at=(o,rows)=>{const a=[];rows.forEach((s,i)=>a[o+i]=s);return a};
function scale3(g){
  const h=g.length,w=g[0].length,o=[],at=(r,c)=>r<0||r>=h||c<0||c>=w?'.':g[r][c];
  for(let r=0;r<h*3;r++)o[r]=[];
  for(let r=0;r<h;r++)for(let c=0;c<w;c++){
    const A=at(r-1,c-1),B=at(r-1,c),C=at(r-1,c+1),D=at(r,c-1),E=at(r,c),F=at(r,c+1),G=at(r+1,c-1),H=at(r+1,c),I=at(r+1,c+1);
    const e=[E,E,E,E,E,E,E,E,E];
    if(B!==H&&D!==F){
      e[0]=D===B?D:E;e[1]=(D===B&&E!==C)||(B===F&&E!==A)?B:E;e[2]=B===F?F:E;
      e[3]=(D===B&&E!==G)||(D===H&&E!==A)?D:E;e[5]=(B===F&&E!==I)||(H===F&&E!==C)?F:E;
      e[6]=D===H?D:E;e[7]=(D===H&&E!==I)||(H===F&&E!==G)?H:E;e[8]=H===F?F:E;
    }
    for(let i=0;i<9;i++)o[r*3+(i/3|0)][c*3+i%3]=e[i];
  }
  return o.filter((_,r)=>r%2===0).map(row=>row.filter((_,c)=>c%2===0));
}
function build(flip,...ls){
  let g=[];
  for(let r=0;r<24;r++){g[r]=[];for(let c=0;c<16;c++){let ch='.';
    for(const L of ls){const k=L[r]&&L[r][flip?15-c:c];if(k&&k!=='.')ch=k}g[r][c]=ch}}
  g=scale3(g);
  const h=g.length,w=g[0].length,on=(r,c)=>r>=0&&r<h&&c>=0&&c<w&&g[r][c]!=='.',px=[];
  for(let r=-1;r<=h;r++)for(let c=-1;c<=w;c++){
    if(on(r,c))px.push([c+1,r+1,SPC[g[r][c]]]);
    else if(on(r-1,c)||on(r+1,c)||on(r,c-1)||on(r,c+1))px.push([c+1,r+1,null]);
  }
  return px;
}
// back view (climbing)
const BACK=at(4,[
"......HHHH......",
".....HHHHHH.....",
".....hHHHHh.....",
".....oooooo.....",
"....hHHHHHHh....",

"....bBBzzBBb....",

"...bBnnnnnnBb...",

"...bBnNNNNnBb...",
"....bNNNNNNb....",
"....oooooooo...."]);
const ARM_HI=at(0,[
".....ss.........",
".....ss.........",
"....zs..........",
"....zs..........",

"...zs......ss...",
"..bB.......ss...",

const ARM_MID=at(2,[

const ARM_HIT=at(10,[

"zz..b......b..zz"]);
const ARM_UP=at(1,[

const LEG_KNEE=at(18,[
"....ppP..Pppp...",
"....ppP..Pppp...",
"....ppP...www...",
"....ppP...www...",
"....www.........",
"...wwww........."]);
const LEG_MID=at(18,[

"....ppP..Ppp....",
"....ppP..Ppp....",
"....www..www....",

const LEG_HANG=at(18,[

const LEG_SPLAY=at(18,[

const CLIMB_A=build(false,BACK,ARM_HI,LEG_KNEE),CLIMB_B=build(false,BACK,ARM_MID,LEG_MID);
const CLIMB=[CLIMB_A,CLIMB_B,build(true,BACK,ARM_HI,LEG_KNEE),CLIMB_B];
const HIT=build(false,BACK,ARM_HIT,LEG_HANG),FALL=build(false,BACK,ARM_UP,LEG_SPLAY);
// side view facing right (intro run)
const SIDE=at(4,[
"......HHHH......",
".....HHHHHH.....",
".....hHHHHH.....",
".....oooooo.....",
"....hHHHHHHHHH..",
".....ddsssss....",
".....ddsssos....",
".....dzssssss...",
".......zsss.....",
"....NnBBBBb.....",
"...NnnBBBBb.....",
"...NnnBBBBb.....",
"...NnnbBBBb.....",
"....NnbBBb......",
".....oooooo....."]);
const RARM_BACK=at(13,[
"........B.......",
".......bB..b....",
"......Bb....z...",
".....zs.....zz.."]);
const RARM_FWD=at(13,[
"........B.......",
"........Bb......",
".........Bs.....",
"..........sz...."]);
const RARM_MID=at(13,[
"........B.......",
"........Bb......",
"........zs......"]);
const RLEG=[at(19,[
"......pppp......",
".....Ppp.pp.....",
"....Pp....pp....",
"...Pp......pp...",
"..ww.......www.."]),at(19,[
"......pppp......",
"......pPPP......",
"......p..PP.....",
"......p...w.....",
".....ww........."]),at(19,[
"......pppp......",
".....ppp.PP.....",
"....pp....PP....",
"...pp......PP...",
"..ww.......www.."]),at(19,[
"......pppp......",
"......Pppp......",
"......P..pp.....",
"......P...w.....",
".....ww........."])];
const RUN=[build(false,SIDE,RARM_BACK,RLEG[0]),build(false,SIDE,RARM_MID,RLEG[1]),build(false,SIDE,RARM_FWD,RLEG[2]),build(false,SIDE,RARM_MID,RLEG[3])];
const STAND=build(false,SIDE,RARM_MID,at(19,[
"......pppp......",
"......pp.pp.....",
"......pp.pp.....",
"......pp.pp.....",
".....www.www...."]));

const FD="A010101111101101B110101110101110C011100100100011D110101101101110E111100110100111F111100110100100G011100101101011H101101111101101I111010010010111J001001001101010K101101110101101L100100100100111M101111111101101N110101101101101O010101101101010P110101110100100Q010101101110011R110101110101101S011100010001110T111010010010010U101101101101111V101101101101010W101101111111101X101101010101101Y101101010010010Z1110010101001110111101101101111101011001001011121100010101001113110001010001110410110111100100151111001100011106011100111101111711100101001001081111011111011119111101111001110!010010010000010-000000111000000:000010000010000<001010100010001>100010001010100.000000000000010?110001010000010+000010111010000";
const F={};for(let i=0;i<FD.length;i+=16)F[FD[i]]=FD.substr(i+1,15);

let best=0;try{best=+localStorage.getItem('lavaclimb_best')||0}catch(e){}
// the "one more hit and you burn" hint shows the first few times the lava surges, then never again
let hints=0;try{hints=+localStorage.getItem('lavaclimb_hint')||0}catch(e){}

// game logic runs in 144x256 world units; drawing is S times finer
const S=2;
const f=(x,y,w,h,c)=>{cx.fillStyle=P[c]||c;const x0=Math.round(x*S),y0=Math.round(y*S);cx.fillRect(x0,y0,Math.round((x+w)*S)-x0,Math.round((y+h)*S)-y0)};
const hash=n=>{const s=Math.sin(n*127.1)*43758.5453;return s-Math.floor(s)};
const tw=(s,sc)=>s.length*4*sc-sc;
function txt(s,x,y,sc,c,sh=true){
  if(x==='c')x=(W-tw(s,sc))>>1;
  if(sh)txt(s,x+sc,y+sc,sc,'k',false);
  for(let i=0;i<s.length;i++){const g=F[s[i]];if(!g)continue;
    for(let j=0;j<15;j++)if(g[j]==='1')f(x+i*4*sc+(j%3)*sc,y+(j/3|0)*sc,sc,sc,c)}
}
function drawSpr(px,x,y,tint){
  const bx=Math.round(x*S)-1,by=Math.round(y*S)-1;
  for(const [c,r,col] of px){cx.fillStyle=col?(tint?P[tint]:col):'#120a10';cx.fillRect(bx+c,by+r,1,1)}
}

// sound
let ac;
function unlock(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();ac.resume()}catch(e){}}
let muted=false;try{muted=localStorage.getItem('lavaclimb_mute')==='1'}catch(e){}
function setMute(m){muted=m;try{localStorage.setItem('lavaclimb_mute',m?'1':'0')}catch(e){}}
function snd(f1,f2,d,type='square',vol=.05){
  if(!ac||muted)return;try{const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();
  o.type=type;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
  o.connect(g).connect(ac.destination);o.start(t);o.stop(t+d)}catch(e){}
}

let state='title',T=0,p,camY,lavaY,spikes,waves,jets,traps,deck,known,lastKind,segs,genY,nextY,it,playT,deadT,speed,shake,newBest,deathKind,bubbles,parts,pops,bonus,combo,comboT,closes,gems,gemCount,gemY,gemLane,surge,caught,beat,paused=false,resumeT=0,nextBaitY,baitKind,baitFails,chain,lastGemT,hintT,pups,nextPupY,pupN,pupKind,pupBetween,pupFails,shield,rope,pT,ropeFx,ropeSafeY;
function reset(){
  p={lane:1,x:-6,y:0,stun:0,inv:0,anim:0,vy:0,prevLane:1,switchT:-9};
  camY=-20;lavaY=-24;spikes=[];waves=[];jets=[];traps=[];deck=[];known=new Set();lastKind=null;segs=[];genY=90;bubbles=[];parts=[];pops=[];
  nextY=WARM+100;it=0;playT=0;deadT=0;speed=42;shake=0;newBest=false;bonus=0;combo=0;comboT=-9;closes=0;
  gems=[];gemCount=0;gemY=40;gemLane=1;
  surge=0;caught=false;beat=0;paused=false;resumeT=0;
  nextBaitY=BAIT_START;baitKind=null;baitFails=0;chain=0;lastGemT=-9;hintT=0;
  pups=[];nextPupY=PUP_START;pupN=0;pupKind=null;pupBetween=null;pupFails=0;shield=false;rope=false;pT={magnet:0,x2:0,cool:0};ropeFx={t:0,x0:0};ropeSafeY=-1;
}
reset();

const sy=wy=>H-(wy-camY);
const r3=()=>Math.random()*3|0;
const hands=()=>p.y+16;
// you only fall once your body has climbed past the end of the vine (not the moment your hands reach it)
const GRIP=6,grip=()=>p.y+GRIP;
const isGap=s=>s.type==='G'||s.broken;
const onSeg=s=>s.lane===p.lane&&hands()>=s.y0&&hands()<s.y1;
let deadY=0;
const curY=()=>state==='dead'?deadY:p.y;
const height=()=>Math.max(0,Math.floor(curY()/8));
const score=()=>height()+bonus;

// slow, sparse warm-up for the first ~10s (learn the swipes), then a steep ramp: ~90 at one minute, creeping toward 140
const spAt=y=>Math.min(140,42+98*(1-Math.exp(-Math.max(0,y-WARM)/4500)));
const diff=y=>Math.min(1,Math.max(0,y-WARM)/11000);
// warning times start generous and shrink as you climb (1.35x at the start, 0.6x at the top)
const warnK=()=>1.35-.75*diff(p.y);
// lava surge (Subway Surfers' inspector): a hit brings the lava right under your feet for SURGE seconds
// (it holds at NEAR, then you pull away to FAR over the last SURGE_OUT seconds). a second hit before you're clear burns you.
const SURGE=4,SURGE_OUT=2.5,NEAR=26,FAR=70;
// resuming from pause counts down first so you don't die the instant the game moves again
const RESUME=2.1;
function pause(){if(state==='play'){paused=true;resumeT=0}}
function resume(){if(paused&&resumeT<=0){resumeT=RESUME;snd(440,440,.08,'square',.04)}}
const FRAG=.9; // fragile vines snap this many seconds after you grab them

// hand-made sections stitched together (Subway Surfers style). m() mirrors lanes left/right.
// c: sp speed, d difficulty, g gap length, W window between rows (shrinks with speed), S = g+W
const G=(l,a,b)=>segs.push({lane:l,type:'G',y0:a,y1:b});
const Fv=(l,a,b)=>segs.push({lane:l,type:'F',y0:a,y1:b,t:-1,broken:false});
const others=o=>[0,1,2].filter(l=>l!==o);
// breaks one or two vines starting at y. two breaks start together (so you see both at once and pick the open
// vine), but never stop at the same height, so it doesn't read as a wall. returns where the last break ends.
function block(lanes,y,g){
  if(lanes.length===1){G(lanes[0],y,y+g);return y+g}
  const d2=10+Math.random()*8,g2=g>=40&&Math.random()<.5?g-d2:g+d2,off=Math.random()*3;
  G(lanes[0],y,y+g);G(lanes[1],y+off,y+off+g2);return Math.max(y+g,y+off+g2);
}
// rows of breaks leaving open[i] open each time, with a window W after each row ends
const seq=(y,W,g,blocked)=>{let yy=y;for(const ls of blocked)yy=block(ls,yy,g)+W;return yy-W-y};
const rows=(y,W,g,open)=>seq(y,W,g,open.map(others));
// tiers: d = difficulty when the section unlocks; w = weight when it unlocks -> weight at max difficulty.
// early on you only get single isolated gaps; combos come in as you climb.
const SECTIONS=[
  {d:0,w:[3,.2],f:(y,m,c)=>{G(r3(),y,y+c.g);return c.g}},
  {d:0,w:[1.5,.1],f:(y,m,c)=>20+Math.random()*30*(1-c.d)},
  {d:.03,w:[3,1.2],f:(y,m,c)=>rows(y,c.W,c.g,[r3()])},
  {d:.05,w:[2,1.2],f:(y,m,c)=>{const st=c.g+Math.max(18,c.sp*(.36-.08*c.d));for(let i=0;i<3;i++)G(m(i),y+i*st,y+i*st+c.g);return st*2+c.g}},
  {d:.05,w:[1.5,.8],f:(y,m,c)=>{const o=Math.random()<.5?1:m(0);return block(others(o),y,c.S*1.6)-y}},
  {d:.12,w:[2,3],f:(y,m,c)=>rows(y,c.W,c.g,[m(0),m(1),m(2)])},
  {d:.12,w:[1.5,2],f:(y,m,c)=>{const a=r3();return rows(y,c.W,c.g,[a,a===1?m(0):1])}},
  // checker: middle open, then sides open, then middle...
  {d:.2,w:[1.5,2],f:(y,m,c)=>{const n=3+(Math.random()<c.d?1:0),b=[];for(let i=0;i<n;i++)b.push(i%2?[1]:[0,2]);return seq(y,c.W,c.g,b)}},
  {d:.35,w:[1.5,2.5],f:(y,m,c)=>rows(y,c.W,c.g,[m(0),m(1),m(0),m(1)])},
  // crossfire: open lane jumps from one side to the other (needs a double swipe, so the window is wider)
  {d:.35,w:[1,2],f:(y,m,c)=>rows(y,Math.max(30,c.sp*(.5-.1*c.d)),c.g,[m(0),m(2)])},
];
// fast-crumbling fragile pieces mixed into the layout; short enough to climb over unless you get stunned on one
function sprinkleFragile(a,b,sp,d){
  for(let l=0;l<3;l++){
    if(Math.random()>.3+.35*d)continue;
    const len=sp*(.55+Math.random()*.2);
    // never on your only way through: somewhere alongside it there must always be another lane without a gap
    const alt=y0=>{for(let y=y0-10;y<=y0+len+10;y+=6)if(!others(l).some(q=>!segs.some(s=>s.lane===q&&s.type==='G'&&s.y0<y+6&&s.y1>y-6)))return false;return true};
    for(let k=0;k<10;k++){const y0=a+Math.random()*Math.max(0,b-a-len);if(clearAt(l,y0-6,y0+len+6)&&alt(y0)){Fv(l,y0,y0+len);break}}
  }
}
function placeSection(){
  const y=genY,d=diff(y),sp=spAt(y),g=Math.max(22,Math.round((14+Math.random()*6)*Math.max(1,sp/60)+d*4)),W=Math.max(20,sp*(.42-.12*d)),S=g+W;
  const ok=SECTIONS.filter(s=>d>=s.d),wt=s=>s.w[0]+(s.w[1]-s.w[0])*Math.min(1,(d-s.d)/(1-s.d));
  let r=Math.random()*ok.reduce((t,s)=>t+wt(s),0),sec=ok[0];
  for(const s of ok)if((r-=wt(s))<=0){sec=s;break}
  const flip=Math.random()<.5,len=sec.f(y,l=>flip?2-l:l,{sp,d,g,S,W});
  // breathing room between sections: wide during the warm-up, still enough for a double swipe at top speed
  genY=y+len+(y<WARM?60+Math.random()*30:Math.max(16,sp*(.5-.2*d))+Math.random()*8);
  if(y>WARM+200)sprinkleFragile(y-10,genY,sp,d);
}

// gem tiers: common orange early, purple and red cut in (and get more common) the further/faster you climb,
// each worth more than the last. light/base/dark are the three facet shades, line is the pop-off-the-background outline.
const GEM_TIERS=[
  {d:0,  w:[1,.5], pts:2,  light:'y',       base:'o',       dark:'#a85e00', line:'#4a2a00'},
  {d:.15,w:[0,.4], pts:6,  light:'#e8b8ff', base:'#b24aff', dark:'#5a1a73', line:'#28103a'},
  {d:.4, w:[0,.3], pts:12, light:'#ff8fae', base:'r',       dark:'#8a0030', line:'#3d0016'},
];
function pickGemTier(d){
  const ok=GEM_TIERS.filter(t=>d>=t.d),wt=t=>t.w[0]+(t.w[1]-t.w[0])*Math.min(1,(d-t.d)/(1-t.d));
  let r=Math.random()*ok.reduce((s,t)=>s+wt(t),0),tier=ok[0];
  for(const t of ok)if((r-=wt(t))<=0){tier=t;break}
  return tier;
}
// gem trail: drop a gem in a lane that's currently clear, nudged toward the last lane so the trail
// curves smoothly (Subway Surfers style "follow the safe line") instead of jumping between rows
function placeGemRow(){
  const y=gemY;gemY+=14;
  const cand=[0,1,2].filter(l=>gapFree(l,y-4,y+4)&&!segs.some(s=>s.lane===l&&s.type==='F'&&!s.broken&&s.y0<y+4&&s.y1>y-4));
  if(!cand.length)return;
  gemLane=cand.includes(gemLane)?gemLane:cand.reduce((a,b)=>Math.abs(b-gemLane)<Math.abs(a-gemLane)?b:a);
  if(gems.some(g=>g.bait&&g.lane===gemLane&&Math.abs(g.y-y)<10)||pups.some(u=>!u.between&&u.lane===gemLane&&Math.abs(u.y-y)<10))return;
  gems.push({lane:gemLane,y,got:false,ph:Math.random()*10,tier:GEM_TIERS[0]});
}
// bait: purple and red gems sit OFF the safe line, where grabbing them is a risk you choose to take:
//  frag = purple along a fragile vine; side = three purple running up to a break; stub = one red on the last bit before a break.
// always optional, and only placed where the vine under it is whole and a neighbouring vine stays open to swipe onto.
function placeBait(a,b){

  // (the kind is rolled once per bait and kept until it finds a spot, so the easy-to-place stubs don't crowd out the rest)
  const d=diff(a),sp=spAt(a);
  baitKind=baitKind||(d>=.1&&Math.random()<.12+.25*d?'stub':'purple');
  const kinds=baitKind==='stub'?['stub']:Math.random()<.5?['frag','side']:['side','frag'];
  const adjOpen=(l,y0,y1,gapsOnly)=>[l-1,l+1].some(q=>q>=0&&q<=2&&(gapsOnly?!segs.some(s=>s.lane===q&&s.type==='G'&&s.y0<y1&&s.y1>y0):clearAt(q,y0,y1)));
  const put=(lane,y,t,kind)=>gems.push({lane,y,got:false,ph:Math.random()*10,tier:GEM_TIERS[t],bait:kind});
  const taken=(l,y0,y1)=>gems.some(g=>g.bait&&g.lane===l&&g.y>y0-30&&g.y<y1+30)||pups.some(u=>!u.between&&u.lane===l&&u.y>y0-20&&u.y<y1+20);

    if(k==='frag'){
      const s=segs.find(s=>s.type==='F'&&!s.broken&&s.t<0&&s.y0>=a&&s.y1<b&&!taken(s.lane,s.y0,s.y1)&&adjOpen(s.lane,s.y0-10,s.y1+24,true));
      if(!s)continue;

    }
    const n=k==='stub'?1:3,off=k==='stub'?Math.max(8,sp*.12):Math.max(16,sp*.22);
    for(const s of segs){
      if(s.type!=='G'||s.y0<a||s.y0>=b)continue;
      const l=s.lane,last=s.y0-off,first=last-(n-1)*12;
      if(first<a||taken(l,first,last)||!clearAt(l,first-10,s.y0)||laneThreat(l,first-10,s.y0))continue;
      // the way off: a whole neighbouring vine from the last gem to well past the break
      if(!adjOpen(l,last-10,s.y0+40))continue;
      for(let i=0;i<n;i++)put(l,first+i*12,k==='stub'?2:1,k);

}

  const ok=PUP_KINDS.filter(k=>!(k==='shield'&&shield)&&!(k==='rope'&&rope));

function placePup(a,b){

function move(d){

  for(const s of segs){
    if(s.lane!==p.lane)continue;
    const dist=s.y0-grip();
    if(isGap(s)&&dist>=0&&dist<10){close('DODGE');break}
    if(s.type==='F'&&!s.broken&&s.t>FRAG*.65&&onSeg(s)){close('CLUTCH');break}

  p.prevLane=p.lane;p.switchT=T;p.lane=n;ropeSafeY=-1;snd(520,880,.06);

    if(o.type==='geyser'&&o.steps&&o.steps.some(s=>s.ph!=='done'&&s.lanes.includes(l)))return true;
    if(o.type==='coil'&&o.y<b+20&&o.y>a-20&&(o.lane===l||(o.dir&&o.lane+o.dir===l)))return true;

function nextKinds(y){

function mkSpr(rows,pal){

  for(let r=-1;r<=h;r++)for(let c=-1;c<=w;c++){

// spike waves (Jetpack Joyride style): drops one after another, always one lane open.
// patterns: "mixed" singles and pairs, and later "stairs" that sweep across the lanes in a quick rhythm.
// each drop shows its own "!" for sw seconds before it falls; sw shrinks as you climb.
const spikeV=()=>115+speed*.6;
const spikeEta=delay=>delay+(H-82)/(spikeV()+speed);
function fireWave(){
  const d=diff(p.y),sw=.75*warnK(),stairs=d>.15&&Math.random()<.4;
  const n=stairs?3:1+Math.floor(Math.random()*(1.6+d*2.6)),gapT=stairs?.34-.1*d:.55-.2*d;
  // stairs sweep toward you from the far side, so the lane you dodge into has already been cleared
  const order=p.lane===1?(Math.random()<.5?[0,1,2]:[2,1,0]):p.lane===0?[2,1,0]:[0,1,2];
  let open=p.lane;
  for(let i=0;i<n;i++){
    const delay=sw+i*gapT,ya=hands()+speed*spikeEta(delay);
    // lanes you can be in when it lands without falling (a fragile piece is fine as long as no spike hits you there)
    const path=[0,1,2].filter(l=>gapFree(l,ya-30,ya+24+speed*.35));
    if(!path.length)continue;
    let lanes;
    if(stairs){
      const tgt=order[i];if(!path.some(l=>l!==tgt))continue;lanes=[tgt];
    } else if(i>0&&Math.random()<.35+.45*d){
      // pair: leave one lane open, at most one swipe from the last open lane
      const near=path.filter(l=>Math.abs(l-open)<=1),pool=near.length?near:path,o=pool[Math.random()*pool.length|0];
      lanes=others(o);open=o;
    } else {
      // the first drop goes for your lane (or the one you just left); later drops never go for the lane you dodge into
      let tgt;
      if(i===0)tgt=T-p.switchT<.6?p.prevLane:p.lane;
      else{const c=others(open);tgt=c[Math.random()*c.length|0]}
      if(!path.some(l=>l!==tgt))continue;
      lanes=[tgt];
      if(i===0)open=path.filter(l=>l!==tgt).sort((a,b)=>Math.abs(a-tgt)-Math.abs(b-tgt))[0];
    }
    for(const l of lanes)spikes.push({st:'warn',w:delay,sw,lane:l,y:0});
  }
}

function update(dt){
  if(paused){
    if(resumeT>0){const a=Math.ceil(resumeT/.7);resumeT-=dt;const b=Math.ceil(resumeT/.7);
      if(resumeT<=0){paused=false;snd(660,990,.12,'square',.04)}else if(b<a)snd(440,440,.08,'square',.04)}
    return;
  }
  T+=dt;shake=Math.max(0,shake-dt*12);
  for(const q of parts){q.vy-=(q.g??200)*dt;q.y+=q.vy*dt;q.x+=(q.vx||0)*dt;q.l-=dt}
  parts=parts.filter(q=>q.l>0);
  for(const q of pops)q.t+=dt;
  pops=pops.filter(q=>q.t<1);
  if(state==='title')return;
  if(state==='intro'){
    it+=dt;
    if(it<1.3){p.x=-6+78*(it/1.3);p.y=0;p.anim+=dt*10}
    else if(it<2){p.x=72;if(shake<1.5)shake=1.5;if(Math.random()<.15)snd(60,40,.12,'triangle',.08)}
    if(it>=1.6)lavaY+=14*dt;
    if(it>=2){const k=Math.min(1,(it-2)/.4);p.y=22*k+Math.sin(k*Math.PI)*10;
      if(k>=1){state='play';playT=0;p.y=22}}
  } else if(state==='play'){
    playT+=dt;
    speed=spAt(p.y);
    if(p.stun>0)p.stun-=dt;else{p.y+=speed*dt;p.anim+=dt*(8+speed*.08)}
    p.inv-=dt;
    p.x+=(LX[p.lane]-p.x)*Math.min(1,dt*18);
    if(caught)lavaY+=160*dt;
    else if(surge>0){
      surge-=dt;
      const tg=p.y-(surge>SURGE_OUT?NEAR:NEAR+(FAR-NEAR)*(1-Math.max(0,surge)/SURGE_OUT));
      if(lavaY<tg)lavaY=Math.min(tg,lavaY+Math.max(300,speed*2.5)*dt);
      if(Math.random()<.5)parts.push({x:Math.random()*W,y:lavaY+1,vy:30+Math.random()*50,g:40,l:.6,c:Math.random()<.5?'o':'y'});
      if((beat-=dt)<=0){beat=.38;snd(70,45,.1,'triangle',.1)}
      if(surge<=0){bonus+=20;pops.push({s:'ESCAPED +20',x:p.x,y:p.y+22,t:0});snd(440,880,.2,'square',.05)}
    }
    else lavaY+=speed*(pT.cool>0?.45:.85)*Math.min(1,.4+playT/4)*dt; // cooled lava crawls
    if(p.y-lavaY>110)lavaY=p.y-110;

    while(genY<p.y+300)placeSection();
    while(gemY<p.y+180)placeGemRow();
    // bait goes in above the top of the screen so it scrolls in instead of popping up; more of it the higher you climb
    while(nextBaitY<p.y+200){
      const ok=placeBait(Math.max(nextBaitY,p.y+192),p.y+285);
      nextBaitY+=ok?(6-3.5*diff(nextBaitY)+Math.random()*2-1)*spAt(nextBaitY):60;
      if(ok)baitFails=0;else if(++baitFails>=3){baitFails=0;baitKind=null} // no spot for this kind around here: roll again
    }
    while(nextPupY<p.y+200){
      const ok=placePup(Math.max(nextPupY,p.y+192),p.y+285);
      // random gaps (4 to 13s): short ones overlap with whatever is still running, long ones leave you with nothing
      nextPupY+=ok?(4+Math.random()*9)*spAt(nextPupY):80;
      if(ok)pupFails=0;else if(++pupFails>=4){pupFails=0;pupBetween=!pupBetween} // no room for that kind of spot here: try the other
    }
    for(const k in pT)if(pT[k]>0)pT[k]-=dt;
    if(ropeFx.t>0)ropeFx.t-=dt;
    for(const u of pups)if(!u.got&&!u.between&&u.lane===p.lane&&Math.abs(p.x-u.x)<5&&hands()>=u.y-6&&hands()<u.y+10)getPup(u);
    pups=pups.filter(u=>!u.got&&u.y>camY-20);
    if(chain&&T-lastGemT>2)breakChain();
    if(hintT>0)hintT-=dt;
    // after each trap, keep `w` seconds of travel clear (less of it at high speed, so the late game stays busy)
    while(nextY<p.y+230){const w=spawnAt(nextY);nextY+=150-100*diff(nextY)+Math.random()*40+w*spAt(nextY)*(1-.35*diff(nextY))}
    for(const o of traps){
      // a triggered trap that can't aim fairly right now keeps trying for a moment as the layout scrolls
      if(o.st==='wait'){if(p.y>=o.ty){if(TR[o.type].start(o))o.st=o.st==='wait'?'on':o.st;else if((o.tries=(o.tries||0)+1)>40){o.dead=true;fireWave()}}}
      else TR[o.type].tick(o,dt);
    }
    traps=traps.filter(o=>!o.dead);
    for(const w of waves)if(p.y>=w.ty){w.done=true;fireWave()}
    waves=waves.filter(w=>!w.done);

    // fragile vines: timer starts on grab, snaps after FRAG seconds
    for(const s of segs){
      if(s.type!=='F'||s.broken)continue;
      if(s.t<0&&onSeg(s)&&Math.abs(p.x-LX[s.lane])<5){s.t=0;snd(150,120,.15,'square',.04)}
      if(s.t>=0&&(s.t+=dt)>=FRAG){
        s.broken=true;shake=Math.max(shake,2);snd(300,60,.2,'square',.06);
        for(let i=0;i<14;i++)parts.push({x:LX[s.lane]+Math.random()*4-2,y:Math.max(s.y0,camY)+Math.random()*Math.min(s.y1-s.y0,H),vy:Math.random()*40,l:1,c:Math.random()<.5?'h':'o'});
      }
    }

    for(const s of spikes){
      if(s.st==='warn'){
        const b=s.w;s.w-=dt;
        if(b>=s.sw&&s.w<s.sw){
          // decided before the "!" ever shows: if this drop could leave you nowhere to go, it never appears
          const m=meetAhead(spikeV(),s.w);
          if(onlyWay(s.lane,m-20,m+42)){s.st='gone';continue}
          s.m=m;snd(880,880,.05,'square',.03);
        }
        if(s.w<=0){const m=meetY(spikeV());if(onlyWay(s.lane,m-6,m+30)){if((s.hold=(s.hold||0)+dt)>HOLD)s.st='gone'}else{s.st='fall';s.y=camY+H+4}}}
      else if(s.st==='fall'){s.y-=spikeV()*dt;
        if(s.y<p.y+16&&s.y+13.5>p.y&&Math.abs(p.x-LX[s.lane])<7){hit();s.st='gone'}
        else if(!s.chk&&s.y<p.y+8){s.chk=true;if(s.lane!==p.lane&&s.lane===p.prevLane&&T-p.switchT<.6)close('CLOSE')}}
    }
    spikes=spikes.filter(s=>s.st!=='gone'&&!(s.st==='fall'&&s.y<camY-20));

    for(const j of jets){
      const L=j.side<0,mx=L?13:131;
      if(j.st==='idle'&&(j.y-(p.y+8))/speed<.45+.7*warnK()){
        // checked before the vent starts glowing: if it couldn't leave you a lane, it stays dark
        if(!canEscape(j.lanes,j.y-30,j.y+26))j.st='done';
        else{j.st='warn';j.t=0;j.ww=.7*warnK();snd(90,60,.4,'sawtooth',.04)}
      }
      else if(j.st==='warn'){
        if(Math.random()<.5)parts.push({x:mx,y:j.y+Math.random()*2-1,vx:-j.side*(15+Math.random()*25),vy:Math.random()*20-10,g:0,l:.3,c:Math.random()<.5?'o':'y'});
        if((j.t+=dt)>=j.ww){
          if(!canEscape(j.lanes,j.y-24,j.y+20)){if((j.hold=(j.hold||0)+dt)>HOLD){j.st='done';j.t=0}else j.t=j.ww}
          else{j.st='fire';j.t=0;shake=Math.max(shake,1.5);snd(180,50,.6,'sawtooth',.07)}
        }
      } else if(j.st==='fire'){
        j.t+=dt;
        const inY=p.y<j.y+3&&p.y+16>j.y-3,inX=L?p.x<j.reach:p.x>j.reach;
        if(inY&&inX&&!j.hitDone){j.hitDone=true;hit()}
        else if(inY&&!inX&&!j.chk&&T-p.switchT<.6&&j.lanes.includes(p.prevLane)){j.chk=true;close('CLOSE')}
        if(j.t>=.9){j.st='done';j.t=0}
      } else if(j.st==='done'&&(j.t+=dt)<1.5&&Math.random()<.2)
        parts.push({x:mx+Math.random()*2-1,y:j.y+1,vx:-j.side*4,vy:4,g:-15,l:.8,c:'#5f574f'});
    }
    jets=jets.filter(j=>j.y>camY-30);
    segs=segs.filter(s=>s.y1>camY-20);

    for(const g of gems){
      if(g.got)continue;
      if((pT.magnet>0||g.lane===p.lane&&Math.abs(p.x-LX[g.lane])<5)&&hands()>=g.y-5&&hands()<g.y+6){ // magnet: any lane
        const m0=chainMult();chain++;lastGemT=T;
        const m=chainMult(),pts=g.tier.pts*m*(pT.x2>0?2:1);
        g.got=true;bonus+=pts;gemCount++;
        if(m>m0){pops.push({s:'CHAIN X'+m,x:p.x,y:p.y+30,t:0});snd(700,1400,.15,'square',.05)}
        else if(g.bait)pops.push({s:'+'+pts,x:LX[g.lane],y:g.y+10,t:0});
        for(let i=0;i<5;i++)parts.push({x:LX[g.lane]+Math.random()*4-2,y:g.y,vy:20+Math.random()*30,vx:(Math.random()-.5)*20,l:.35,c:g.tier.base});
        snd(900+Math.min(chain,50)*10,1500+Math.min(chain,50)*10,.08,'square',.03);
      }
    }
    gems=gems.filter(g=>!g.got&&g.y>camY-20);

    if(hands()>=ropeSafeY)for(const s of segs)if(isGap(s)&&s.lane===p.lane&&Math.abs(p.x-LX[s.lane])<5&&grip()>=s.y0&&hands()<s.y1){if(rope)useRope();else die('fall');break}
    if(state==='play'&&lavaY>=p.y+2)die('burn');
  } else if(state==='dead'){
    deadT+=dt;lavaY+=10*dt;
    if(deathKind==='fall'){p.vy-=300*dt;p.y+=p.vy*dt}else p.y-=10*dt;
  }
  if(state!=='dead'){const tg=Math.max(-20,p.y-70);camY+=(tg-camY)*Math.min(1,dt*8)}
  if(Math.random()<.3)bubbles.push({x:Math.random()*W,l:.4});
  bubbles=bubbles.filter(b=>(b.l-=dt)>0);
}

function drawVines(){
  for(let l=0;l<3;l++){
    const x=LX[l]-1,ls=segs.filter(s=>s.lane===l&&s.y1>camY&&s.y0<camY+H);
    for(let wy=Math.max(30,Math.floor(camY));wy<camY+H;wy++){
      const s=ls.find(s=>wy>=s.y0&&wy<s.y1);
      if(s&&isGap(s))continue;
      const ys=sy(wy);
      if(s){ // fragile: dry, shakes, blinks red before snapping
        const jx=s.t>0&&Math.random()<.5?.5:0,red=s.t>FRAG*.45&&(T*12|0)%2,edge=red?'#be1250':'#742f29';
        f(x+jx,ys,.5,1,edge);f(x+.5+jx,ys,1,1,red?'r':(wy%5<2?'#c98a4b':'h'));f(x+1.5+jx,ys,.5,1,edge);
        if(wy%7===0)f(x+jx+(wy%14?1.5:-.5),ys,1,.5,'#742f29');
        continue;
      }
      f(x,ys,.5,1,'g');f(x+.5,ys,1,1,'G');f(x+1.5,ys,.5,1,'g');
      f(x+((wy%6)<3?.5:1),ys,.5,.5,'#a8e72e');
      if(wy%10===0){const h=hash(l*97+wy);

        else if(h>.45){f(x-1,ys,1,.5,'g');f(x-2,ys-.5,1.5,.5,'G');f(x-2.5,ys-1,1,.5,'G');f(x-1.5,ys-.5,.5,.5,'#a8e72e')}
      }

      f(x+.5,b,.5,1.5,c);f(x+1.5,b,.5,1,c2);f(x-.5,b+1,.5,.5,c);

// faceted 4-sided gem (a tall rhombus, pointed top/bottom): a dark outline keeps it off the green vines,
// and its width pulses with a cosine to fake a 3D spin, swapping which facet catches the light as it turns.
function drawGem(x,y,tier,ph){
  const c=Math.cos(T*2.4+ph),facing=c>=0,sc=.4+.6*Math.abs(c),maxW=2.8;
  for(let row=-3;row<=3;row++){
    let hw=maxW*(1-Math.abs(row)/3.5)*sc;
    if(hw<.35)hw=.35;
    const ry=y+row,L=facing?tier.light:tier.dark,R=facing?tier.dark:tier.light;
    f(x-hw-.5,ry,hw+.5,1,tier.line);
    f(x-hw,ry,hw,1,L);
    f(x,ry,hw,1,R);
    f(x+hw,ry,.5,1,tier.line);
  }
  if(Math.abs(c)>.3)f(x-.5,y-1.5,.5,.5,'w');
}
function drawGems(){
  for(const g of gems){
    if(g.got)continue;
    const ys=sy(g.y);
    if(ys<-10||ys>H+10)continue;
    // magnet: gems slide across toward you as they come level
    const pull=pT.magnet>0&&state==='play'?Math.max(0,Math.min(1,1-(g.y-hands())/36)):0;
    drawGem(LX[g.lane]+(p.x-LX[g.lane])*pull,ys+Math.sin(T*3+g.ph)*.8,g.tier,g.ph);
  }
}
function drawIcon(k,x,y){

  else if(k==='rope'){const c='#e0a060';f(x-2,y-3,4,1,c);f(x-2,y+2,4,1,c);f(x-3,y-2,1,4,c);f(x+2,y-2,1,4,c);f(x+2,y+2,2,1,c);f(x-1,y-1,2,2,'h')}
  else if(k==='magnet'){f(x-3,y-3,2,5,'r');f(x+1,y-3,2,5,'r');f(x-3,y+1,6,2,'r');f(x-3,y-3,2,1.5,'w');f(x+1,y-3,2,1.5,'w')}
  else if(k==='x2')txt('X2',x-3.5,y-2.5,1,'y',false);
  else{f(x-.5,y-3,1,6,'b');f(x-3,y-.5,6,1,'b');for(const [a,b] of [[-2,-2],[1,-2],[-2,1],[1,1]])f(x+a,y+b,1,1,'w');f(x-.5,y-.5,1,1,'w')}
}

function drawLava(){

function drawPlayer(){

  else if(state==='intro'&&it<2)drawSpr(STAND,x,y,tint);
  else if(state==='dead')drawSpr(FALL,x,y,tint);
  else if(p.stun>0)drawSpr(HIT,x,y,tint);

  if(state==='intro'&&it>=1.3&&it<2&&(T*8|0)%2)txt('!',x+5,y-8,1,'y');
  if(state==='play'){
    if(shield)for(let a=0;a<16;a++){const an=a/16*6.283+T*2;f(p.x+Math.cos(an)*9-.5,y+9+Math.sin(an)*11-.5,1,1,a%2?'b':'w')}
    if(ropeFx.t>0)f(Math.min(ropeFx.x0,p.x),y+4,Math.abs(ropeFx.x0-p.x),1,'#e0a060');
    if(hands()<ropeSafeY)f(p.x-.5,sy(ropeSafeY),1,Math.max(0,y+2-sy(ropeSafeY)),'#e0a060'); // hauled up the rope
    // what you're carrying shows on the explorer himself: rope coil on the hip, timed power-ups as icons over
    // his head (blinking when nearly out) plus a small effect each: gems-in dots, gold sparkles, frost
    if(rope){const c='#e0a060';f(p.x+5,y+10,3,1,c);f(p.x+5,y+13,3,1,c);f(p.x+4,y+11,1,2,c);f(p.x+8,y+11,1,2,c)}
    const act=['magnet','x2','cool'].filter(k=>pT[k]>0);
    act.forEach((k,i)=>{if(pT[k]>1.5||(T*8|0)%2){const ix=p.x+(i-(act.length-1)/2)*9;f(ix-4,y-11,8,8,'k');drawIcon(k,ix,y-7)}}); // dark tile so they read over vines and gems
    if(pT.magnet>0)for(let i=0;i<4;i++){const r=12-((T*24+i*3)%10),s=i%2?1:-1;f(p.x+s*r-.5,y+5+i*3,1,1,'r')}
    if(pT.x2>0)for(let i=0;i<5;i++){const h=hash(i*13+(T*6|0));if(h>.4)f(p.x-8+hash(i*7+(T*6|0)+3)*16,y+hash(i*5+(T*6|0)+9)*18,1,1,h>.7?'w':'y')}
    if(pT.cool>0)for(let i=0;i<5;i++){const yy=(T*14+i*5)%20;f(p.x-8+hash(i*31)*16+Math.sin(T*3+i)*1.5,y-1+yy,1,1,i%2?'b':'w')}
  }
}

function drawHud(){
  if(state==='title'){
    txt('DUNGEON','c',40,4,'o');txt('CLIMB','c',64,4,'G');
    if((T*2|0)%2===0)txt('TAP TO START','c',140,1,'w');
    txt('SWIPE OR ARROWS','c',156,1,'l');
    txt('HI '+best,'c',172,1,'y');
    return;
  }
  const m=height();
  txt(''+score(),16,8,2,'w');txt(m+'M',16,22,1,'l');
  if(combo>1&&T-comboT<3)txt('X'+combo,16+tw(''+score(),2)+4,8,1,'y');
  const hi='HI '+best;txt(hi,128-tw(hi,1),state==='play'?20:10,1,'y');
  if(gemCount>0){drawGem(20,34,GEM_TIERS[0],0);txt('x'+gemCount,26,31,1,'y');
    // chain multiplier, blinking when it's about to run out
    const cm=chainMult();if(cm>1&&state==='play'&&(T-lastGemT<1.2||(T*10|0)%2))txt('X'+cm,30+tw(''+gemCount,1)+3,31,1,'o')}
  for(const q of pops){const tx=Math.max(14,Math.min(130-tw(q.s,1),Math.round(q.x-tw(q.s,1)/2)));
    if(q.t<.7||(T*12|0)%2)txt(q.s,tx,sy(q.y)-q.t*20,1,'y')}
  if(state==='play'){
    const gap=p.y-lavaY,hgt=Math.max(0,Math.min(1,gap/110))*80;
    f(4,40,4,80,'n');f(5,122,2,1,'o');f(4,123,4,3,'o');f(5,124,2,2,'y');f(3,124,1,1,'r');f(8,124,1,1,'r');f(4,120-hgt,4,hgt,gap<40?((T*8|0)%2?'r':'o'):'G');
    if(playT<2.5&&(T*3|0)%2===0)txt('SWIPE < >','c',110,1,'w');
    // held charms, then a draining bar for each timed power-up
    {let hx=18;if(shield){drawIcon('shield',hx,47);hx+=10}if(rope)drawIcon('rope',hx,47);
      let hy=56;for(const k of ['magnet','x2','cool'])if(pT[k]>0){drawIcon(k,18,hy);f(24,hy-1,12,2,'k');f(24,hy-1,12*pT[k]/PUPS[k].t,2,PUPS[k].c);hy+=9}}
    if(hintT>0&&!paused){txt('LAVA IS CLOSE!','c',226,1,'y');if((T*4|0)%2===0)txt('DO NOT GET HIT AGAIN!','c',236,1,'w')}
    if(!paused){for(const x of [122,126]){f(x+.5,8.5,2,7,'k');f(x,8,2,7,'w')}}
    else if(resumeT>0)txt(''+Math.ceil(resumeT/.7),'c',100,4,'w');
    else{
      for(let y=0;y<H;y+=2)for(let x=(y>>1)&1;x<W;x+=2)f(x,y,1,1,'k');
      txt('PAUSED','c',90,2,'o');
      if((performance.now()/500|0)%2===0)txt('TAP TO RESUME','c',120,1,'w');
      {const s='SOUND: '+(muted?'OFF':'ON'),x0=(W-tw(s,1))>>1;f(x0-6,145,tw(s,1)+12,13,'l');f(x0-5,146,tw(s,1)+10,11,'k');txt(s,x0,149,1,muted?'l':'G')}
    }
  }
  if(state==='dead'){
    for(let y=0;y<H;y+=2)for(let x=(y>>1)&1;x<W;x+=2)f(x,y,1,1,'k');
    f(17,59,110,126,'l');f(18,60,108,124,'k'); // solid panel so the text reads over lava
    txt(deathKind==='fall'?'YOU FELL!':'TOO HOT!','c',70,2,'o');
    txt('SCORE '+score(),'c',98,1,'w');
    txt('HEIGHT '+m+'M','c',108,1,'l');
    txt('CLOSE CALLS '+closes,'c',118,1,'l');
    txt('GEMS '+gemCount,'c',128,1,'y');
    txt('BEST '+best,'c',140,1,'y');
    if(newBest&&(T*4|0)%2)txt('NEW BEST!','c',152,1,'G');
    if(deadT>.8&&(T*2|0)%2===0)txt('TAP TO RETRY','c',172,1,'w');
  }
}

function draw(){
  cx.save();
  if(shake>0)cx.translate(Math.round((Math.random()-.5)*shake)*S,Math.round((Math.random()-.5)*shake)*S);
  drawBg();drawVines();drawGems();drawPups();drawTrapsBack();drawObstacles();drawPlayer();drawFlames();drawTrapsFront();drawLava();
  cx.restore();
  if(state==='play'&&(surge>0||caught)){ // lava at your heels: red pulse on the screen edges
    const a=.12+.08*Math.sin(T*12);
    cx.globalAlpha=a;f(0,0,6,H,'r');f(W-6,0,6,H,'r');f(0,0,W,5,'r');
    cx.globalAlpha=a*.5;f(6,5,4,H,'r');f(W-10,5,4,H,'r');f(6,5,W-12,3,'r');cx.globalAlpha=1;
  }
  drawHud();
}

let last=performance.now();
function loop(t){update(Math.min(.05,(t-last)/1000));last=t;draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);

function fit(){const s=Math.min(innerWidth/W,innerHeight/H);cv.style.width=W*s+'px';cv.style.height=H*s+'px'}
addEventListener('resize',fit);fit();

// fairness checks: open the game with ?bot in the address, then run botCheck() in the console (see tools/botcheck.js)
if(/[?&]bot\b/.test(location.search)){const s=document.createElement('script');s.src='tools/botcheck.js';document.body.appendChild(s)}

// input: swipe, tap, keys
let down=false,sx0=0,sy0=0,swiped=false;
const stage=document.getElementById('stage');
stage.addEventListener('pointerdown',e=>{unlock();down=true;swiped=false;sx0=e.clientX;sy0=e.clientY});
stage.addEventListener('pointermove',e=>{if(down&&!swiped&&Math.abs(e.clientX-sx0)>22){move(e.clientX>sx0?1:-1);swiped=true}});
addEventListener('pointerup',()=>{if(down&&!swiped)tap(sx0,sy0);down=false});
// switching apps or locking the phone pauses the run
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});
addEventListener('keydown',e=>{
  unlock();
  if(e.key==='ArrowLeft'||e.key==='a')move(-1);
  else if(e.key==='ArrowRight'||e.key==='d')move(1);
  else if(e.key==='p'||e.key==='Escape'){if(paused)resume();else pause()}
  else if(e.key==='m')setMute(!muted);
  else if(e.key===' '||e.key==='Enter'){tap();e.preventDefault()}
});
</script>
