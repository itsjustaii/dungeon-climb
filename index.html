<!DOCTYPE html>

<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}

#crt{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(rgba(0,0,0,.28) 0 1px,transparent 1px 3px);box-shadow:inset 0 0 60px rgba(0,0,0,.85)}
</style>

<body>
<div id="stage">
<div id="wrap">
<canvas id="g" width="288" height="512" role="img" aria-label="Dungeon Climb game. Swipe or use arrow keys to switch vines; tap or press space to start."></canvas>
<div id="crt"></div>
</div>
</div>
<script>
const W=144,H=256,cv=document.getElementById('g'),cx=cv.getContext('2d'),wrap=document.getElementById('wrap');
// PICO-8 style palette
const P={k:'#000000',n:'#1d2b53',u:'#7e2553',g:'#008751',h:'#ab5236',d:'#5f574f',l:'#c2c3c7',w:'#fff1e8',r:'#ff004d',o:'#ffa300',y:'#ffec27',G:'#00e436',b:'#29adff',v:'#83769c',s:'#ffccaa'};
const LX=[40,72,104];
const WARM=400; // height of the slow, sparse warm-up at the start of a run

// explorer: authored at 16x24, upscaled 1.5x (Scale3x then halved) to 24x36 fine px = 12x18 world, auto outline
const SPC={o:'#291814',H:'#ab5236',h:'#742f29',d:'#5a3a22',s:'#ffccaa',z:'#e0a07a',B:'#29adff',b:'#065ab5',n:'#c9a66b',N:'#8a6a45',p:'#5f574f',P:'#3a3438',w:'#5a3a22'};
const at=(o,rows)=>{const a=[];rows.forEach((s,i)=>a[o+i]=s);return a};
function scale3(g){
  const h=g.length,w=g[0].length,o=[],at=(r,c)=>r<0||r>=h||c<0||c>=w?'.':g[r][c];
  for(let r=0;r<h*3;r++)o[r]=[];
  for(let r=0;r<h;r++)for(let c=0;c<w;c++){
    const A=at(r-1,c-1),B=at(r-1,c),C=at(r-1,c+1),D=at(r,c-1),E=at(r,c),F=at(r,c+1),G=at(r+1,c-1),H=at(r+1,c),I=at(r+1,c+1);
    const e=[E,E,E,E,E,E,E,E,E];
    if(B!==H&&D!==F){
      e[0]=D===B?D:E;e[1]=(D===B&&E!==C)||(B===F&&E!==A)?B:E;e[2]=B===F?F:E;
      e[3]=(D===B&&E!==G)||(D===H&&E!==A)?D:E;e[5]=(B===F&&E!==I)||(H===F&&E!==C)?F:E;
      e[6]=D===H?D:E;e[7]=(D===H&&E!==I)||(H===F&&E!==G)?H:E;e[8]=H===F?F:E;
    }
    for(let i=0;i<9;i++)o[r*3+(i/3|0)][c*3+i%3]=e[i];
  }
  return o.filter((_,r)=>r%2===0).map(row=>row.filter((_,c)=>c%2===0));
}
function build(flip,...ls){
  let g=[];
  for(let r=0;r<24;r++){g[r]=[];for(let c=0;c<16;c++){let ch='.';
    for(const L of ls){const k=L[r]&&L[r][flip?15-c:c];if(k&&k!=='.')ch=k}g[r][c]=ch}}
  g=scale3(g);
  const h=g.length,w=g[0].length,on=(r,c)=>r>=0&&r<h&&c>=0&&c<w&&g[r][c]!=='.',px=[];
  for(let r=-1;r<=h;r++)for(let c=-1;c<=w;c++){
    if(on(r,c))px.push([c+1,r+1,SPC[g[r][c]]]);
    else if(on(r-1,c)||on(r+1,c)||on(r,c-1)||on(r,c+1))px.push([c+1,r+1,null]);
  }
  return px;
}
// back view (climbing)
const BACK=at(4,[
"......HHHH......",
".....HHHHHH.....",
".....hHHHHh.....",
".....oooooo.....",
"....hHHHHHHh....",
".....dddddd.....",
"....bBBzzBBb....",
"...bBNNNNNNBb...",
"...bBnNNNNnBb...",
"...bBnnnnnnBb...",
"...bBnnnnnnBb...",
"...bBnNNNNnBb...",
"....bNNNNNNb....",
"....oooooooo...."]);
const ARM_HI=at(0,[
".....ss.........",
".....ss.........",
"....zs..........",
"....zs..........",
"...zs...........",
"...zs......ss...",
"..bB.......ss...",
"..bB........sz..",
"..bB........sz..",
"..bB........Bb..",
"..bB........Bb.."]);
const ARM_MID=at(2,[
"....ss....ss....",
"....ss....ss....",
"....zs....sz....",
"...zs......sz...",
"..zs........sz..",
"..bB........Bb..",
"..bB........Bb..",
"..bB........Bb..",
"..bB........Bb.."]);
const ARM_HIT=at(10,[
"sszbB......Bbzss",
"zz..b......b..zz"]);
const ARM_UP=at(1,[
"s..............s",
"ss............ss",
".z............z.",
".zs..........sz.",
"..z..........z..",
"..Bb........bB..",
"..BB........BB..",
"..bB........Bb..",
"..bB........Bb..",
"...B........B..."]);
const LEG_KNEE=at(18,[
"....ppP..Pppp...",
"....ppP..Pppp...",
"....ppP...www...",
"....ppP...www...",
"....www.........",
"...wwww........."]);
const LEG_MID=at(18,[
"....ppP..Ppp....",
"....ppP..Ppp....",
"....ppP..Ppp....",
"....www..www....",
"....www..www...."]);
const LEG_HANG=at(18,[
"....ppP..Ppp....",
"....ppP..Ppp....",
"....ppP..Ppp....",
"....ppP..Ppp....",
"....www..www....",
"....www..www...."]);
const LEG_SPLAY=at(18,[
"...pPp....pPp...",
"..pPp......pPp..",
"..pP........Pp..",
".pP..........Pp.",
".ww..........ww."]);
const CLIMB_A=build(false,BACK,ARM_HI,LEG_KNEE),CLIMB_B=build(false,BACK,ARM_MID,LEG_MID);
const CLIMB=[CLIMB_A,CLIMB_B,build(true,BACK,ARM_HI,LEG_KNEE),CLIMB_B];
const HIT=build(false,BACK,ARM_HIT,LEG_HANG),FALL=build(false,BACK,ARM_UP,LEG_SPLAY);
// side view facing right (intro run)
const SIDE=at(4,[
"......HHHH......",
".....HHHHHH.....",
".....hHHHHH.....",
".....oooooo.....",
"....hHHHHHHHHH..",
".....ddsssss....",
".....ddsssos....",
".....dzssssss...",
".......zsss.....",
"....NnBBBBb.....",
"...NnnBBBBb.....",
"...NnnBBBBb.....",
"...NnnbBBBb.....",
"....NnbBBb......",
".....oooooo....."]);
const RARM_BACK=at(13,[
"........B.......",
".......bB..b....",
"......Bb....z...",
".....zs.....zz.."]);
const RARM_FWD=at(13,[
"........B.......",
"........Bb......",
".........Bs.....",
"..........sz...."]);
const RARM_MID=at(13,[
"........B.......",
"........Bb......",
"........zs......"]);
const RLEG=[at(19,[
"......pppp......",
".....Ppp.pp.....",
"....Pp....pp....",
"...Pp......pp...",
"..ww.......www.."]),at(19,[
"......pppp......",
"......pPPP......",
"......p..PP.....",
"......p...w.....",
".....ww........."]),at(19,[
"......pppp......",
".....ppp.PP.....",
"....pp....PP....",
"...pp......PP...",
"..ww.......www.."]),at(19,[
"......pppp......",
"......Pppp......",
"......P..pp.....",
"......P...w.....",
".....ww........."])];
const RUN=[build(false,SIDE,RARM_BACK,RLEG[0]),build(false,SIDE,RARM_MID,RLEG[1]),build(false,SIDE,RARM_FWD,RLEG[2]),build(false,SIDE,RARM_MID,RLEG[3])];
const STAND=build(false,SIDE,RARM_MID,at(19,[
"......pppp......",
"......pp.pp.....",
"......pp.pp.....",
"......pp.pp.....",
".....www.www...."]));

const FD="A010101111101101B110101110101110C011100100100011D110101101101110E111100110100111F111100110100100G011100101101011H101101111101101I111010010010111J001001001101010K101101110101101L100100100100111M101111111101101N110101101101101O010101101101010P110101110100100Q010101101110011R110101110101101S011100010001110T111010010010010U101101101101111V101101101101010W101101111111101X101101010101101Y101101010010010Z1110010101001110111101101101111101011001001011121100010101001113110001010001110410110111100100151111001100011106011100111101111711100101001001081111011111011119111101111001110!010010010000010-000000111000000:000010000010000<001010100010001>100010001010100.000000000000010?110001010000010+000010111010000";
const F={};for(let i=0;i<FD.length;i+=16)F[FD[i]]=FD.substr(i+1,15);

let best=0;try{best=+localStorage.getItem('lavaclimb_best')||0}catch(e){}

// game logic runs in 144x256 world units; drawing is S times finer
const S=2;
const f=(x,y,w,h,c)=>{cx.fillStyle=P[c]||c;const x0=Math.round(x*S),y0=Math.round(y*S);cx.fillRect(x0,y0,Math.round((x+w)*S)-x0,Math.round((y+h)*S)-y0)};
const hash=n=>{const s=Math.sin(n*127.1)*43758.5453;return s-Math.floor(s)};
const tw=(s,sc)=>s.length*4*sc-sc;
function txt(s,x,y,sc,c,sh=true){
  if(x==='c')x=(W-tw(s,sc))>>1;
  if(sh)txt(s,x+sc,y+sc,sc,'k',false);
  for(let i=0;i<s.length;i++){const g=F[s[i]];if(!g)continue;
    for(let j=0;j<15;j++)if(g[j]==='1')f(x+i*4*sc+(j%3)*sc,y+(j/3|0)*sc,sc,sc,c)}
}
function drawSpr(px,x,y,tint){
  const bx=Math.round(x*S)-1,by=Math.round(y*S)-1;
  for(const [c,r,col] of px){cx.fillStyle=col?(tint?P[tint]:col):'#120a10';cx.fillRect(bx+c,by+r,1,1)}
}

// sound
let ac;
function unlock(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();ac.resume()}catch(e){}}
function snd(f1,f2,d,type='square',vol=.05){
  if(!ac)return;try{const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();
  o.type=type;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
  o.connect(g).connect(ac.destination);o.start(t);o.stop(t+d)}catch(e){}
}

let state='title',T=0,p,camY,lavaY,spikes,waves,jets,traps,deck,known,lastKind,segs,genY,nextY,it,playT,deadT,speed,shake,newBest,deathKind,bubbles,parts,pops,bonus,combo,comboT,closes;
function reset(){
  p={lane:1,x:-6,y:0,stun:0,inv:0,anim:0,vy:0,prevLane:1,switchT:-9};
  camY=-20;lavaY=-24;spikes=[];waves=[];jets=[];traps=[];deck=[];known=new Set();lastKind=null;segs=[];genY=90;bubbles=[];parts=[];pops=[];
  nextY=WARM+100;it=0;playT=0;deadT=0;speed=42;shake=0;newBest=false;bonus=0;combo=0;comboT=-9;closes=0;
}
reset();

const sy=wy=>H-(wy-camY);
const r3=()=>Math.random()*3|0;
const hands=()=>p.y+16;
const isGap=s=>s.type==='G'||s.broken;
const onSeg=s=>s.lane===p.lane&&hands()>=s.y0&&hands()<s.y1;
let deadY=0;
const curY=()=>state==='dead'?deadY:p.y;
const height=()=>Math.max(0,Math.floor(curY()/8));
const score=()=>height()+bonus;

// slow, sparse warm-up for the first ~10s (learn the swipes), then a steep ramp: ~90 at one minute, creeping toward 140
const spAt=y=>Math.min(140,42+98*(1-Math.exp(-Math.max(0,y-WARM)/4500)));
const diff=y=>Math.min(1,Math.max(0,y-WARM)/11000);
// warning times start generous and shrink as you climb (1.35x at the start, 0.6x at the top)
const warnK=()=>1.35-.75*diff(p.y);
const FRAG=.9; // fragile vines snap this many seconds after you grab them

// hand-made sections stitched together (Subway Surfers style). m() mirrors lanes left/right.
// c: sp speed, d difficulty, g gap length, W window between rows (shrinks with speed), S = g+W
const G=(l,a,b)=>segs.push({lane:l,type:'G',y0:a,y1:b});
const Fv=(l,a,b)=>segs.push({lane:l,type:'F',y0:a,y1:b,t:-1,broken:false});
const others=o=>[0,1,2].filter(l=>l!==o);
// breaks one or two vines starting at y. two breaks start together (so you see both at once and pick the open
// vine), but never stop at the same height, so it doesn't read as a wall. returns where the last break ends.
function block(lanes,y,g){
  if(lanes.length===1){G(lanes[0],y,y+g);return y+g}
  const d2=10+Math.random()*8,g2=g>=40&&Math.random()<.5?g-d2:g+d2,off=Math.random()*3;
  G(lanes[0],y,y+g);G(lanes[1],y+off,y+off+g2);return Math.max(y+g,y+off+g2);
}
// rows of breaks leaving open[i] open each time, with a window W after each row ends
const seq=(y,W,g,blocked)=>{let yy=y;for(const ls of blocked)yy=block(ls,yy,g)+W;return yy-W-y};
const rows=(y,W,g,open)=>seq(y,W,g,open.map(others));
// tiers: d = difficulty when the section unlocks; w = weight when it unlocks -> weight at max difficulty.
// early on you only get single isolated gaps; combos come in as you climb.
const SECTIONS=[
  {d:0,w:[3,.2],f:(y,m,c)=>{G(r3(),y,y+c.g);return c.g}},
  {d:0,w:[1.5,.1],f:(y,m,c)=>20+Math.random()*30*(1-c.d)},
  {d:.03,w:[3,1.2],f:(y,m,c)=>rows(y,c.W,c.g,[r3()])},
  {d:.05,w:[2,1.2],f:(y,m,c)=>{const st=c.g+Math.max(18,c.sp*(.36-.08*c.d));for(let i=0;i<3;i++)G(m(i),y+i*st,y+i*st+c.g);return st*2+c.g}},
  {d:.05,w:[1.5,.8],f:(y,m,c)=>{const o=Math.random()<.5?1:m(0);return block(others(o),y,c.S*1.6)-y}},
  {d:.12,w:[2,3],f:(y,m,c)=>rows(y,c.W,c.g,[m(0),m(1),m(2)])},
  {d:.12,w:[1.5,2],f:(y,m,c)=>{const a=r3();return rows(y,c.W,c.g,[a,a===1?m(0):1])}},
  // checker: middle open, then sides open, then middle...
  {d:.2,w:[1.5,2],f:(y,m,c)=>{const n=3+(Math.random()<c.d?1:0),b=[];for(let i=0;i<n;i++)b.push(i%2?[1]:[0,2]);return seq(y,c.W,c.g,b)}},
  {d:.35,w:[1.5,2.5],f:(y,m,c)=>rows(y,c.W,c.g,[m(0),m(1),m(0),m(1)])},
  // crossfire: open lane jumps from one side to the other (needs a double swipe, so the window is wider)
  {d:.35,w:[1,2],f:(y,m,c)=>rows(y,Math.max(30,c.sp*(.5-.1*c.d)),c.g,[m(0),m(2)])},
];
// fast-crumbling fragile pieces mixed into the layout; short enough to climb over unless you get stunned on one
function sprinkleFragile(a,b,sp,d){
  for(let l=0;l<3;l++){
    if(Math.random()>.3+.35*d)continue;
    const len=sp*(.55+Math.random()*.2);
    // never on your only way through: somewhere alongside it there must always be another lane without a gap
    const alt=y0=>{for(let y=y0-10;y<=y0+len+10;y+=6)if(!others(l).some(q=>!segs.some(s=>s.lane===q&&s.type==='G'&&s.y0<y+6&&s.y1>y-6)))return false;return true};
    for(let k=0;k<10;k++){const y0=a+Math.random()*Math.max(0,b-a-len);if(clearAt(l,y0-6,y0+len+6)&&alt(y0)){Fv(l,y0,y0+len);break}}
  }
}
function placeSection(){
  const y=genY,d=diff(y),sp=spAt(y),g=Math.round((14+Math.random()*6)*Math.max(1,sp/60)+d*4),W=Math.max(20,sp*(.42-.12*d)),S=g+W;
  const ok=SECTIONS.filter(s=>d>=s.d),wt=s=>s.w[0]+(s.w[1]-s.w[0])*Math.min(1,(d-s.d)/(1-s.d));
  let r=Math.random()*ok.reduce((t,s)=>t+wt(s),0),sec=ok[0];
  for(const s of ok)if((r-=wt(s))<=0){sec=s;break}
  const flip=Math.random()<.5,len=sec.f(y,l=>flip?2-l:l,{sp,d,g,S,W});
  // breathing room between sections: wide during the warm-up, still enough for a double swipe at top speed
  genY=y+len+(y<WARM?60+Math.random()*30:Math.max(16,sp*(.5-.2*d))+Math.random()*8);
  if(y>WARM+200)sprinkleFragile(y-10,genY,sp,d);
}

function close(label){
  combo=T-comboT<3?combo+1:1;comboT=T;closes++;
  const pts=10*combo;bonus+=pts;
  pops.push({s:label+' +'+pts,x:p.x,y:p.y+22,t:0});
  snd(660,1320,.1,'square',.04);
}

function move(d){
  if(state!=='play')return;
  const n=Math.max(0,Math.min(2,p.lane+d));
  if(n===p.lane)return;
  for(const s of segs){
    if(s.lane!==p.lane)continue;
    const dist=s.y0-hands();
    if(isGap(s)&&dist>=0&&dist<10){close('DODGE');break}
    if(s.type==='F'&&!s.broken&&s.t>FRAG*.65&&onSeg(s)){close('CLUTCH');break}
  }
  p.prevLane=p.lane;p.switchT=T;p.lane=n;snd(520,880,.06);
}
function tap(){
  if(state==='title'){state='intro';snd(330,660,.15)}
  else if(state==='dead'&&deadT>.8){reset();state='intro';snd(330,660,.15)}
}
function die(kind){
  deadY=p.y;state='dead';deathKind=kind;deadT=0;p.vy=0;shake=6;
  if(score()>best){best=score();newBest=true;try{localStorage.setItem('lavaclimb_best',best)}catch(e){}}
  snd(440,40,.8,'sawtooth',.07);
}
function hit(){
  if(p.inv>0)return;
  const ny=p.y-6;
  if(!segs.some(s=>isGap(s)&&s.lane===p.lane&&ny+16<s.y1&&p.y+16>=s.y0))p.y=ny;
  p.stun=.45;p.inv=1;shake=5;combo=0;snd(220,50,.25,'sawtooth',.08);
}

// fire jets: a wall vent warns, then fire covers 1-2 lanes from its side.
// never placed so that every uncovered lane has a gap at that height.
const jetLanes=(side,n)=>(side<0?[0,1]:[2,1]).slice(0,n);
const clearAt=(l,a,b)=>!segs.some(s=>s.lane===l&&s.y0<b&&s.y1>a);
// is lane l (between heights a..b) already covered by another trap that's set up or going off?
function laneThreat(l,a,b){
  for(const o of traps){
    if(o.st==='wait'||o.dead)continue;
    if(o.type==='wall'&&o.y<b&&o.y+o.len>a&&((o.both||o.side<0)&&l===0||(o.both||o.side>0)&&l===2))return true;
    if(o.type==='geyser'&&o.steps&&o.steps.some(s=>s.ph!=='done'&&s.lanes.includes(l)))return true;
    if(o.type==='coil'&&o.y<b+20&&o.y>a-20&&(o.lane===l||(o.dir&&o.lane+o.dir===l)))return true;
    if(o.type==='blade'&&o.y-10<b&&o.Py-25>a)return true;
  }
  return jets.some(j=>j.st!=='done'&&j.lanes.includes(l)&&j.y>a-6&&j.y<b+6);
}
// an escape lane must be free of gaps and other traps: sitting on a fragile piece is fine while nothing hits you there
const gapFree=(l,a,b)=>!segs.some(s=>s.lane===l&&s.type==='G'&&s.y0<b&&s.y1>a)&&!laneThreat(l,a,b);
// triggered traps start this far below their spot so they go off around where the spawner placed them
const trig=y=>Math.max(150,spAt(y)*1.4);
// last-moment safety net, checked when a trap actually launches (its timing is exact by then):
// is lane l your only way through between heights a..b? if so the trap fizzles instead of firing.
const onlyWay=(l,a,b)=>others(l).every(q=>!gapFree(q,a,b));
// where your feet will be when something launched from the top of the screen, closing at v, reaches you
const meetY=v=>p.y+speed*(camY+H+4-(p.y+19))/(v+speed);

// each spawner returns seconds of travel to keep free after it (so traps don't stack),
// or null if it couldn't be placed fairly.
const SPAWN={
  wave:y=>{waves.push({ty:y-trig(y)});return 1.6},
  jet:y=>{
    const ok=(side,n)=>{const cov=jetLanes(side,n);return [0,1,2].some(l=>!cov.includes(l)&&gapFree(l,y-24,y+20+spAt(y)*.35))};
    let side=Math.random()<.5?-1:1,n=Math.random()<.2+.5*diff(y)?2:1;
    if(!ok(side,n)){if(ok(-side,n))side=-side;else if(ok(side,1))n=1;else if(ok(-side,1)){side=-side;n=1}else return null}
    jets.push({st:'idle',y,side,lanes:jetLanes(side,n),reach:side<0?LX[n-1]+6:LX[3-n]-6,t:0});return 0;
  },
  drop:y=>{traps.push({type:'drop',st:'wait',ty:y-trig(y)});return .9},
  coil:y0=>{

// traps come from a shuffled deck so every unlocked type shows up regularly; a newly unlocked type comes next.
// unlock heights in world units (8 per metre): everything is in by ~55m
const UNLOCK={wave:0,drop:WARM+80,coil:WARM+180,jet:WARM+300,bats:WARM+450,wall:WARM+600,geyser:WARM+750,blade:WARM+950};
function nextKinds(y){
  const un=Object.keys(UNLOCK).filter(k=>y>=UNLOCK[k]),fresh=un.filter(k=>!known.has(k));
  if(!deck.length){deck=[...un,'wave'].sort(()=>Math.random()-.5);if(deck[0]===lastKind)deck.push(deck.shift())}
  return [...fresh,...deck];
}
function spawnAt(y){
  for(const k of nextKinds(y).slice(0,4)){
    const r=SPAWN[k](y);
    if(r!==null){const i=deck.indexOf(k);if(i>=0)deck.splice(i,1);known.add(k);lastKind=k;return r}
  }
  return SPAWN.wave(y);
}

// small creature sprites: authored tiny, upscaled 1.5x and outlined like the explorer
function mkSpr(rows,pal){
  const g=scale3(rows.map(r=>[...r])),h=g.length,w=g[0].length,on=(r,c)=>r>=0&&r<h&&c>=0&&c<w&&g[r][c]!=='.',px=[];
  for(let r=-1;r<=h;r++)for(let c=-1;c<=w;c++){
    if(on(r,c))px.push([c+1,r+1,pal[g[r][c]]]);
    else if(on(r-1,c)||on(r+1,c)||on(r,c-1)||on(r,c+1))px.push([c+1,r+1,null]);
  }
  px.w=(w+2)/S;px.h=(h+2)/S;return px;
}
const BAT_ROWS=[
 ["w.........w","ww.......ww","www.bbb.www",".wwbrbrbww.","...bbbbb...","....b.b...."],
 ["....bbb....","...brbrb...",".wwbbbbbww.","www.....www","ww.......ww","w.........w"]];

// a hazard in `lane` passing you right after you left that lane is a close call
function passClose(o,lane,yy){
  if(!o.chk&&yy<p.y+9){o.chk=true;if(p.lane!==lane&&p.prevLane===lane&&T-p.switchT<.6)close('CLOSE')}
}
// picks the lane to attack: usually yours, only if another lane stays climbable around height a..b
function aimLane(a,b){
  const ok=l=>[0,1,2].some(q=>q!==l&&gapFree(q,a,b+speed*.35));
  // never aim at a lane you just switched into: that's the lane you escaped to
  if(T-p.switchT<.6)return [p.prevLane,...others(p.lane).filter(l=>l!==p.prevLane)].find(ok)??-1;
  const order=Math.random()<.65?[p.lane,...others(p.lane).sort(()=>Math.random()-.5)]:[r3(),0,1,2];
  return order.find(ok)??-1;
}

function bladePos(o,t){const th=o.A*Math.sin(o.w*(t+o.ph));return [72+o.L*Math.sin(th),o.Py-o.L*Math.cos(th)]}
const bladeHits=(bx,by,px,py,m=0)=>Math.abs(bx-px)<10+m&&Math.abs(by-(py+9))<13+m;
// predicts your climb past the blade(s) in each lane: needs a lane that's safe from all of them with room to spare,
// and a lane that gets hit
function bladeFair(os,sp){
  let safe=0,threat=0;
  const lo=Math.min(...os.map(o=>o.y)),top=Math.max(...os.map(o=>o.Py));
  for(let l=0;l<3;l++){
    if(!gapFree(l,lo-24,top-25))continue;
    let near=false,h=false;
    for(let t=0;t<9&&!h;t+=.02){const py=p.y+sp*t;if(py>top)break;
      for(const o of os){const [bx,by]=bladePos(o,T+t);if(bladeHits(bx,by,LX[l],py,6))near=true;if(bladeHits(bx,by,LX[l],py))h=true}}
    if(h)threat++;else if(!near)safe++;

  return safe>0&&threat>0;
}
function wallExt(o){
  const c=((T+o.ph)%o.per)/o.per;
  return c<.35?0:c<.5?.06:c<.55?(c-.5)/.05:c<.9?1:c<.95?1-(c-.9)/.05:0;
}

        for(let k=0;k<8;k++){const a=k*Math.PI/4+T*25;f(bx+Math.cos(a)*7-.5,y0+Math.sin(a)*7-.5,1,1,'l')}
        f(bx-1.5,y0-1.5,3,3,'#2a2730');};
      const [gx,gy]=bladePos(o,T-.05);cx.globalAlpha=.25;disc(gx,gy);cx.globalAlpha=1;
      const [bx,by]=bladePos(o,T);disc(bx,by);
    },
  },
};

// spike waves (Jetpack Joyride style): drops one after another, always one lane open.
// patterns: "mixed" singles and pairs, and later "stairs" that sweep across the lanes in a quick rhythm.
// each drop shows its own "!" for sw seconds before it falls; sw shrinks as you climb.
const spikeV=()=>115+speed*.6;
const spikeEta=delay=>delay+(H-82)/(spikeV()+speed);
function fireWave(){
  const d=diff(p.y),sw=.75*warnK(),stairs=d>.15&&Math.random()<.4;
  const n=stairs?3:1+Math.floor(Math.random()*(1.6+d*2.6)),gapT=stairs?.34-.1*d:.55-.2*d;
  // stairs sweep toward you from the far side, so the lane you dodge into has already been cleared
  const order=p.lane===1?(Math.random()<.5?[0,1,2]:[2,1,0]):p.lane===0?[2,1,0]:[0,1,2];
  let open=p.lane;
  for(let i=0;i<n;i++){
    const delay=sw+i*gapT,ya=hands()+speed*spikeEta(delay);
    // lanes you can be in when it lands without falling (a fragile piece is fine as long as no spike hits you there)
    const path=[0,1,2].filter(l=>gapFree(l,ya-30,ya+24+speed*.35));
    if(!path.length)continue;
    let lanes;
    if(stairs){
      const tgt=order[i];if(!path.some(l=>l!==tgt))continue;lanes=[tgt];
    } else if(i>0&&Math.random()<.35+.45*d){
      // pair: leave one lane open, at most one swipe from the last open lane
      const near=path.filter(l=>Math.abs(l-open)<=1),pool=near.length?near:path,o=pool[Math.random()*pool.length|0];
      lanes=others(o);open=o;
    } else {
      // the first drop goes for your lane (or the one you just left); later drops never go for the lane you dodge into
      let tgt;
      if(i===0)tgt=T-p.switchT<.6?p.prevLane:p.lane;
      else{const c=others(open);tgt=c[Math.random()*c.length|0]}
      if(!path.some(l=>l!==tgt))continue;
      lanes=[tgt];
      if(i===0)open=path.filter(l=>l!==tgt).sort((a,b)=>Math.abs(a-tgt)-Math.abs(b-tgt))[0];
    }
    for(const l of lanes)spikes.push({st:'warn',w:delay,sw,lane:l,y:0});
  }
}

function update(dt){
  T+=dt;shake=Math.max(0,shake-dt*12);
  for(const q of parts){q.vy-=(q.g??200)*dt;q.y+=q.vy*dt;q.x+=(q.vx||0)*dt;q.l-=dt}
  parts=parts.filter(q=>q.l>0);
  for(const q of pops)q.t+=dt;
  pops=pops.filter(q=>q.t<1);
  if(state==='title')return;
  if(state==='intro'){
    it+=dt;
    if(it<1.3){p.x=-6+78*(it/1.3);p.y=0;p.anim+=dt*10}
    else if(it<2){p.x=72;if(shake<1.5)shake=1.5;if(Math.random()<.15)snd(60,40,.12,'triangle',.08)}
    if(it>=1.6)lavaY+=14*dt;
    if(it>=2){const k=Math.min(1,(it-2)/.4);p.y=22*k+Math.sin(k*Math.PI)*10;
      if(k>=1){state='play';playT=0;p.y=22}}
  } else if(state==='play'){
    playT+=dt;
    speed=spAt(p.y);
    if(p.stun>0)p.stun-=dt;else{p.y+=speed*dt;p.anim+=dt*(8+speed*.08)}
    p.inv-=dt;
    p.x+=(LX[p.lane]-p.x)*Math.min(1,dt*18);
    lavaY+=speed*.85*Math.min(1,.4+playT/4)*dt;
    if(p.y-lavaY>110)lavaY=p.y-110;

    while(genY<p.y+300)placeSection();
    while(nextY<p.y+230){const w=spawnAt(nextY);nextY+=150-100*diff(nextY)+Math.random()*40+w*spAt(nextY)}
    for(const o of traps){
      // a triggered trap that can't aim fairly right now keeps trying for a moment as the layout scrolls
      if(o.st==='wait'){if(p.y>=o.ty){if(TR[o.type].start(o))o.st=o.st==='wait'?'on':o.st;else if((o.tries=(o.tries||0)+1)>40){o.dead=true;known.delete(o.type)}}}
      else TR[o.type].tick(o,dt);
    }
    traps=traps.filter(o=>!o.dead);
    for(const w of waves)if(p.y>=w.ty){w.done=true;fireWave()}
    waves=waves.filter(w=>!w.done);

    // fragile vines: timer starts on grab, snaps after FRAG seconds
    for(const s of segs){
      if(s.type!=='F'||s.broken)continue;
      if(s.t<0&&onSeg(s)&&Math.abs(p.x-LX[s.lane])<5){s.t=0;snd(150,120,.15,'square',.04)}
      if(s.t>=0&&(s.t+=dt)>=FRAG){
        s.broken=true;shake=Math.max(shake,2);snd(300,60,.2,'square',.06);
        for(let i=0;i<14;i++)parts.push({x:LX[s.lane]+Math.random()*4-2,y:Math.max(s.y0,camY)+Math.random()*Math.min(s.y1-s.y0,H),vy:Math.random()*40,l:1,c:Math.random()<.5?'h':'o'});
      }
    }

    for(const s of spikes){
      if(s.st==='warn'){
        const b=s.w;s.w-=dt;
        if(b>=s.sw&&s.w<s.sw)snd(880,880,.05,'square',.03);
        if(s.w<=0){const m=meetY(spikeV());if(onlyWay(s.lane,m-6,m+30))s.st='gone';else{s.st='fall';s.y=camY+H+4}}}
      else if(s.st==='fall'){s.y-=spikeV()*dt;
        if(s.y<p.y+16&&s.y+9>p.y&&Math.abs(p.x-LX[s.lane])<6){hit();s.st='gone'}
        else if(!s.chk&&s.y<p.y+8){s.chk=true;if(s.lane!==p.lane&&s.lane===p.prevLane&&T-p.switchT<.6)close('CLOSE')}}
    }
    spikes=spikes.filter(s=>s.st!=='gone'&&!(s.st==='fall'&&s.y<camY-20));

    for(const j of jets){
      const L=j.side<0,mx=L?13:131;
      if(j.st==='idle'&&(j.y-(p.y+8))/speed<.45+.7*warnK()){j.st='warn';j.t=0;j.ww=.7*warnK();snd(90,60,.4,'sawtooth',.04)}
      else if(j.st==='warn'){
        if(Math.random()<.5)parts.push({x:mx,y:j.y+Math.random()*2-1,vx:-j.side*(15+Math.random()*25),vy:Math.random()*20-10,g:0,l:.3,c:Math.random()<.5?'o':'y'});
        if((j.t+=dt)>=j.ww){
          if([0,1,2].filter(l=>!j.lanes.includes(l)).every(l=>!gapFree(l,j.y-24,j.y+20))){j.st='done';j.t=0}
          else{j.st='fire';j.t=0;shake=Math.max(shake,1.5);snd(180,50,.6,'sawtooth',.07)}
        }
      } else if(j.st==='fire'){
        j.t+=dt;
        const inY=p.y<j.y+3&&p.y+16>j.y-3,inX=L?p.x<j.reach:p.x>j.reach;
        if(inY&&inX&&!j.hitDone){j.hitDone=true;hit()}
        else if(inY&&!inX&&!j.chk&&T-p.switchT<.6&&j.lanes.includes(p.prevLane)){j.chk=true;close('CLOSE')}
        if(j.t>=.9){j.st='done';j.t=0}
      } else if(j.st==='done'&&(j.t+=dt)<1.5&&Math.random()<.2)
        parts.push({x:mx+Math.random()*2-1,y:j.y+1,vx:-j.side*4,vy:4,g:-15,l:.8,c:'#5f574f'});
    }
    jets=jets.filter(j=>j.y>camY-30);
    segs=segs.filter(s=>s.y1>camY-20);

    for(const s of segs)if(isGap(s)&&s.lane===p.lane&&Math.abs(p.x-LX[s.lane])<5&&hands()>=s.y0+1&&hands()<s.y1){die('fall');break}
    if(state==='play'&&lavaY>=p.y+2)die('burn');
  } else if(state==='dead'){
    deadT+=dt;lavaY+=10*dt;
    if(deathKind==='fall'){p.vy-=300*dt;p.y+=p.vy*dt}else p.y-=10*dt;
  }
  if(state!=='dead'){const tg=Math.max(-20,p.y-70);camY+=(tg-camY)*Math.min(1,dt*8)}
  if(Math.random()<.3)bubbles.push({x:Math.random()*W,l:.4});
  bubbles=bubbles.filter(b=>(b.l-=dt)>0);
}

function drawBg(){
  f(0,0,W,H,'#0f1830');
  for(let r=Math.floor(camY/8)-1;r*8<camY+H+8;r++){
    const ys=sy(r*8+8),off=(r&1)*8;
    for(let c=-1;c<9;c++){
      const bx=12+c*16+off,x0=Math.max(12,bx+.5),x1=Math.min(132,bx+16);
      if(x1<=x0)continue;
      const h=hash(r*31.7+c*7.3),t=hash(r*13.1+c*91.7),w=x1-x0;
      f(x0,ys+.5,w,7.5,t<.4?'#1d2b53':t<.75?'#212f5b':'#1a274c');
      f(x0,ys+.5,w,.5,'#2c3d72');
      f(x0,ys+7.5,w,.5,'#151f3f');
      if(h>.95){f(bx+4,ys+3,1,.5,'#0f1830');f(bx+5,ys+3.5,1,.5,'#0f1830');f(bx+6,ys+4,1.5,.5,'#0f1830');f(bx+7.5,ys+3.5,.5,.5,'#0f1830')}
      else if(h>.9){f(bx+5,ys+3,5,2,'#3a2448');f(bx+5.5,ys+3.5,4,1,'u')}
      else if(h>.82){f(bx+1,ys+.5,6,.5,'g');f(bx+1.5,ys+1,4,.5,'G');f(bx+2,ys+1.5,.5,1,'g');f(bx+5,ys+1.5,.5,1.5,'g')}
    }
  }
  f(0,0,12,H,'#0b0b12');f(132,0,12,H,'#0b0b12');
  for(let r=Math.floor(camY/12)-1;r*12<camY+H+12;r++){
    const ys=sy(r*12+12),o=(r&1)*3;
    for(const x of [0,132]){
      f(x+.5,ys+.5,11,11.5,'#24212b');f(x+.5,ys+.5,11,.5,'#3b3743');f(x+.5,ys+11.5,11,.5,'#16141b');
      f(x+4+o,ys+.5,.5,11.5,'#0b0b12');
    }
  }
  f(11.5,0,.5,H,'#3b3743');f(132,0,.5,H,'#3b3743');
  if(state==='play'&&speed>62){
    const n=Math.min(18,4+(speed-60)/4|0),len=speed*.3;cx.globalAlpha=Math.min(.6,.3+(speed-60)/200);
    for(let i=0;i<n;i++){const cyc=Math.floor((T*speed*2.4+i*97)/(H+len)),ys=((T*speed*2.4+i*97)%(H+len))-len;
      f(14+hash(i*13.7+cyc*3.1)*116,ys,.5,len,i%3?'#5a6ea8':'#8fa3d8')}
    cx.globalAlpha=1;
  }
  const gy=sy(0);
  if(gy<H){f(0,gy,W,H-gy,'d');f(0,gy,W,1,'l');for(let x=6;x<W;x+=14)f(x,gy+4,6,1,'k')}
  const pour=state!=='title'&&(state!=='intro'||it>=1.5);
  f(0,sy(30),16,2,'k');f(0,sy(28),20,28,'k');f(20,sy(28),2,28,'d');f(16,sy(31),4,3,'d');
  if(pour)f(0,sy(4),18,4,'o');
  f(118,sy(46),14,16,'d');f(118,sy(46),14,1,'l');f(121,sy(43),2,2,'k');f(127,sy(43),2,2,'k');
  f(120,sy(37),8,3,pour?'o':'k');
}

function drawVines(){
  for(let l=0;l<3;l++){
    const x=LX[l]-1,ls=segs.filter(s=>s.lane===l&&s.y1>camY&&s.y0<camY+H);
    for(let wy=Math.max(30,Math.floor(camY));wy<camY+H;wy++){
      const s=ls.find(s=>wy>=s.y0&&wy<s.y1);
      if(s&&isGap(s))continue;
      const ys=sy(wy);
      if(s){ // fragile: dry, shakes, blinks red before snapping
        const jx=s.t>0&&Math.random()<.5?.5:0,red=s.t>FRAG*.45&&(T*12|0)%2,edge=red?'#be1250':'#742f29';
        f(x+jx,ys,.5,1,edge);f(x+.5+jx,ys,1,1,red?'r':(wy%5<2?'#c98a4b':'h'));f(x+1.5+jx,ys,.5,1,edge);
        if(wy%7===0)f(x+jx+(wy%14?1.5:-.5),ys,1,.5,'#742f29');
        continue;
      }
      f(x,ys,.5,1,'g');f(x+.5,ys,1,1,'G');f(x+1.5,ys,.5,1,'g');
      f(x+((wy%6)<3?.5:1),ys,.5,.5,'#a8e72e');
      if(wy%10===0){const h=hash(l*97+wy);
        if(h>.72){f(x+2,ys,1,.5,'g');f(x+2.5,ys-.5,1.5,.5,'G');f(x+3.5,ys-1,1,.5,'G');f(x+3,ys-.5,.5,.5,'#a8e72e')}
        else if(h>.45){f(x-1,ys,1,.5,'g');f(x-2,ys-.5,1.5,.5,'G');f(x-2.5,ys-1,1,.5,'G');f(x-1.5,ys-.5,.5,.5,'#a8e72e')}
      }
    }
    for(const s of ls)if(isGap(s)){
      const a=sy(s.y0),b=sy(s.y1),c=s.type==='F'?'h':'g',c2=s.type==='F'?'#c98a4b':'G';
      f(x,a-1,.5,1,c);f(x+1,a-1.5,.5,1.5,c2);f(x+1.5,a-.5,.5,.5,c);
      f(x+.5,b,.5,1.5,c);f(x+1.5,b,.5,1,c2);f(x-.5,b+1,.5,.5,c);
    }
  }
  for(const q of parts)f(q.x,sy(q.y),.5,.5,q.c);
}

function drawLava(){

  for(const b of bubbles){const by=ly+4+((b.x*7)%30);if(by<H){f(b.x,by,1.5,1.5,b.l>.2?'y':'o');f(b.x+.5,by+.5,.5,.5,'w')}}

function drawFlames(){

    txt('BEST '+best,'c',130,1,'y');
    if(newBest&&(T*4|0)%2)txt('NEW BEST!','c',142,1,'G');
    if(deadT>.8&&(T*2|0)%2===0)txt('TAP TO RETRY','c',162,1,'w');
  }
}

function draw(){
  cx.save();
  if(shake>0)cx.translate(Math.round((Math.random()-.5)*shake)*S,Math.round((Math.random()-.5)*shake)*S);
  drawBg();drawVines();drawTrapsBack();drawObstacles();drawPlayer();drawFlames();drawTrapsFront();drawLava();
  cx.restore();
  drawHud();
}

let last=performance.now();
function loop(t){update(Math.min(.05,(t-last)/1000));last=t;draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);

function fit(){const s=Math.min(innerWidth/W,innerHeight/H);cv.style.width=W*s+'px';cv.style.height=H*s+'px'}
addEventListener('resize',fit);fit();

// input: swipe, tap, keys
let down=false,sx0=0,swiped=false;
const stage=document.getElementById('stage');
stage.addEventListener('pointerdown',e=>{unlock();down=true;swiped=false;sx0=e.clientX});
stage.addEventListener('pointermove',e=>{if(down&&!swiped&&Math.abs(e.clientX-sx0)>22){move(e.clientX>sx0?1:-1);swiped=true}});
addEventListener('pointerup',()=>{if(down&&!swiped)tap();down=false});
addEventListener('keydown',e=>{
  unlock();
  if(e.key==='ArrowLeft'||e.key==='a')move(-1);
  else if(e.key==='ArrowRight'||e.key==='d')move(1);
  else if(e.key===' '||e.key==='Enter'){tap();e.preventDefault()}
});
</script>
</body>
