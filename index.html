<div id="stage">

<script>
const W=144,H=256,cv=document.getElementById('g'),cx=cv.getContext('2d'),wrap=document.getElementById('wrap');
// PICO-8 style palette
const P={k:'#000000',n:'#1d2b53',u:'#7e2553',g:'#008751',h:'#ab5236',d:'#5f574f',l:'#c2c3c7',w:'#fff1e8',r:'#ff004d',o:'#ffa300',y:'#ffec27',G:'#00e436',b:'#29adff',v:'#83769c',s:'#ffccaa'};
const LX=[40,72,104];

// explorer: authored at 16x24, upscaled 1.5x (Scale3x then halved) to 24x36 fine px = 12x18 world, auto outline
const SPC={o:'#291814',H:'#ab5236',h:'#742f29',d:'#5a3a22',s:'#ffccaa',z:'#e0a07a',B:'#29adff',b:'#065ab5',n:'#c9a66b',N:'#8a6a45',p:'#5f574f',P:'#3a3438',w:'#5a3a22'};
const at=(o,rows)=>{const a=[];rows.forEach((s,i)=>a[o+i]=s);return a};
function scale3(g){
  const h=g.length,w=g[0].length,o=[],at=(r,c)=>r<0||r>=h||c<0||c>=w?'.':g[r][c];
  for(let r=0;r<h*3;r++)o[r]=[];
  for(let r=0;r<h;r++)for(let c=0;c<w;c++){
    const A=at(r-1,c-1),B=at(r-1,c),C=at(r-1,c+1),D=at(r,c-1),E=at(r,c),F=at(r,c+1),G=at(r+1,c-1),H=at(r+1,c),I=at(r+1,c+1);
    const e=[E,E,E,E,E,E,E,E,E];
    if(B!==H&&D!==F){
      e[0]=D===B?D:E;e[1]=(D===B&&E!==C)||(B===F&&E!==A)?B:E;e[2]=B===F?F:E;
      e[3]=(D===B&&E!==G)||(D===H&&E!==A)?D:E;e[5]=(B===F&&E!==I)||(H===F&&E!==C)?F:E;
      e[6]=D===H?D:E;e[7]=(D===H&&E!==I)||(H===F&&E!==G)?H:E;e[8]=H===F?F:E;
    }
    for(let i=0;i<9;i++)o[r*3+(i/3|0)][c*3+i%3]=e[i];
  }
  return o.filter((_,r)=>r%2===0).map(row=>row.filter((_,c)=>c%2===0));
}
function build(flip,...ls){
  let g=[];
  for(let r=0;r<24;r++){g[r]=[];for(let c=0;c<16;c++){let ch='.';
    for(const L of ls){const k=L[r]&&L[r][flip?15-c:c];if(k&&k!=='.')ch=k}g[r][c]=ch}}
  g=scale3(g);
  const h=g.length,w=g[0].length,on=(r,c)=>r>=0&&r<h&&c>=0&&c<w&&g[r][c]!=='.',px=[];
  for(let r=-1;r<=h;r++)for(let c=-1;c<=w;c++){
    if(on(r,c))px.push([c+1,r+1,SPC[g[r][c]]]);
    else if(on(r-1,c)||on(r+1,c)||on(r,c-1)||on(r,c+1))px.push([c+1,r+1,null]);
  }
  return px;
}
// back view (climbing)
const BACK=at(4,[
"......HHHH......",
".....HHHHHH.....",

"....oooooooo...."]);
const ARM_HI=at(0,[

"..bB.......ss...",

const ARM_MID=at(2,[

"..zs........sz..",

const ARM_HIT=at(10,[
"sszbB......Bbzss",
"zz..b......b..zz"]);
const ARM_UP=at(1,[

"..z..........z..",

const LEG_KNEE=at(18,[
"....ppP..Pppp...",
"....ppP..Pppp...",
"....ppP...www...",
"....ppP...www...",
"....www.........",
"...wwww........."]);
const LEG_MID=at(18,[

const LEG_HANG=at(18,[

const LEG_SPLAY=at(18,[

".ww..........ww."]);
const CLIMB_A=build(false,BACK,ARM_HI,LEG_KNEE),CLIMB_B=build(false,BACK,ARM_MID,LEG_MID);
const CLIMB=[CLIMB_A,CLIMB_B,build(true,BACK,ARM_HI,LEG_KNEE),CLIMB_B];
const HIT=build(false,BACK,ARM_HIT,LEG_HANG),FALL=build(false,BACK,ARM_UP,LEG_SPLAY);
// side view facing right (intro run)
const SIDE=at(4,[
"......HHHH......",
".....HHHHHH.....",
".....hHHHHH.....",
".....oooooo.....",
"....hHHHHHHHHH..",
".....ddsssss....",
".....ddsssos....",
".....dzssssss...",
".......zsss.....",
"....NnBBBBb.....",
"...NnnBBBBb.....",
"...NnnBBBBb.....",
"...NnnbBBBb.....",
"....NnbBBb......",
".....oooooo....."]);
const RARM_BACK=at(13,[
"........B.......",
".......bB..b....",
"......Bb....z...",
".....zs.....zz.."]);
const RARM_FWD=at(13,[
"........B.......",
"........Bb......",
".........Bs.....",
"..........sz...."]);
const RARM_MID=at(13,[
"........B.......",
"........Bb......",
"........zs......"]);
const RLEG=[at(19,[
"......pppp......",
".....Ppp.pp.....",
"....Pp....pp....",
"...Pp......pp...",
"..ww.......www.."]),at(19,[
"......pppp......",
"......pPPP......",
"......p..PP.....",
"......p...w.....",
".....ww........."]),at(19,[
"......pppp......",
".....ppp.PP.....",
"....pp....PP....",
"...pp......PP...",
"..ww.......www.."]),at(19,[
"......pppp......",
"......Pppp......",
"......P..pp.....",
"......P...w.....",
".....ww........."])];
const RUN=[build(false,SIDE,RARM_BACK,RLEG[0]),build(false,SIDE,RARM_MID,RLEG[1]),build(false,SIDE,RARM_FWD,RLEG[2]),build(false,SIDE,RARM_MID,RLEG[3])];
const STAND=build(false,SIDE,RARM_MID,at(19,[
"......pppp......",
"......pp.pp.....",
"......pp.pp.....",
"......pp.pp.....",
".....www.www...."]));

const FD="A010101111101101B110101110101110C011100100100011D110101101101110E111100110100111F111100110100100G011100101101011H101101111101101I111010010010111J001001001101010K101101110101101L100100100100111M101111111101101N110101101101101O010101101101010P110101110100100Q010101101110011R110101110101101S011100010001110T111010010010010U101101101101111V101101101101010W101101111111101X101101010101101Y101101010010010Z1110010101001110111101101101111101011001001011121100010101001113110001010001110410110111100100151111001100011106011100111101111711100101001001081111011111011119111101111001110!010010010000010-000000111000000:000010000010000<001010100010001>100010001010100.000000000000010?110001010000010+000010111010000";
const F={};for(let i=0;i<FD.length;i+=16)F[FD[i]]=FD.substr(i+1,15);

let best=0;try{best=+localStorage.getItem('lavaclimb_best')||0}catch(e){}

// game logic runs in 144x256 world units; drawing is S times finer
const S=2;
const f=(x,y,w,h,c)=>{cx.fillStyle=P[c]||c;const x0=Math.round(x*S),y0=Math.round(y*S);cx.fillRect(x0,y0,Math.round((x+w)*S)-x0,Math.round((y+h)*S)-y0)};
const hash=n=>{const s=Math.sin(n*127.1)*43758.5453;return s-Math.floor(s)};
const tw=(s,sc)=>s.length*4*sc-sc;
function txt(s,x,y,sc,c,sh=true){
  if(x==='c')x=(W-tw(s,sc))>>1;
  if(sh)txt(s,x+sc,y+sc,sc,'k',false);
  for(let i=0;i<s.length;i++){const g=F[s[i]];if(!g)continue;
    for(let j=0;j<15;j++)if(g[j]==='1')f(x+i*4*sc+(j%3)*sc,y+(j/3|0)*sc,sc,sc,c)}
}
function drawSpr(px,x,y,tint){
  const bx=Math.round(x*S)-1,by=Math.round(y*S)-1;
  for(const [c,r,col] of px){cx.fillStyle=col?(tint?P[tint]:col):'#120a10';cx.fillRect(bx+c,by+r,1,1)}
}

// sound
let ac;
function unlock(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();ac.resume()}catch(e){}}
function snd(f1,f2,d,type='square',vol=.05){
  if(!ac)return;try{const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();
  o.type=type;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
  o.connect(g).connect(ac.destination);o.start(t);o.stop(t+d)}catch(e){}
}

let state='title',T=0,p,camY,lavaY,spikes,waves,jets,traps,segs,genY,nextY,it,playT,deadT,speed,shake,newBest,deathKind,bubbles,parts,pops,bonus,combo,comboT,closes;
function reset(){
  p={lane:1,x:-6,y:0,stun:0,inv:0,anim:0,vy:0,prevLane:1,switchT:-9};
  camY=-20;lavaY=-24;spikes=[];waves=[];jets=[];traps=[];segs=[];genY=90;bubbles=[];parts=[];pops=[];
  nextY=260;it=0;playT=0;deadT=0;speed=30;shake=0;newBest=false;bonus=0;combo=0;comboT=-9;closes=0;
}
reset();

const sy=wy=>H-(wy-camY);
const r3=()=>Math.random()*3|0;
const hands=()=>p.y+16;
const isGap=s=>s.type==='G'||s.broken;
const onSeg=s=>s.lane===p.lane&&hands()>=s.y0&&hands()<s.y1;
let deadY=0;
const curY=()=>state==='dead'?deadY:p.y;
const height=()=>Math.max(0,Math.floor(curY()/8));
const score=()=>height()+bonus;

// speed keeps rising for ~3 minutes, then levels off; difficulty follows the same climb
const spAt=y=>Math.min(115,45+70*(1-Math.exp(-y/9000)));
const diff=y=>Math.min(1,y/15000);

// hand-made sections stitched together (Subway Surfers style). m() mirrors lanes left/right.
// c: sp speed, d difficulty, g gap length, S row spacing (the window between rows shrinks with speed)
const G=(l,a,b)=>segs.push({lane:l,type:'G',y0:a,y1:b});
const Fv=(l,a,b)=>segs.push({lane:l,type:'F',y0:a,y1:b,t:-1,broken:false});
const others=o=>[0,1,2].filter(l=>l!==o);
const SECTIONS=[
  {w:[3,.4],f:(y,m,c)=>{G(r3(),y,y+c.g);return c.g}},
  {w:[3,1.5],f:(y,m,c)=>{for(const l of others(r3()))G(l,y,y+c.g);return c.g}},
  {w:[2,1.5],f:(y,m,c)=>{const st=c.g+Math.max(18,c.sp*(.36-.08*c.d));for(let i=0;i<3;i++)G(m(i),y+i*st,y+i*st+c.g);return st*2+c.g}},
  {w:[2,1],f:(y,m,c)=>{const o=Math.random()<.5?1:m(0),len=c.S*1.6;for(const l of others(o))G(l,y,y+len);return len}},
  {w:[1,3],minY:200,f:(y,m,c)=>{for(let i=0;i<3;i++)for(const l of others(m(i)))G(l,y+i*c.S,y+i*c.S+c.g);return c.S*2+c.g}},
  {w:[0,2.5],minY:2500,f:(y,m,c)=>{for(let i=0;i<4;i++)for(const l of others(m(i%2)))G(l,y+i*c.S,y+i*c.S+c.g);return c.S*3+c.g}},
  {w:[.5,2],minY:800,f:(y,m,c)=>{const a=r3(),b=a===1?m(0):1;
    for(const l of others(a))G(l,y,y+c.g);for(const l of others(b))G(l,y+c.S,y+c.S+c.g);return c.S+c.g}},
  // fragile jump-off: too long to hold; a side lane opens and you jump before it snaps (2s)
  {w:[2,3.5],minY:450,f:(y,m,c)=>{const f=Math.random()<.5?1:m(0),a=f===1?m(0):1,b=m(2);
    Fv(f,y,y+c.sp*3.2);G(a,y,y+c.sp*(1.25+.25*c.d));G(b,y,y+c.sp*3.3);return c.sp*3.3}},
  {w:[2,.4],f:(y,m,c)=>30+Math.random()*50*(1-c.d)},
];
function placeSection(){
  const y=genY,d=diff(y),sp=spAt(y),g=Math.round(14+Math.random()*4+d*6),S=g+Math.max(20,sp*(.42-.12*d));
  const ok=SECTIONS.filter(s=>y>=(s.minY||0)),wt=s=>s.w[0]+(s.w[1]-s.w[0])*d;
  let r=Math.random()*ok.reduce((t,s)=>t+wt(s),0),sec=ok[0];
  for(const s of ok)if((r-=wt(s))<=0){sec=s;break}
  const flip=Math.random()<.5,len=sec.f(y,l=>flip?2-l:l,{sp,d,g,S});
  // breathing room between sections: enough for a double swipe even at top speed
  genY=y+len+Math.max(18,sp*(.6-.25*d))+Math.random()*12;
}

function close(label){
  combo=T-comboT<3?combo+1:1;comboT=T;closes++;
  const pts=10*combo;bonus+=pts;
  pops.push({s:label+' +'+pts,x:p.x,y:p.y+22,t:0});
  snd(660,1320,.1,'square',.04);
}

function move(d){
  if(state!=='play')return;
  const n=Math.max(0,Math.min(2,p.lane+d));
  if(n===p.lane)return;
  for(const s of segs){
    if(s.lane!==p.lane)continue;
    const dist=s.y0-hands();
    if(isGap(s)&&dist>=0&&dist<10){close('DODGE');break}
    if(s.type==='F'&&!s.broken&&s.t>1.55&&onSeg(s)){close('CLUTCH');break}
  }
  p.prevLane=p.lane;p.switchT=T;p.lane=n;snd(520,880,.06);
}
function tap(){
  if(state==='title'){state='intro';snd(330,660,.15)}
  else if(state==='dead'&&deadT>.8){reset();state='intro';snd(330,660,.15)}
}
function die(kind){
  deadY=p.y;state='dead';deathKind=kind;deadT=0;p.vy=0;shake=6;
  if(score()>best){best=score();newBest=true;try{localStorage.setItem('lavaclimb_best',best)}catch(e){}}
  snd(440,40,.8,'sawtooth',.07);
}
function hit(){
  if(p.inv>0)return;
  const ny=p.y-6;
  if(!segs.some(s=>isGap(s)&&s.lane===p.lane&&ny+16<s.y1&&p.y+16>=s.y0))p.y=ny;
  p.stun=.45;p.inv=1;shake=5;combo=0;snd(220,50,.25,'sawtooth',.08);
}

// fire jets: a wall vent warns, then fire covers 1-2 lanes from its side.
// never placed so that every uncovered lane has a gap or fragile vine at that height.
const jetLanes=(side,n)=>(side<0?[0,1]:[2,1]).slice(0,n);
const clearAt=(l,a,b)=>!segs.some(s=>s.lane===l&&s.y0<b&&s.y1>a);

// trap picker: [weight at start, weight at max difficulty, min height]. each spawner returns
// seconds of travel to keep free after it (so traps don't stack), or null if it couldn't be placed fairly.
const TRAP_W={wave:[3,2.5],jet:[2,2,300],snake:[1.5,1,200],bats:[1.5,2,500],wall:[1.5,1.5,700],geyser:[1,2.5,900],blade:[.8,2,1400]};
const SPAWN={
  wave:y=>{waves.push({ty:y-150});return 1.6},
  jet:y=>{
    const ok=(side,n)=>{const cov=jetLanes(side,n);return [0,1,2].some(l=>!cov.includes(l)&&clearAt(l,y-24,y+20))};
    let side=Math.random()<.5?-1:1,n=Math.random()<.2+.5*diff(y)?2:1;
    if(!ok(side,n)){if(ok(-side,n))side=-side;else if(ok(side,1))n=1;else if(ok(-side,1)){side=-side;n=1}else return null}
    jets.push({st:'idle',y,side,lanes:jetLanes(side,n),reach:side<0?LX[n-1]+6:LX[3-n]-6,t:0});return 0;
  },
  snake:y=>{traps.push({type:'snake',st:'wait',ty:y-150});return .8},
  bats:y=>{traps.push({type:'bats',st:'wait',ty:y-150});return 1},
  geyser:y=>{traps.push({type:'geyser',st:'wait',ty:y-150});return 1.4},
  wall:y=>{
    const d=diff(y),both=d>.4&&Math.random()<.35,side=Math.random()<.5?-1:1,len=24;
    const cov=both?[0,2]:[side<0?0:2];
    if(![0,1,2].some(l=>!cov.includes(l)&&clearAt(l,y-20,y+len+20)))return null;
    traps.push({type:'wall',st:'on',y,len,side,both,per:1.3-.3*d,ph:Math.random()*2});return .5;
  },
  blade:y=>{
    const o={type:'blade',st:'on',y,Py:y+55,L:55,A:.8,w:2*Math.PI/1.9,ph:0},sp=spAt((p.y+y)/2);
    for(let k=0;k<30;k++){o.ph=Math.random()*1.9;if(bladeFair(o,sp)){traps.push(o);return .6}}
    return null;
  },
};
function spawnAt(y){
  const d=diff(y),wt=w=>w[0]+(w[1]-w[0])*d,opts=Object.entries(TRAP_W).filter(([,w])=>y>=(w[2]||0));
  let r=Math.random()*opts.reduce((t,[,w])=>t+wt(w),0),kind='wave';
  for(const [k,w] of opts)if((r-=wt(w))<=0){kind=k;break}
  return SPAWN[kind](y)??SPAWN.wave(y);
}

// small creature sprites: authored tiny, upscaled 1.5x and outlined like the explorer
function mkSpr(rows,pal){
  const g=scale3(rows.map(r=>[...r])),h=g.length,w=g[0].length,on=(r,c)=>r>=0&&r<h&&c>=0&&c<w&&g[r][c]!=='.',px=[];
  for(let r=-1;r<=h;r++)for(let c=-1;c<=w;c++){
    if(on(r,c))px.push([c+1,r+1,pal[g[r][c]]]);
    else if(on(r-1,c)||on(r+1,c)||on(r,c-1)||on(r,c+1))px.push([c+1,r+1,null]);
  }
  px.w=(w+2)/S;px.h=(h+2)/S;return px;
}
const BAT_ROWS=[
 ["w.........w","ww.......ww","www.bbb.www",".wwbrbrbww.","...bbbbb...","....b.b...."],
 ["....bbb....","...brbrb...",".wwbbbbbww.","www.....www","ww.......ww","w.........w"]];
const BAT=BAT_ROWS.map(r=>mkSpr(r,{w:'#a28879',b:'#c2c3c7',r:'#ff004d'}));
const BAT_RED=BAT_ROWS.map(r=>mkSpr(r,{w:'#be1250',b:'#ff6c24',r:'#ffec27'}));

// a hazard in `lane` passing you right after you left that lane is a close call
function passClose(o,lane,yy){
  if(!o.chk&&yy<p.y+9){o.chk=true;if(p.lane!==lane&&p.prevLane===lane&&T-p.switchT<.6)close('CLOSE')}
}
// picks the lane to attack: usually yours, only if another lane stays climbable around height a..b
function aimLane(a,b){
  const ok=l=>[0,1,2].some(q=>q!==l&&clearAt(q,a,b));
  const order=Math.random()<.65?[p.lane,...others(p.lane).sort(()=>Math.random()-.5)]:[r3(),0,1,2];
  return order.find(ok)??-1;
}

function bladePos(o,t){const th=o.A*Math.sin(o.w*(t+o.ph));return [72+o.L*Math.sin(th),o.Py-o.L*Math.cos(th)]}
const bladeHits=(bx,by,px,py,m=0)=>Math.abs(bx-px)<10+m&&Math.abs(by-(py+9))<13+m;
// predicts your climb past the blade in each lane: needs a lane that's safe with room to spare, and a lane that gets hit
function bladeFair(o,sp){
  let safe=0,threat=0;
  for(let l=0;l<3;l++){
    if(!clearAt(l,o.y-24,o.y+30))continue;
    let near=false,h=false;
    for(let t=0;t<9;t+=.02){const py=p.y+sp*t;if(py>o.Py)break;const [bx,by]=bladePos(o,T+t);
      if(bladeHits(bx,by,LX[l],py,6))near=true;if(bladeHits(bx,by,LX[l],py)){h=true;break}}
    if(h)threat++;else if(!near)safe++;
  }
  return safe>0&&threat>0;
}
function wallExt(o){
  const c=((T+o.ph)%o.per)/o.per;
  return c<.35?0:c<.5?.06:c<.55?(c-.5)/.05:c<.9?1:c<.95?1-(c-.9)/.05:0;
}

const TR={
  bats:{
    start(o){
      const vb=35+speed*.25,y0=camY+H+8,t=(y0-(p.y+9))/(vb+speed),ya=hands()+speed*t,lane=aimLane(ya-30,ya+20);
      if(lane<0)return false;
      Object.assign(o,{lane,x:LX[lane],y:y0,vb,n:2+(Math.random()<.3+diff(p.y)?1:0),homing:diff(p.y)>.25&&Math.random()<.5,turned:false});
      snd(1500,900,.12,'square',.03);return true;
    },
    tick(o,dt){
      o.y-=o.vb*dt;
      // red bats swerve once toward your lane when they get close
      if(o.homing&&!o.turned&&o.y-(p.y+9)<speed*.55+40){
        o.turned=true;
        if(p.lane!==o.lane){const nl=o.lane+Math.sign(p.lane-o.lane);if([0,1,2].some(q=>q!==nl&&clearAt(q,p.y,p.y+60))){o.lane=nl;snd(1800,1200,.1,'square',.03)}}
      }
      o.x+=(LX[o.lane]-o.x)*Math.min(1,dt*6);
      for(let i=0;i<o.n;i++){const bx=o.x+[-4,4,0][i],by=o.y+[0,5,11][i];
        if(!o.hitDone&&Math.abs(bx-p.x)<6&&by>p.y-1&&by<p.y+19){o.hitDone=true;hit()}}
      passClose(o,o.lane,o.y);
      if(o.y<camY-30)o.dead=true;
    },
    draw(o){const fr=(o.homing?BAT_RED:BAT)[(T*12|0)%2];
      for(let i=0;i<o.n;i++)drawSpr(fr,o.x+[-4,4,0][i]-fr.w/2,sy(o.y+[0,5,11][i])-fr.h/2)},
  },
  snake:{
    start(o){
      const vs=18+speed*.12,y0=camY+H+4,t=(y0-(p.y+9))/(vs+speed),ya=hands()+speed*t,lane=aimLane(ya-30,ya+30);
      if(lane<0)return false;
      Object.assign(o,{lane,y:y0,vs});snd(200,120,.3,'sawtooth',.02);return true;
    },
    tick(o,dt){
      o.y-=o.vs*dt;
      for(let i=0;i<8;i++){const yy=o.y+i*3.5;
        if(!o.hitDone&&Math.abs(LX[o.lane]-p.x)<6&&yy>p.y-1&&yy<p.y+19){o.hitDone=true;hit()}}
      passClose(o,o.lane,o.y);
      if(o.y+28<camY-10)o.dead=true;
    },
    draw(o){
      for(let i=7;i>=1;i--){const y=sy(o.y+i*3.5),x=LX[o.lane]+Math.sin(T*8+i*.9)*2,r=i>5?2:2.75;
        f(x-r-.5,y-2.25,r*2+1,4.5,'#291814');f(x-r,y-1.75,r*2,3.5,['r','y','#291814'][i%3]);f(x-r+.5,y-1.75,1.5,.5,'w')}
      const x=LX[o.lane]+Math.sin(T*8)*2,y=sy(o.y);
      f(x-3.25,y-3,6.5,6,'#291814');f(x-2.75,y-2.5,5.5,5,'r');f(x-2.25,y-2.5,3,1,'#ff6c24');
      f(x-2,y-.5,1,1,'y');f(x+1,y-.5,1,1,'y');f(x-1.75,y-.5,.5,.5,'k');f(x+1.25,y-.5,.5,.5,'k');
      if((T*6|0)%2){f(x-.25,y+3,.5,2,'#ff77a8');f(x-.75,y+5,.5,.5,'#ff77a8');f(x+.25,y+5,.5,.5,'#ff77a8')}
    },
  },
  geyser:{
    start(o){
      const a=hands()+speed*.9,b=hands()+speed*1.75,lane=aimLane(a-18,b);
      if(lane<0)return false;
      Object.assign(o,{lane,st:'warn',t:0,top:lavaY});snd(70,50,.6,'sawtooth',.05);return true;
    },
    tick(o,dt){
      o.t+=dt;
      if(o.st==='warn'){
        if(Math.random()<.4)parts.push({x:LX[o.lane]+Math.random()*8-4,y:Math.max(lavaY,camY)+2,vy:30+Math.random()*30,g:0,l:.5,c:Math.random()<.5?'o':'y'});
        if(o.t>=.9){o.st='erupt';o.t=0;shake=Math.max(shake,2);snd(120,40,.7,'sawtooth',.08)}
      } else if(o.st==='erupt'){
        o.top=lavaY+(camY+H+10-lavaY)*Math.min(1,o.t/.15);
        if(!o.hitDone&&p.y+2<o.top&&Math.abs(p.x-LX[o.lane])<7){o.hitDone=true;hit()}
        if(o.t>=.8){o.st='end';o.t=0}
      } else if(o.st==='end'){
        o.top=lavaY+(camY+H+10-lavaY)*Math.max(0,1-o.t/.25);
        if(o.t>=.25)o.dead=true;
      }
    },
    draw(o){
      const x=LX[o.lane];
      if(o.st==='warn'){
        const ly=Math.min(H,sy(lavaY)),on=(T*10|0)%2;
        cx.globalAlpha=on?.28:.12;f(x-6,0,12,ly,'o');cx.globalAlpha=1;
        for(let yy=ly-6;yy>0;yy-=8)f(x-.5,yy,1,3,on?'y':'o');
        for(let i=0;i<5;i++)f(x-5+hash(i+(T*12|0))*10,ly-1.5-hash(i*7+(T*12|0))*6,1.5,1.5,i%2?'y':'o');
        if(on)txt('!',x-1,Math.min(ly,H)-22,2,'y');
        return;
      }
      const top=sy(o.top),bot=Math.min(H+2,sy(lavaY));
      if(bot<=top)return;
      for(let yy=Math.max(-2,top);yy<bot;yy+=.5){
        const wv=Math.sin(yy*.4+T*30)+Math.sin(yy*.17-T*20)*.7,hw=5+wv*.5;
        f(x-hw,yy,hw*2,.5,'r');f(x-hw*.65,yy,hw*1.3,.5,'o');f(x-hw*.25+wv*.3,yy,hw*.5,.5,'y');
      }
      if(top>-4){f(x-6,top-1.5,12,2,'o');f(x-4,top-3,8,1.5,'y');f(x-2,top-4,1,1,'y');f(x+2,top-4.5,1,1,'o')}
    },
  },
  wall:{
    tick(o){
      const e=wallExt(o);
      if(e>.6&&!o.hitDone&&p.y<o.y+o.len&&p.y+18>o.y){
        const tipL=12+e*32,tipR=132-e*32;
        if(((o.both||o.side<0)&&p.x-5<tipL)||((o.both||o.side>0)&&p.x+5>tipR)){o.hitDone=true;hit()}
      }
      if(e===1&&!o.snd&&Math.abs(o.y-p.y)<160){o.snd=true;snd(300,200,.06,'square',.02)}
      if(e===0)o.snd=false;
      if(o.y+o.len<camY-60)o.dead=true;
    },
    back(o){
      const e=wallExt(o),rattle=e>0&&e<.1?(T*30|0)%2*.5:0;
      for(const s of o.both?[-1,1]:[o.side]){
        const L=s<0,base=L?8:132;
        f(base,sy(o.y+o.len),4,o.len,'#3b3743');f(base,sy(o.y+o.len),4,.5,'#6a6472');
        for(let k=0;k<6;k++){
          const yc=sy(o.y+2+k*4),len=Math.max(1,e*32)+rattle;
          for(let j=-1.5;j<=1.5;j+=.5){const l=len*(1-Math.abs(j)/2),c=j<0?'w':j<1?'l':'d';
            if(L)f(12,yc+j,l,.5,c);else f(132-l,yc+j,l,.5,c)}
        }
      }
    },
  },
  blade:{
    tick(o){
      const [bx,by]=bladePos(o,T);
      if(!o.hitDone&&bladeHits(bx,by,p.x,p.y)){o.hitDone=true;hit()}
      if(!o.chk&&p.y+9>by&&Math.abs(by-(p.y+9))<14){o.chk=true;if(!o.hitDone&&Math.abs(bx-p.x)<22)close('CLOSE')}
      if(o.Py<camY-20)o.dead=true;
    },
    back(o){
      const [bx,by]=bladePos(o,T),py=sy(o.Py);
      f(12,py-3,120,3,'#4a4552');f(12,py-3,120,.5,'#6a6472');f(12,py-.5,120,.5,'#1a181f');
      for(let i=0;i<=14;i++){const x=72+(bx-72)*i/14,y=o.Py+(by-o.Py)*i/14;f(x-.5,sy(y)-.5,1,1,i%2?'#5f574f':'#8a8590')}
      f(70.5,py-1,3,3,'#2a2730');
    },
    draw(o){
      const disc=(bx,by)=>{const y0=sy(by);
        for(let dy=-6.5;dy<=6.5;dy+=.5){const w=Math.sqrt(42.25-dy*dy);f(bx-w,y0+dy,w*2,.5,dy>2.5?'w':dy>-1.5?'l':'#8a8590')}
        for(let k=0;k<8;k++){const a=k*Math.PI/4+T*25;f(bx+Math.cos(a)*7-.5,y0+Math.sin(a)*7-.5,1,1,'l')}
        f(bx-1.5,y0-1.5,3,3,'#2a2730');};
      const [gx,gy]=bladePos(o,T-.05);cx.globalAlpha=.25;disc(gx,gy);cx.globalAlpha=1;
      const [bx,by]=bladePos(o,T);disc(bx,by);
    },
  },
};

// spike waves (Jetpack Joyride style): drops one after another, single lanes and pairs, always one lane open.
// each drop shows its own "!" for SPIKE_WARN seconds before it falls.
const SPIKE_WARN=.75,spikeV=()=>140+speed*.6;
const spikeEta=delay=>delay+(H-82)/(spikeV()+speed);
function fireWave(){
  const d=diff(p.y),n=1+Math.floor(Math.random()*(1.6+d*2.6)),gapT=.55-.2*d;
  let open=p.lane;
  for(let i=0;i<n;i++){
    const delay=SPIKE_WARN+i*gapT,ya=hands()+speed*spikeEta(delay);
    const path=[0,1,2].filter(l=>!segs.some(q=>q.lane===l&&q.type==='G'&&q.y0<ya+20&&q.y1>ya-24));
    if(!path.length)continue;
    let lanes;
    if(i>0&&Math.random()<.35+.45*d){
      // pair: leave one lane open, at most one swipe from the last open lane
      const near=path.filter(l=>Math.abs(l-open)<=1),pool=near.length?near:path,o=pool[Math.random()*pool.length|0];
      lanes=others(o);open=o;
    } else {
      const tgt=i===0?p.lane:open;
      if(!path.some(l=>l!==tgt))continue;
      lanes=[tgt];open=path.filter(l=>l!==tgt).sort((a,b)=>Math.abs(a-tgt)-Math.abs(b-tgt))[0];
    }
    for(const l of lanes)spikes.push({st:'warn',w:delay,lane:l,y:0});
  }
}

function update(dt){
  T+=dt;shake=Math.max(0,shake-dt*12);
  for(const q of parts){q.vy-=(q.g??200)*dt;q.y+=q.vy*dt;q.x+=(q.vx||0)*dt;q.l-=dt}
  parts=parts.filter(q=>q.l>0);
  for(const q of pops)q.t+=dt;
  pops=pops.filter(q=>q.t<1);
  if(state==='title')return;
  if(state==='intro'){
    it+=dt;
    if(it<1.3){p.x=-6+78*(it/1.3);p.y=0;p.anim+=dt*10}
    else if(it<2){p.x=72;if(shake<1.5)shake=1.5;if(Math.random()<.15)snd(60,40,.12,'triangle',.08)}
    if(it>=1.6)lavaY+=14*dt;
    if(it>=2){const k=Math.min(1,(it-2)/.4);p.y=22*k+Math.sin(k*Math.PI)*10;
      if(k>=1){state='play';playT=0;p.y=22}}
  } else if(state==='play'){
    playT+=dt;
    speed=spAt(p.y);
    if(p.stun>0)p.stun-=dt;else{p.y+=speed*dt;p.anim+=dt*(8+speed*.08)}
    p.inv-=dt;
    p.x+=(LX[p.lane]-p.x)*Math.min(1,dt*18);
    lavaY+=speed*.85*Math.min(1,.4+playT/4)*dt;
    if(p.y-lavaY>110)lavaY=p.y-110;

    while(genY<p.y+300)placeSection();
    while(nextY<p.y+230){const w=spawnAt(nextY);nextY+=170-90*diff(nextY)+Math.random()*60+w*spAt(nextY)}
    for(const o of traps){
      if(o.st==='wait'){if(p.y>=o.ty){if(TR[o.type].start(o))o.st=o.st==='wait'?'on':o.st;else o.dead=true}}
      else TR[o.type].tick(o,dt);
    }
    traps=traps.filter(o=>!o.dead);
    for(const w of waves)if(p.y>=w.ty){w.done=true;fireWave()}
    waves=waves.filter(w=>!w.done);

    // fragile vines: timer starts on grab, snaps after 2s
    for(const s of segs){
      if(s.type!=='F'||s.broken)continue;
      if(s.t<0&&onSeg(s)&&Math.abs(p.x-LX[s.lane])<5){s.t=0;snd(150,120,.15,'square',.04)}
      if(s.t>=0&&(s.t+=dt)>=2){
        s.broken=true;shake=Math.max(shake,2);snd(300,60,.2,'square',.06);
        for(let i=0;i<14;i++)parts.push({x:LX[s.lane]+Math.random()*4-2,y:Math.max(s.y0,camY)+Math.random()*Math.min(s.y1-s.y0,H),vy:Math.random()*40,l:1,c:Math.random()<.5?'h':'o'});
      }
    }

    for(const s of spikes){
      if(s.st==='warn'){
        const b=s.w;s.w-=dt;
        if(b>=SPIKE_WARN&&s.w<SPIKE_WARN)snd(880,880,.05,'square',.03);
        if(s.w<=0){s.st='fall';s.y=camY+H+4}}
      else if(s.st==='fall'){s.y-=spikeV()*dt;
        if(s.y<p.y+16&&s.y+9>p.y&&Math.abs(p.x-LX[s.lane])<6){hit();s.st='gone'}
        else if(!s.chk&&s.y<p.y+8){s.chk=true;if(s.lane!==p.lane&&s.lane===p.prevLane&&T-p.switchT<.6)close('CLOSE')}}
    }
    spikes=spikes.filter(s=>s.st!=='gone'&&!(s.st==='fall'&&s.y<camY-20));

    for(const j of jets){
      const L=j.side<0,mx=L?13:131;
      if(j.st==='idle'&&(j.y-(p.y+8))/speed<1.15){j.st='warn';j.t=0;snd(90,60,.4,'sawtooth',.04)}
      else if(j.st==='warn'){
        if(Math.random()<.5)parts.push({x:mx,y:j.y+Math.random()*2-1,vx:-j.side*(15+Math.random()*25),vy:Math.random()*20-10,g:0,l:.3,c:Math.random()<.5?'o':'y'});
        if((j.t+=dt)>=.7){j.st='fire';j.t=0;shake=Math.max(shake,1.5);snd(180,50,.6,'sawtooth',.07)}
      } else if(j.st==='fire'){
        j.t+=dt;
        const inY=p.y<j.y+3&&p.y+16>j.y-3,inX=L?p.x<j.reach:p.x>j.reach;
        if(inY&&inX&&!j.hitDone){j.hitDone=true;hit()}
        else if(inY&&!inX&&!j.chk&&T-p.switchT<.6&&j.lanes.includes(p.prevLane)){j.chk=true;close('CLOSE')}
        if(j.t>=.9){j.st='done';j.t=0}
      } else if(j.st==='done'&&(j.t+=dt)<1.5&&Math.random()<.2)
        parts.push({x:mx+Math.random()*2-1,y:j.y+1,vx:-j.side*4,vy:4,g:-15,l:.8,c:'#5f574f'});
    }
    jets=jets.filter(j=>j.y>camY-30);
    segs=segs.filter(s=>s.y1>camY-20);

    for(const s of segs)if(isGap(s)&&s.lane===p.lane&&Math.abs(p.x-LX[s.lane])<5&&hands()>=s.y0+1&&hands()<s.y1){die('fall');break}
    if(state==='play'&&lavaY>=p.y+2)die('burn');
  } else if(state==='dead'){
    deadT+=dt;lavaY+=10*dt;
    if(deathKind==='fall'){p.vy-=300*dt;p.y+=p.vy*dt}else p.y-=10*dt;
  }
  if(state!=='dead'){const tg=Math.max(-20,p.y-70);camY+=(tg-camY)*Math.min(1,dt*8)}
  if(Math.random()<.3)bubbles.push({x:Math.random()*W,l:.4});
  bubbles=bubbles.filter(b=>(b.l-=dt)>0);
}

function drawBg(){
  f(0,0,W,H,'#0f1830');
  for(let r=Math.floor(camY/8)-1;r*8<camY+H+8;r++){
    const ys=sy(r*8+8),off=(r&1)*8;
    for(let c=-1;c<9;c++){
      const bx=12+c*16+off,x0=Math.max(12,bx+.5),x1=Math.min(132,bx+16);
      if(x1<=x0)continue;
      const h=hash(r*31.7+c*7.3),t=hash(r*13.1+c*91.7),w=x1-x0;
      f(x0,ys+.5,w,7.5,t<.4?'#1d2b53':t<.75?'#212f5b':'#1a274c');
      f(x0,ys+.5,w,.5,'#2c3d72');
      f(x0,ys+7.5,w,.5,'#151f3f');
      if(h>.95){f(bx+4,ys+3,1,.5,'#0f1830');f(bx+5,ys+3.5,1,.5,'#0f1830');f(bx+6,ys+4,1.5,.5,'#0f1830');f(bx+7.5,ys+3.5,.5,.5,'#0f1830')}
      else if(h>.9){f(bx+5,ys+3,5,2,'#3a2448');f(bx+5.5,ys+3.5,4,1,'u')}
      else if(h>.82){f(bx+1,ys+.5,6,.5,'g');f(bx+1.5,ys+1,4,.5,'G');f(bx+2,ys+1.5,.5,1,'g');f(bx+5,ys+1.5,.5,1.5,'g')}
    }
  }
  f(0,0,12,H,'#0b0b12');f(132,0,12,H,'#0b0b12');
  for(let r=Math.floor(camY/12)-1;r*12<camY+H+12;r++){
    const ys=sy(r*12+12),o=(r&1)*3;
    for(const x of [0,132]){
      f(x+.5,ys+.5,11,11.5,'#24212b');f(x+.5,ys+.5,11,.5,'#3b3743');f(x+.5,ys+11.5,11,.5,'#16141b');
      f(x+4+o,ys+.5,.5,11.5,'#0b0b12');
    }
  }
  f(11.5,0,.5,H,'#3b3743');f(132,0,.5,H,'#3b3743');
  const gy=sy(0);
  if(gy<H){f(0,gy,W,H-gy,'d');f(0,gy,W,1,'l');for(let x=6;x<W;x+=14)f(x,gy+4,6,1,'k')}
  const pour=state!=='title'&&(state!=='intro'||it>=1.5);
  f(0,sy(30),16,2,'k');f(0,sy(28),20,28,'k');f(20,sy(28),2,28,'d');f(16,sy(31),4,3,'d');
  if(pour)f(0,sy(4),18,4,'o');
  f(118,sy(46),14,16,'d');f(118,sy(46),14,1,'l');f(121,sy(43),2,2,'k');f(127,sy(43),2,2,'k');
  f(120,sy(37),8,3,pour?'o':'k');
}

function drawVines(){
  for(let l=0;l<3;l++){
    const x=LX[l]-1,ls=segs.filter(s=>s.lane===l&&s.y1>camY&&s.y0<camY+H);
    for(let wy=Math.max(30,Math.floor(camY));wy<camY+H;wy++){
      const s=ls.find(s=>wy>=s.y0&&wy<s.y1);
      if(s&&isGap(s))continue;
      const ys=sy(wy);
      if(s){ // fragile: dry, shakes, blinks red before snapping
        const jx=s.t>1.2&&Math.random()<.5?.5:0,red=s.t>1.5&&(T*10|0)%2,edge=red?'#be1250':'#742f29';
        f(x+jx,ys,.5,1,edge);f(x+.5+jx,ys,1,1,red?'r':(wy%5<2?'#c98a4b':'h'));f(x+1.5+jx,ys,.5,1,edge);
        if(wy%7===0)f(x+jx+(wy%14?1.5:-.5),ys,1,.5,'#742f29');
        continue;
      }
      f(x,ys,.5,1,'g');f(x+.5,ys,1,1,'G');f(x+1.5,ys,.5,1,'g');
      f(x+((wy%6)<3?.5:1),ys,.5,.5,'#a8e72e');
      if(wy%10===0){const h=hash(l*97+wy);
        if(h>.72){f(x+2,ys,1,.5,'g');f(x+2.5,ys-.5,1.5,.5,'G');f(x+3.5,ys-1,1,.5,'G');f(x+3,ys-.5,.5,.5,'#a8e72e')}
        else if(h>.45){f(x-1,ys,1,.5,'g');f(x-2,ys-.5,1.5,.5,'G');f(x-2.5,ys-1,1,.5,'G');f(x-1.5,ys-.5,.5,.5,'#a8e72e')}
      }
    }
    for(const s of ls)if(isGap(s)){
      const a=sy(s.y0),b=sy(s.y1),c=s.type==='F'?'h':'g',c2=s.type==='F'?'#c98a4b':'G';
      f(x,a-1,.5,1,c);f(x+1,a-1.5,.5,1.5,c2);f(x+1.5,a-.5,.5,.5,c);
      f(x+.5,b,.5,1.5,c);f(x+1.5,b,.5,1,c2);f(x-.5,b+1,.5,.5,c);
    }
  }
  for(const q of parts)f(q.x,sy(q.y),.5,.5,q.c);
}

function drawLava(){
  const pour=state!=='title'&&(state!=='intro'||it>=1.5),end=sy(Math.max(lavaY,0));
  if(pour){
    for(const [x,src] of [[18,6],[118,36]])if(lavaY<src){
      const top=sy(src);
      for(let yy=top;yy<end;yy++)f(x,yy,4,1,((yy-T*60)%6+6)%6<2?'y':'o');
      if(lavaY<0)for(let i=0;i<3;i++)f(x-2+Math.random()*8,end-1-Math.random()*3,1,1,'y');
    }
  }
  const ly=sy(lavaY);
  if(ly>=H+4)return;
  cx.globalAlpha=.16;f(0,ly-12,W,14,'r');cx.globalAlpha=.08;f(0,ly-28,W,16,'o');cx.globalAlpha=1;
  for(let i=0;i<W*2;i++){
    const x=i/2,top=Math.round((ly+Math.sin(x*.35+T*5)*1.2+Math.sin(x*.13-T*3))*2)/2;
    if(((i+(T*8|0))&7)===0)f(x,top-2.5,.5,.5,'o');
    f(x,top,.5,10,'o');f(x,top,.5,.5,'w');f(x,top+.5,.5,1,'y');
    if(((i>>2)+(T*4|0))%5===0)f(x,top+1.5,.5,1.5,'y');
    for(let r=6;r<10;r+=.5)if((i+r*2)&1)f(x,top+r,.5,.5,'r');
    f(x,top+10,.5,12,'r');
    for(let r=22;r<26;r+=.5)if((i+r*2)&1)f(x,top+r,.5,.5,'#be1250');
    f(x,top+26,.5,Math.max(0,H-top-26)+2,'#be1250');
  }
  for(const b of bubbles){const by=ly+4+((b.x*7)%30);if(by<H){f(b.x,by,1.5,1.5,b.l>.2?'y':'o');f(b.x+.5,by+.5,.5,.5,'w')}}
}

function drawObstacles(){
  for(const s of spikes){
    if(s.st==='warn'&&s.w<SPIKE_WARN&&(T*8|0)%2)txt('!',LX[s.lane]-1,20,2,'y');
    if(s.st==='fall'){const t=sy(s.y+9),x=LX[s.lane];
      f(x-.5,t-4,.5,3,'#5f574f');f(x+1,t-3,.5,2,'#5f574f');
      for(let i=0;i<18;i++){const wf=Math.max(1,14-Math.floor(i*.78)),w=wf/2,x0=x-Math.ceil(wf/2)/2,y=t+i/2;
        f(x0,y,w,.5,i<3?'#5f574f':'l');f(x0,y,.5,.5,i<3?'d':'w');if(wf>2)f(x0+w-.5,y,.5,.5,i<3?'#3a3438':'d')}}
  }
  for(const j of jets){
    const ys=sy(j.y),L=j.side<0,bx=L?7:131,mx=L?10:131;
    f(bx,ys-4,6,8,'#4a4552');f(bx,ys-4,6,.5,'#6a6472');f(bx,ys+3.5,6,.5,'#1a181f');
    f(L?bx+1:bx+4,ys-3,1,1,'#2a2730');f(L?bx+1:bx+4,ys+2,1,1,'#2a2730');
    const glow=j.st==='warn'?((T*12|0)%2?'o':'r'):j.st==='fire'?'y':j.st==='done'&&j.t<1?'#be1250':null;
    f(mx,ys-1.5,3,3,'k');if(glow)f(mx+.5,ys-1,2,2,glow);
    if(j.st==='warn'&&(T*8|0)%2){const a=L?14:j.reach,b=L?j.reach:130;for(let x=a;x<b;x+=3)f(x,ys,1.5,.5,'r')}
  }
}

function drawTrapsBack(){for(const o of traps)if(o.st!=='wait'&&TR[o.type].back)TR[o.type].back(o)}
function drawTrapsFront(){for(const o of traps)if(o.st!=='wait'&&TR[o.type].draw)TR[o.type].draw(o)}

function drawFlames(){
  for(const j of jets){
    if(j.st!=='fire')continue;
    const ys=sy(j.y),L=j.side<0,x0=L?13:131,len=Math.abs(j.reach-x0)+4;
    const grow=Math.min(1,j.t/.12),fade=j.t>.75?Math.max(.2,(.9-j.t)/.15):1;
    for(let i=0;i<len*2*grow;i++){
      const u=i/(len*2),x=L?x0+i/2:x0-i/2-.5;
      const th=Math.round((2.6+Math.sin(i*.9+T*40)*.6+hash(i+(T*30|0))*.5)*(1-u*.4)*fade*2)/2;
      f(x,ys-th,.5,th*2,'r');
      const t2=Math.round(th*1.3)/2;f(x,ys-t2,.5,t2*2,'o');
      const t3=Math.round(th*.6)/2;if(t3>0)f(x,ys-t3,.5,t3*2,'y');
    }
  }
}

function drawPlayer(){
  if(state==='title')return;
  if(state==='dead'&&p.y<lavaY-12)return;
  if(p.inv>0&&state==='play'&&(T*20|0)%2)return;
  const x=p.x-6,y=sy(p.y)-18;
  const tint=state==='dead'&&deathKind==='burn'?((T*10|0)%2?'r':'k'):null;
  if(state==='intro'&&it<1.3){const i=(p.anim|0)%4;drawSpr(RUN[i],x,y-(i%2?.5:0),tint)}
  else if(state==='intro'&&it<2)drawSpr(STAND,x,y,tint);
  else if(state==='dead')drawSpr(FALL,x,y,tint);
  else if(p.stun>0)drawSpr(HIT,x,y,tint);
  else drawSpr(CLIMB[(p.anim|0)%4],x,y,tint);
  if(state==='intro'&&it>=1.3&&it<2&&(T*8|0)%2)txt('!',x+5,y-8,1,'y');
}

function drawHud(){
  if(state==='title'){
    txt('DUNGEON','c',40,4,'o');txt('CLIMB','c',64,4,'G');
    if((T*2|0)%2===0)txt('TAP TO START','c',140,1,'w');
    txt('SWIPE OR ARROWS','c',156,1,'l');
    txt('HI '+best,'c',172,1,'y');
    return;
  }
  const m=height();
  txt(''+score(),16,8,2,'w');txt(m+'M',16,22,1,'l');
  if(combo>1&&T-comboT<3)txt('X'+combo,16+tw(''+score(),2)+4,8,1,'y');
  const hi='HI '+best;txt(hi,128-tw(hi,1),10,1,'y');
  for(const q of pops){const tx=Math.max(14,Math.min(130-tw(q.s,1),Math.round(q.x-tw(q.s,1)/2)));
    if(q.t<.7||(T*12|0)%2)txt(q.s,tx,sy(q.y)-q.t*20,1,'y')}
  if(state==='play'){
    const gap=p.y-lavaY,hgt=Math.max(0,Math.min(1,gap/110))*80;
    f(4,40,4,80,'n');f(4,120-hgt,4,hgt,gap<40?((T*8|0)%2?'r':'o'):'G');
    if(playT<2.5&&(T*3|0)%2===0)txt('SWIPE < >','c',110,1,'w');
  }
  if(state==='dead'){
    for(let y=0;y<H;y+=2)for(let x=(y>>1)&1;x<W;x+=2)f(x,y,1,1,'k');
    txt(deathKind==='fall'?'YOU FELL!':'TOO HOT!','c',70,2,'o');
    txt('SCORE '+score(),'c',98,1,'w');
    txt('HEIGHT '+m+'M','c',108,1,'l');
    txt('CLOSE CALLS '+closes,'c',118,1,'l');
    txt('BEST '+best,'c',130,1,'y');
    if(newBest&&(T*4|0)%2)txt('NEW BEST!','c',142,1,'G');
    if(deadT>.8&&(T*2|0)%2===0)txt('TAP TO RETRY','c',162,1,'w');
  }
}

function draw(){
  cx.save();
  if(shake>0)cx.translate(Math.round((Math.random()-.5)*shake)*S,Math.round((Math.random()-.5)*shake)*S);
  drawBg();drawVines();drawTrapsBack();drawObstacles();drawPlayer();drawFlames();drawTrapsFront();drawLava();
  cx.restore();
  drawHud();
}

let last=performance.now();
function loop(t){update(Math.min(.05,(t-last)/1000));last=t;draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);

function fit(){const s=Math.min(innerWidth/W,innerHeight/H);cv.style.width=W*s+'px';cv.style.height=H*s+'px'}
addEventListener('resize',fit);fit();

// input: swipe, tap, keys
let down=false,sx0=0,swiped=false;
const stage=document.getElementById('stage');
stage.addEventListener('pointerdown',e=>{unlock();down=true;swiped=false;sx0=e.clientX});
stage.addEventListener('pointermove',e=>{if(down&&!swiped&&Math.abs(e.clientX-sx0)>22){move(e.clientX>sx0?1:-1);swiped=true}});
addEventListener('pointerup',()=>{if(down&&!swiped)tap();down=false});
addEventListener('keydown',e=>{
  unlock();
  if(e.key==='ArrowLeft'||e.key==='a')move(-1);
  else if(e.key==='ArrowRight'||e.key==='d')move(1);
  else if(e.key===' '||e.key==='Enter'){tap();e.preventDefault()}
});
</script>
