const at=(o,rows)=>{const a=[];rows.forEach((s,i)=>a[o+i]=s);return a};
function scale3(g){
  const h=g.length,w=g[0].length,o=[],at=(r,c)=>r<0||r>=h||c<0||c>=w?'.':g[r][c];
  for(let r=0;r<h*3;r++)o[r]=[];
  for(let r=0;r<h;r++)for(let c=0;c<w;c++){
    const A=at(r-1,c-1),B=at(r-1,c),C=at(r-1,c+1),D=at(r,c-1),E=at(r,c),F=at(r,c+1),G=at(r+1,c-1),H=at(r+1,c),I=at(r+1,c+1);
    const e=[E,E,E,E,E,E,E,E,E];
    if(B!==H&&D!==F){
      e[0]=D===B?D:E;e[1]=(D===B&&E!==C)||(B===F&&E!==A)?B:E;e[2]=B===F?F:E;
      e[3]=(D===B&&E!==G)||(D===H&&E!==A)?D:E;e[5]=(B===F&&E!==I)||(H===F&&E!==C)?F:E;
      e[6]=D===H?D:E;e[7]=(D===H&&E!==I)||(H===F&&E!==G)?H:E;e[8]=H===F?F:E;
    }
    for(let i=0;i<9;i++)o[r*3+(i/3|0)][c*3+i%3]=e[i];
  }
  return o.filter((_,r)=>r%2===0).map(row=>row.filter((_,c)=>c%2===0));
}
function build(flip,...ls){
  let g=[];
  for(let r=0;r<24;r++){g[r]=[];for(let c=0;c<16;c++){let ch='.';
    for(const L of ls){const k=L[r]&&L[r][flip?15-c:c];if(k&&k!=='.')ch=k}g[r][c]=ch}}
  g=scale3(g);
  const h=g.length,w=g[0].length,on=(r,c)=>r>=0&&r<h&&c>=0&&c<w&&g[r][c]!=='.',px=[];
  for(let r=-1;r<=h;r++)for(let c=-1;c<=w;c++){
    if(on(r,c))px.push([c+1,r+1,g[r][c]]); // colour key, looked up in the outfit's palette when drawn
    else if(on(r-1,c)||on(r+1,c)||on(r,c-1)||on(r,c+1))px.push([c+1,r+1,null]);
  }
  return px;
}

const F={};for(const k in FD)F[k]=FD[k].split(' ').map(r=>[...r].map(c=>c==='1'?'#':'.'));
// bigger sizes: each font pixel becomes an n x n block, with corners cut or filled only where a stroke runs
// diagonally, so diagonals come out smooth while B, D, E keep their square corners
function fontUp(g,n){
  const h=g.length,w=g[0].length,on=(r,c)=>r>=0&&r<h&&c>=0&&c<w&&g[r][c]==='#',t=n>>1,o=[];
  for(let r=0;r<h*n;r++)o[r]=[];
  for(let r=0;r<h;r++)for(let c=0;c<w;c++){
    const E=on(r,c);
    for(let i=0;i<n;i++)for(let j=0;j<n;j++){
      let v=E;
      for(const [dr,dc] of [[-1,-1],[-1,1],[1,-1],[1,1]]){
        if((dr<0?i:n-1-i)+(dc<0?j:n-1-j)>=t)continue; // not in this corner of the block
        const V=on(r+dr,c),Hz=on(r,c+dc),D=on(r+dr,c+dc);
        if(E){if(!V&&!Hz&&!D&&(on(r+dr,c-dc)||on(r-dr,c+dc)))v=false}
        else if(V&&Hz&&!D)v=true;
      }
      o[r*n+i][c*n+j]=v?'#':'.';
    }
  }
  return o;
}
// glyph at n screen pixels per font pixel, as horizontal runs [x,y,w]

function glyph(ch,n){
  const k=ch+n;if(GLY[k])return GLY[k];

  m.forEach((row,y)=>{for(let x=0;x<row.length;x++)if(row[x]==='#'){let e=x;while(row[e+1]==='#')e++;r.push([x,y,e-x+1]);x=e}});
  return GLY[k]=r;
}

function txt(s,x,y,sc,c,sh=true){
  s=''+s;if(x==='c')x=(W-tw(s,sc))/2;
  const n=sc*S,x0=Math.round(x*S),y0=Math.round(y*S),o=Math.min(n,2);
  for(const [dx,col] of sh?[[o,'k'],[0,c]]:[[0,c]]){
    cx.fillStyle=P[col]||col;let xx=x0+dx;
    for(const ch of s){if(F[ch])for(const [gx,gy,gw] of glyph(ch,n))cx.fillRect(xx+gx,y0+dx+gy,gw,1);xx+=adv(ch)*n}
  }
}

}

}

// hand-made sections stitched together (Subway Surfers style). m() mirrors lanes left/right.
// c: sp speed, d difficulty, g gap length, W window between rows (shrinks with speed), S = g+W
const G=(l,a,b)=>segs.push({lane:l,type:'G',y0:a,y1:b});
const Fv=(l,a,b)=>segs.push({lane:l,type:'F',y0:a,y1:b,t:-1,broken:false});
const others=o=>[0,1,2].filter(l=>l!==o);
// breaks one or two vines starting at y. two breaks start together (so you see both at once and pick the open
// vine), but never stop at the same height, so it doesn't read as a wall. returns where the last break ends.
function block(lanes,y,g){
  if(lanes.length===1){G(lanes[0],y,y+g);return y+g}
  const d2=10+Math.random()*8,g2=g>=40&&Math.random()<.5?g-d2:g+d2,off=Math.random()*3;
  G(lanes[0],y,y+g);G(lanes[1],y+off,y+off+g2);return Math.max(y+g,y+off+g2);
}
// rows of breaks leaving open[i] open each time, with a window W after each row ends
const seq=(y,W,g,blocked)=>{let yy=y;for(const ls of blocked)yy=block(ls,yy,g)+W;return yy-W-y};
const rows=(y,W,g,open)=>seq(y,W,g,open.map(others));
// tiers: d = difficulty when the section unlocks; w = weight when it unlocks -> weight at max difficulty.
// early on you only get single isolated gaps; combos come in as you climb.
const SECTIONS=[
  {d:0,w:[3,.2],f:(y,m,c)=>{G(r3(),y,y+c.g);return c.g}},
  {d:0,w:[1.5,.1],f:(y,m,c)=>20+Math.random()*30*(1-c.d)},
  {d:.03,w:[3,1.2],f:(y,m,c)=>rows(y,c.W,c.g,[r3()])},
  {d:.05,w:[2,1.2],f:(y,m,c)=>{const st=c.g+Math.max(18,c.sp*(.36-.08*c.d));for(let i=0;i<3;i++)G(m(i),y+i*st,y+i*st+c.g);return st*2+c.g}},
  {d:.05,w:[1.5,.8],f:(y,m,c)=>{const o=Math.random()<.5?1:m(0);return block(others(o),y,c.S*1.6)-y}},
  {d:.12,w:[2,3],f:(y,m,c)=>rows(y,c.W,c.g,[m(0),m(1),m(2)])},
  {d:.12,w:[1.5,2],f:(y,m,c)=>{const a=r3();return rows(y,c.W,c.g,[a,a===1?m(0):1])}},
  // checker: middle open, then sides open, then middle...
  {d:.2,w:[1.5,2],f:(y,m,c)=>{const n=3+(Math.random()<c.d?1:0),b=[];for(let i=0;i<n;i++)b.push(i%2?[1]:[0,2]);return seq(y,c.W,c.g,b)}},
  {d:.35,w:[1.5,2.5],f:(y,m,c)=>rows(y,c.W,c.g,[m(0),m(1),m(0),m(1)])},
  // crossfire: open lane jumps from one side to the other (needs a double swipe, so the window is wider)
  {d:.35,w:[1,2],f:(y,m,c)=>rows(y,Math.max(30,c.sp*(.5-.1*c.d)),c.g,[m(0),m(2)])},
];
// fast-crumbling fragile pieces mixed into the layout; short enough to climb over unless you get stunned on one
function sprinkleFragile(a,b,sp,d){
  for(let l=0;l<3;l++){
    if(Math.random()>.3+.35*d)continue;
    const len=sp*(.55+Math.random()*.2);
    // never on your only way through: somewhere alongside it there must always be another lane without a gap
    const alt=y0=>{for(let y=y0-10;y<=y0+len+10;y+=6)if(!others(l).some(q=>!segs.some(s=>s.lane===q&&s.type==='G'&&s.y0<y+6&&s.y1>y-6)))return false;return true};
    for(let k=0;k<10;k++){const y0=a+Math.random()*Math.max(0,b-a-len);if(clearAt(l,y0-6,y0+len+6)&&alt(y0)){Fv(l,y0,y0+len);break}}
  }
}
function placeSection(){
  const y=genY,d=diff(y),sp=spAt(y),g=Math.max(22,Math.round((14+Math.random()*6)*Math.max(1,sp/60)+d*4)),W=Math.max(20,sp*(.42-.12*d)),S=g+W;
  const ok=SECTIONS.filter(s=>d>=s.d),wt=s=>s.w[0]+(s.w[1]-s.w[0])*Math.min(1,(d-s.d)/(1-s.d));
  let r=Math.random()*ok.reduce((t,s)=>t+wt(s),0),sec=ok[0];
  for(const s of ok)if((r-=wt(s))<=0){sec=s;break}
  const flip=Math.random()<.5,len=sec.f(y,l=>flip?2-l:l,{sp,d,g,S,W});
  // breathing room between sections: wide during the warm-up, still enough for a double swipe at top speed
  genY=y+len+(y<WARM?60+Math.random()*30:Math.max(16,sp*(.5-.2*d))+Math.random()*8);
  if(y>WARM+200)sprinkleFragile(y-10,genY,sp,d);
}

// gem tiers: common orange early, purple and red cut in (and get more common) the further/faster you climb,
// each worth more than the last. light/base/dark are the three facet shades, line is the pop-off-the-background outline.
const GEM_TIERS=[
  {d:0,  w:[1,.5], pts:2,  light:'y',       base:'o',       dark:'#a85e00', line:'#4a2a00'},
  {d:.15,w:[0,.4], pts:6,  light:'#e8b8ff', base:'#b24aff', dark:'#5a1a73', line:'#28103a'},
  {d:.4, w:[0,.3], pts:12, light:'#ff8fae', base:'r',       dark:'#8a0030', line:'#3d0016'},
];
function pickGemTier(d){
  const ok=GEM_TIERS.filter(t=>d>=t.d),wt=t=>t.w[0]+(t.w[1]-t.w[0])*Math.min(1,(d-t.d)/(1-t.d));
  let r=Math.random()*ok.reduce((s,t)=>s+wt(t),0),tier=ok[0];
  for(const t of ok)if((r-=wt(t))<=0){tier=t;break}
  return tier;
}
// gem trail: drop a gem in a lane that's currently clear, nudged toward the last lane so the trail
// curves smoothly (Subway Surfers style "follow the safe line") instead of jumping between rows
function placeGemRow(){
  const y=gemY;gemY+=14;
  const cand=[0,1,2].filter(l=>gapFree(l,y-4,y+4)&&!segs.some(s=>s.lane===l&&s.type==='F'&&!s.broken&&s.y0<y+4&&s.y1>y-4));
  if(!cand.length)return;
  gemLane=cand.includes(gemLane)?gemLane:cand.reduce((a,b)=>Math.abs(b-gemLane)<Math.abs(a-gemLane)?b:a);
  if(gems.some(g=>g.bait&&g.lane===gemLane&&Math.abs(g.y-y)<10)||pups.some(u=>!u.between&&u.lane===gemLane&&Math.abs(u.y-y)<10))return;
  gems.push({lane:gemLane,y,got:false,ph:Math.random()*10,tier:GEM_TIERS[0]});
}
// bait: purple and red gems sit OFF the safe line, where grabbing them is a risk you choose to take:
//  frag = purple along a fragile vine; side = three purple running up to a break; stub = one red on the last bit before a break.
// always optional, and only placed where the vine under it is whole and a neighbouring vine stays open to swipe onto.
function placeBait(a,b){
  // red stubs are the rare, nasty ones: none early, then up to about a third of all bait at the top
  // (the kind is rolled once per bait and kept until it finds a spot, so the easy-to-place stubs don't crowd out the rest)
  const d=diff(a),sp=spAt(a);
  baitKind=baitKind||(d>=.1&&Math.random()<.12+.25*d?'stub':'purple');
  const kinds=baitKind==='stub'?['stub']:Math.random()<.5?['frag','side']:['side','frag'];
  const adjOpen=(l,y0,y1,gapsOnly)=>[l-1,l+1].some(q=>q>=0&&q<=2&&(gapsOnly?!segs.some(s=>s.lane===q&&s.type==='G'&&s.y0<y1&&s.y1>y0):clearAt(q,y0,y1)));
  const put=(lane,y,t,kind)=>gems.push({lane,y,got:false,ph:Math.random()*10,tier:GEM_TIERS[t],bait:kind});
  const taken=(l,y0,y1)=>gems.some(g=>g.bait&&g.lane===l&&g.y>y0-30&&g.y<y1+30)||pups.some(u=>!u.between&&u.lane===l&&u.y>y0-20&&u.y<y1+20);
  for(const k of kinds){
    if(k==='frag'){
      const s=segs.find(s=>s.type==='F'&&!s.broken&&s.t<0&&s.y0>=a&&s.y1<b&&!taken(s.lane,s.y0,s.y1)&&adjOpen(s.lane,s.y0-10,s.y1+24,true));
      if(!s)continue;
      const len=s.y1-s.y0,n=len>=38?3:2,st=Math.min(12,(len-12)/(n-1));
      for(let i=0;i<n;i++)put(s.lane,s.y0+5+i*st,1,k);
      baitKind=null;return true;
    }
    const n=k==='stub'?1:3,off=k==='stub'?Math.max(8,sp*.12):Math.max(16,sp*.22);
    for(const s of segs){
      if(s.type!=='G'||s.y0<a||s.y0>=b)continue;
      const l=s.lane,last=s.y0-off,first=last-(n-1)*12;
      if(first<a||taken(l,first,last)||!clearAt(l,first-10,s.y0)||laneThreat(l,first-10,s.y0))continue;
      // the way off: a whole neighbouring vine from the last gem to well past the break
      if(!adjOpen(l,last-10,s.y0+40))continue;
      for(let i=0;i<n;i++)put(l,first+i*12,k==='stub'?2:1,k);
      baitKind=null;return true;
    }
  }
  return false;
}
// power-ups. placed relative to the gem trail so they read as a choice instead of turning up anywhere:
// most sit on a vine one lane OFF the trail (you leave the gems to get it); the rest float BETWEEN the trail's vine
// and a neighbour and are only collected by swiping across at the right moment.
// both kinds only go where the vines involved are whole (no gap, no fragile) and no trap is set up.
function rollPup(){
  // shuffled bag: all five come round before any repeats, and never one that's still running
  if(!pupBag.length)pupBag=[...PUP_KINDS].sort(()=>Math.random()-.5);
  const i=pupBag.findIndex(k=>pT[k]<=0);
  return pupBag.splice(i<0?0:i,1)[0];
}
// the lane the gem trail will be in when it reaches height y (same rule as placeGemRow, minus traps that aren't set yet)
function trailAt(y){
  let l=gemLane;
  for(let yy=gemY;yy<=y;yy+=14){const c=[0,1,2].filter(q=>clearAt(q,yy-4,yy+4));if(c.length&&!c.includes(l))l=c.reduce((a,b)=>Math.abs(b-l)<Math.abs(a-l)?b:a)}
  return l;
}
function placePup(a,b){
  if(pupKind&&pT[pupKind]>0){pupBag.push(pupKind);pupKind=null} // picked while waiting for a spot: don't offer it again yet
  pupKind=pupKind||rollPup();
  if(pupBetween===null)pupBetween=Math.random()<.35; // decided once and kept while it looks for a spot, so the mix holds
  const sp=spAt(a),add=o=>{pups.push({kind:pupKind,got:false,ph:Math.random()*6,between:pupBetween,...o});pupKind=pupBetween=null;pupN++;return true};
  for(let y=a;y<b;y+=8){
    const t=trailAt(y);
    if(pupBetween){
      // both vines whole where you swipe across, and at least one of them stays whole long enough to react after landing
      for(const l of t===0?[0]:t===2?[1]:Math.random()<.5?[0,1]:[1,0])
        if(clearAt(l,y-34,y+14)&&clearAt(l+1,y-34,y+14)&&(clearAt(l,y,y+12+sp*.35)||clearAt(l+1,y,y+12+sp*.35))&&!laneThreat(l,y-20,y+30)&&!laneThreat(l+1,y-20,y+30))
          return add({x:(LX[l]+LX[l+1])/2,y,l0:l});
    }else{
      // its vine is whole, and so is the trail's vine next to it until you've had time to swipe back
      for(const l of t===1?(Math.random()<.5?[0,2]:[2,0]):[1])
        if(clearAt(l,y-20,y+30)&&clearAt(t,y-20,y+24+sp*.35)&&!laneThreat(l,y-20,y+30)&&!laneThreat(t,y-20,y+30)&&!gems.some(g=>g.bait&&g.lane===l&&Math.abs(g.y-y)<24))
          return add({x:LX[l],y,lane:l,back:t});
    }
  }
  return false;
}
// start (or refill) a power-up's timer; t overrides the normal length (starter shield)
function give(k,t){pT[k]=pMax[k]=t||pupDur(k)}
function getPup(u){
  const k=u.kind,d=PUPS[k];u.got=true;give(k);
  if(k==='cool'&&!caught)surge=0; // cooled lava backs off straight away
  pops.push({s:d.name,x:p.x,y:p.y+30,t:0});
  for(let i=0;i<12;i++)parts.push({x:u.x+Math.random()*8-4,y:u.y+Math.random()*8-4,vx:(Math.random()-.5)*50,vy:Math.random()*50-10,l:.5,c:d.c});
  snd(520,1560,.25,'square',.05);
}
// hauled to the nearest stretch of whole vine (any lane) that's long enough to react on. you can't fall until your
// hands reach it (ropeSafeY), so a save is never wasted on a vine that breaks next.
function haul(){
  const need=20+speed*.35,h=hands();
  let best=p.lane,by=h+200,bc=1e9;
  for(let l=0;l<3;l++)for(let y=h;y<h+200;y+=4){
    if(segs.some(s=>s.lane===l&&isGap(s)&&s.y0<y+need&&s.y1>y))continue;
    const c=y-h+Math.abs(l-p.lane)*8+(segs.some(s=>s.lane===l&&s.type==='F'&&!s.broken&&s.y0<y+need&&s.y1>y)?30:0);
    if(c<bc){bc=c;best=l;by=y}
    break;
  }
  ropeSafeY=by+2;ropeFx={t:.35,x0:p.x};
  p.prevLane=p.lane;p.switchT=T;p.lane=best;p.inv=Math.max(p.inv,1);shake=3;
}
// rope: instead of falling, it hauls you to safety (once: that uses it up)
function useRope(){
  pT.rope=0;haul();
  pops.push({s:'ROPE SAVE!',x:p.x,y:p.y+30,t:0});snd(300,900,.2,'square',.06);
}
// gem chain: every gem collected in a row builds a multiplier on gem points; a hit or 2s without a gem breaks it
const chainMult=()=>chain>=100?4:chain>=40?3:chain>=15?2:1;
function breakChain(){
  if(chainMult()>1){pops.push({s:'CHAIN LOST',x:p.x,y:p.y+30,t:0});snd(300,150,.15,'square',.04)}
  chain=0;
}
// a short burst of bonus gems right above you after a close call (Jetpack Joyride style reward beat)
function gemBurst(lane,y0){
  const tier=pickGemTier(diff(y0));
  for(let i=0;i<3;i++){const y=y0+i*12;if(clearAt(lane,y-4,y+4))gems.push({lane,y,got:false,ph:Math.random()*10,tier})}
}

function close(label){
  combo=T-comboT<3?combo+1:1;comboT=T;closes++;
  const pts=10*combo;bonus+=pts;
  pops.push({s:label+' +'+pts,x:p.x,y:p.y+22,t:0});
  snd(660,1320,.1,'square',.04);
  gemBurst(p.lane,p.y+20);
}

function move(d){
  if(state!=='play'||paused)return;
  const n=Math.max(0,Math.min(2,p.lane+d));
  if(n===p.lane)return;
  for(const s of segs){
    if(s.lane!==p.lane)continue;
    const dist=s.y0-grip();
    if(isGap(s)&&dist>=0&&dist<10){close('DODGE');break}
    if(s.type==='F'&&!s.broken&&s.t>FRAG*.65&&onSeg(s)){close('CLUTCH');break}
  }
  p.prevLane=p.lane;p.switchT=T;p.lane=n;ropeSafeY=-1;snd(520,880,.06);
  // swiping across grabs a power-up floating between those two vines, if it's level with you
  const xa=Math.min(LX[p.prevLane],LX[n]),xb=Math.max(LX[p.prevLane],LX[n]);
  for(const u of pups)if(u.between&&!u.got&&u.x>xa&&u.x<xb&&u.y>p.y-10&&u.y<p.y+32)getPup(u);
}
function tap(px,py){
  if(px===undefined){ // space / enter: the main action on each screen
    if(state==='title'&&!settingsOpen||state==='dead'&&deadT>.8)play();else if(state==='play'&&paused)resume();
    return;
  }
  const r=cv.getBoundingClientRect(),x=(px-r.left)/r.width*W,y=(py-r.top)/r.height*H;
  const b=btns.find(b=>x>=b.x-1&&x<b.x+b.w+1&&y>=b.y-1&&y<b.y+b.h+1);
  if(b)b.fn();
  else if(state==='play'&&paused)resume(); // anywhere else on the pause screen resumes
  else if(state==='shop'&&shopInfo)shopInfo=null; // tap outside the info panel closes it
  else if(state==='title'){if(settingsOpen){settingsOpen=false;snd(660,440,.08)}else play()} // home: tap anywhere to play
}
function die(kind){
  deadY=p.y;state='dead';deathKind=kind;deadT=0;p.vy=kind==='fall'?55:0;shake=6; // a fall starts with a small hop off the vine end
  endRun();
  snd(440,40,.8,'sawtooth',.07);
}
// best score and the gems you collected go in the bank (only what's new, if you revive and die again)
function endRun(){
  if(score()>best){best=score();newBest=true;try{localStorage.setItem('lavaclimb_best',best)}catch(e){}}
  save.bank+=gemCount-banked;banked=gemCount;store();
}
// revive (once per run): back on the nearest whole vine, lava pushed away, a 3-2-1 and a moment of no-hit time.
// uses one from stock, or buys one on the spot
const canRevive=()=>!revived&&(save.boost.revive>0||save.bank>=BOOSTS.revive.cost);
function revive(){
  if(state!=='dead'||!canRevive())return;
  if(save.boost.revive>0)save.boost.revive--;else save.bank-=BOOSTS.revive.cost;
  store();revived=true;state='play';
  p.y=deadY;p.vy=0;p.stun=0;caught=false;surge=0;haul();p.inv=2.5;shake=0;
  lavaY=Math.min(lavaY,p.y-FAR);
  paused=true;resumeT=RESUME;snd(330,990,.3,'square',.05);
}
function play(){reset();state='intro';firstRun=!save.runs&&!best;save.runs=(save.runs||0)+1;store();snd(330,660,.15)}
function quit(){endRun();reset();state='title'}
function hit(){
  if(p.inv>0)return;
  if(pT.shield>0){ // shield takes the hit: no stun, no lava surge, chain kept
    pT.shield=0;p.inv=1;shake=3;pops.push({s:'SHIELD BROKE',x:p.x,y:p.y+30,t:0});snd(900,200,.25,'square',.06);
    for(let i=0;i<14;i++)parts.push({x:p.x+Math.random()*16-8,y:p.y+Math.random()*18,vx:(Math.random()-.5)*70,vy:Math.random()*60-10,l:.5,c:Math.random()<.5?'b':'w'});
    return;
  }
  const ny=p.y-6;
  if(!segs.some(s=>isGap(s)&&s.lane===p.lane&&ny+16<s.y1&&p.y+16>=s.y0))p.y=ny;
  p.stun=.45;p.inv=1;shake=5;combo=0;breakChain();snd(220,50,.25,'sawtooth',.08);
  // second hit while the lava is still at your heels: it catches you. otherwise it surges up close.
  if(surge>0){caught=true;p.stun=9}
  else if(pT.cool<=0){surge=SURGE;beat=0;p.inv=1.5;if(hints<1){hints++;hintT=3;try{localStorage.setItem('lavaclimb_hint',hints)}catch(e){}}snd(60,180,.5,'sawtooth',.07)} // longer no-hit time, so one trap pattern can't land both hits
}

// fire jets: a wall vent warns, then fire covers 1-2 lanes from its side.
// never placed so that every uncovered lane has a gap at that height.
const jetLanes=(side,n)=>(side<0?[0,1]:[2,1]).slice(0,n);
const clearAt=(l,a,b)=>!segs.some(s=>s.lane===l&&s.y0<b&&s.y1>a);
// is lane l (between heights a..b) already covered by another trap that's set up or going off?
function laneThreat(l,a,b){
  for(const o of traps){
    if(o.st==='wait'||o.dead)continue;
    if(o.type==='wall'&&o.y<b&&o.y+o.len>a&&((o.both||o.side<0)&&l===0||(o.both||o.side>0)&&l===2))return true;
    if(o.type==='geyser'&&o.steps&&o.steps.some(s=>s.ph!=='done'&&s.lanes.includes(l)))return true;
    if(o.type==='coil'&&o.y<b+20&&o.y>a-20&&(o.lane===l||(o.dir&&o.lane+o.dir===l)))return true;
    if(o.type==='blade'&&o.y-10<b&&o.Py-25>a)return true;
  }
  // a warning that's already showing reserves its lane around where it will reach you (m), so nothing
  // placed later can take away the escape from it
  const near=m=>m!==undefined&&m>a-25&&m<b+25;
  if(spikes.some(s=>s.lane===l&&s.st!=='gone'&&near(s.m)))return true;
  for(const o of traps){
    if(o.type==='drop'&&!o.dead&&o.lane===l&&near(o.m))return true;
    if(o.type==='bats'&&o.sw&&o.sw.some(s=>s.tgt===l&&s.st!=='gone'&&near(s.m)))return true;
  }
  return jets.some(j=>j.st!=='done'&&j.lanes.includes(l)&&j.y>a-6&&j.y<b+6);
}
// an escape lane must be free of gaps and other traps: sitting on a fragile piece is fine while nothing hits you there
const gapFree=(l,a,b)=>!segs.some(s=>s.lane===l&&s.type==='G'&&s.y0<b&&s.y1>a)&&!laneThreat(l,a,b);
// triggered traps start this far below their spot so they go off around where the spawner placed them
const trig=y=>Math.max(150,spAt(y)*1.4);
// last-moment safety net, checked when a trap actually launches (its timing is exact by then):
// is lane l your only way through between heights a..b? if so the trap fizzles instead of firing.
const onlyWay=(l,a,b)=>!canEscape([l],a,b);
// can you stay out of the `hit` lanes from height a to b? one free lane that stays clear works; so do two
// neighbouring free lanes if at every height at least one of them is clear (with a little overlap to switch)
// (gapsOnly: ignore other traps, for a trap checking against its own later steps)
function canEscape(hit,a,b,gapsOnly){
  const clear=gapsOnly?(l,a,b)=>!segs.some(s=>s.lane===l&&s.type==='G'&&s.y0<b&&s.y1>a):gapFree;
  const free=[0,1,2].filter(l=>!hit.includes(l));
  if(free.some(l=>clear(l,a,b)))return true;
  if(free.length<2||Math.abs(free[0]-free[1])!==1)return false;

// each spawner returns seconds of travel to keep free after it (so traps don't stack),
// or null if it couldn't be placed fairly.
const SPAWN={
  wave:y=>{waves.push({ty:y-trig(y)});return 1.6},
  jet:y=>{
    const ok=(side,n)=>{const cov=jetLanes(side,n);return canEscape(cov,y-24,y+20+spAt(y)*.35)};
    let side=Math.random()<.5?-1:1,n=Math.random()<.2+.5*diff(y)?2:1;
    if(!ok(side,n)){if(ok(-side,n))side=-side;else if(ok(side,1))n=1;else if(ok(-side,1)){side=-side;n=1}else return null}
    jets.push({st:'idle',y,side,lanes:jetLanes(side,n),reach:side<0?LX[n-1]+6:LX[3-n]-6,t:0});return 0;
  },
  drop:y=>{traps.push({type:'drop',st:'wait',ty:y-trig(y)});return .9},
  coil:y0=>{
    for(const y of [y0,y0+25,y0+50])for(const lane of [0,1,2].sort(()=>Math.random()-.5)){
      const need=lane===1?[0,2]:[lane===0?2:0];
      if(need.every(l=>gapFree(l,y-20,y+20+spAt(y)*.35))){
        // the snake sits on solid vine: clear whatever was under it (only ever makes the layout easier)
        segs=segs.filter(s=>!(s.lane===lane&&s.y0<y+14&&s.y1>y-6));
        traps.push({type:'coil',st:'idle',y,lane,t:0});return .5;
      }
    }
    return null;
  },
  bats:y=>{traps.push({type:'bats',st:'wait',ty:y-trig(y)});return 2},
  geyser:y=>{traps.push({type:'geyser',st:'wait',ty:y-trig(y)});return 1.4},
  wall:y=>{
    const d=diff(y),both=d>.4&&Math.random()<.35,side=Math.random()<.5?-1:1,len=24;
    const cov=both?[0,2]:[side<0?0:2];

    traps.push({type:'wall',st:'on',y,len,side,both,per:1.3-.3*d,ph:Math.random()*2});return .5;
  },
  // later on, two saws hung one above the other swing out of sync
  blade:y0=>{

// traps come from a shuffled deck so every unlocked type shows up regularly; a newly unlocked type comes next.
// unlock heights in world units (8 per metre): everything is in by ~55m
const UNLOCK={wave:0,drop:WARM+80,coil:WARM+180,jet:WARM+300,bats:WARM+450,wall:WARM+600,geyser:WARM+750,blade:WARM+950};
function nextKinds(y){
  const un=Object.keys(UNLOCK).filter(k=>y>=UNLOCK[k]),fresh=un.filter(k=>!known.has(k));
  if(!deck.length){deck=[...un,'wave'].sort(()=>Math.random()-.5);if(deck[0]===lastKind)deck.push(deck.shift())}
  return [...fresh,...deck];
}
function spawnAt(y){
  for(const k of nextKinds(y).slice(0,4)){
    const r=SPAWN[k](y);
    if(r!==null){const i=deck.indexOf(k);if(i>=0)deck.splice(i,1);known.add(k);lastKind=k;return r}
  }
  return SPAWN.wave(y);
}

// small creature sprites: authored tiny, upscaled 1.5x and outlined like the explorer
function mkSpr(rows,pal){
  const g=scale3(rows.map(r=>[...r])),h=g.length,w=g[0].length,on=(r,c)=>r>=0&&r<h&&c>=0&&c<w&&g[r][c]!=='.',px=[];
  for(let r=-1;r<=h;r++)for(let c=-1;c<=w;c++){
    if(on(r,c))px.push([c+1,r+1,pal[g[r][c]]]);
    else if(on(r-1,c)||on(r+1,c)||on(r,c-1)||on(r,c+1))px.push([c+1,r+1,null]);
  }
  px.w=(w+2)/S;px.h=(h+2)/S;return px;
}
const BAT_ROWS=[

// a hazard in `lane` passing you right after you left that lane is a close call
function passClose(o,lane,yy){
  if(!o.chk&&yy<p.y+9){o.chk=true;if(p.lane!==lane&&p.prevLane===lane&&T-p.switchT<.6)close('CLOSE')}
}
// picks the lane to attack: usually yours, only if another lane stays climbable around height a..b
function aimLane(a,b){
  const ok=l=>canEscape([l],a,b+speed*.35);
  // never aim at a lane you just switched into: that's the lane you escaped to
  if(T-p.switchT<.6)return [p.prevLane,...others(p.lane).filter(l=>l!==p.prevLane)].find(ok)??-1;
  const order=Math.random()<.65?[p.lane,...others(p.lane).sort(()=>Math.random()-.5)]:[r3(),0,1,2];
  return order.find(ok)??-1;

function bladePos(o,t){const th=o.A*Math.sin(o.w*(t+o.ph));return [72+o.L*Math.sin(th),o.Py-o.L*Math.cos(th)]}
const bladeHits=(bx,by,px,py,m=0)=>Math.abs(bx-px)<10+m&&Math.abs(by-(py+9))<13+m;
// predicts your climb past the blade(s) in each lane: needs a lane that's safe from all of them with room to spare,
// and a lane that gets hit
function bladeFair(os,sp){
  let safe=0,threat=0;
  const lo=Math.min(...os.map(o=>o.y)),top=Math.max(...os.map(o=>o.Py));
  for(let l=0;l<3;l++){
    if(!gapFree(l,lo-24,top-25))continue;
    let near=false,h=false;
    for(let t=0;t<9&&!h;t+=.02){const py=p.y+sp*t;if(py>top)break;
      for(const o of os){const [bx,by]=bladePos(o,T+t);if(bladeHits(bx,by,LX[l],py,6))near=true;if(bladeHits(bx,by,LX[l],py))h=true}}

        const tipL=12+e*32,tipR=132-e*32;
        if(((o.both||o.side<0)&&p.x-5<tipL)||((o.both||o.side>0)&&p.x+5>tipR)){o.hitDone=true;hit()}
      }
      if(e===1&&!o.snd&&Math.abs(o.y-p.y)<160){o.snd=true;snd(300,200,.06,'square',.02)}
      if(e===0)o.snd=false;
      if(o.y+o.len<camY-60)o.dead=true;
    },
    back(o){
      const e=wallExt(o),rattle=e>0&&e<.1?(T*30|0)%2*.5:0;
      for(const s of o.both?[-1,1]:[o.side]){
        const L=s<0,base=L?8:132;
        f(base,sy(o.y+o.len),4,o.len,'#3b3743');f(base,sy(o.y+o.len),4,.5,'#6a6472');
        for(let k=0;k<6;k++){
          const yc=sy(o.y+2+k*4),len=Math.max(1,e*32)+rattle;
          for(let j=-1.5;j<=1.5;j+=.5){const l=len*(1-Math.abs(j)/2),c=j<0?'w':j<1?'l':'d';
            if(L)f(12,yc+j,l,.5,c);else f(132-l,yc+j,l,.5,c)}
        }
      }
    },
  },
  blade:{
    tick(o){
      const [bx,by]=bladePos(o,T);
      if(!o.hitDone&&bladeHits(bx,by,p.x,p.y)){o.hitDone=true;hit()}
      if(!o.chk&&p.y+9>by&&Math.abs(by-(p.y+9))<14){o.chk=true;if(!o.hitDone&&Math.abs(bx-p.x)<22)close('CLOSE')}
      if(o.Py<camY-20)o.dead=true;
    },
    back(o){
      const [bx,by]=bladePos(o,T),py=sy(o.Py);
      f(12,py-3,120,3,'#4a4552');f(12,py-3,120,.5,'#6a6472');f(12,py-.5,120,.5,'#1a181f');
      for(let i=0;i<=14;i++){const x=72+(bx-72)*i/14,y=o.Py+(by-o.Py)*i/14;f(x-.5,sy(y)-.5,1,1,i%2?'#5f574f':'#8a8590')}
      f(70.5,py-1,3,3,'#2a2730');
    },
    draw(o){
      const disc=(bx,by)=>{const y0=sy(by);
        for(let dy=-6.5;dy<=6.5;dy+=.5){const w=Math.sqrt(42.25-dy*dy);f(bx-w,y0+dy,w*2,.5,dy>2.5?'w':dy>-1.5?'l':'#8a8590')}
        for(let k=0;k<8;k++){const a=k*Math.PI/4+T*25;f(bx+Math.cos(a)*7-.5,y0+Math.sin(a)*7-.5,1,1,'l')}
        f(bx-1.5,y0-1.5,3,3,'#2a2730');};
      const [gx,gy]=bladePos(o,T-.05);cx.globalAlpha=.25;disc(gx,gy);cx.globalAlpha=1;
      const [bx,by]=bladePos(o,T);disc(bx,by);
    },
  },
};

// spike waves (Jetpack Joyride style): drops one after another, always one lane open.
// patterns: "mixed" singles and pairs, and later "stairs" that sweep across the lanes in a quick rhythm.
// each drop shows its own "!" for sw seconds before it falls; sw shrinks as you climb.
const spikeV=()=>115+speed*.6;
const spikeEta=delay=>delay+(H-82)/(spikeV()+speed);
function fireWave(){
  const d=diff(p.y),sw=.75*warnK(),stairs=d>.15&&Math.random()<.4;
  const n=stairs?3:1+Math.floor(Math.random()*(1.6+d*2.6)),gapT=stairs?.34-.1*d:.55-.2*d;
  // stairs sweep toward you from the far side, so the lane you dodge into has already been cleared
  const order=p.lane===1?(Math.random()<.5?[0,1,2]:[2,1,0]):p.lane===0?[2,1,0]:[0,1,2];
  let open=p.lane;
  for(let i=0;i<n;i++){
    const delay=sw+i*gapT,ya=hands()+speed*spikeEta(delay);
    // lanes you can be in when it lands without falling (a fragile piece is fine as long as no spike hits you there)
    const path=[0,1,2].filter(l=>gapFree(l,ya-30,ya+24+speed*.35));
    if(!path.length)continue;
    let lanes;
    if(stairs){
      const tgt=order[i];if(!path.some(l=>l!==tgt))continue;lanes=[tgt];
    } else if(i>0&&Math.random()<.35+.45*d){
      // pair: leave one lane open, at most one swipe from the last open lane
      const near=path.filter(l=>Math.abs(l-open)<=1),pool=near.length?near:path,o=pool[Math.random()*pool.length|0];
      lanes=others(o);open=o;
    } else {
      // the first drop goes for your lane (or the one you just left); later drops never go for the lane you dodge into
      let tgt;
      if(i===0)tgt=T-p.switchT<.6?p.prevLane:p.lane;
      else{const c=others(open);tgt=c[Math.random()*c.length|0]}
      if(!path.some(l=>l!==tgt))continue;
      lanes=[tgt];
      if(i===0)open=path.filter(l=>l!==tgt).sort((a,b)=>Math.abs(a-tgt)-Math.abs(b-tgt))[0];
    }
    for(const l of lanes)spikes.push({st:'warn',w:delay,sw,lane:l,y:0});
  }
}

function update(dt){
  if(paused){
    if(resumeT>0){const a=Math.ceil(resumeT/.7);resumeT-=dt;const b=Math.ceil(resumeT/.7);
      if(resumeT<=0){paused=false;snd(660,990,.12,'square',.04)}else if(b<a)snd(440,440,.08,'square',.04)}
    return;
  }
  T+=dt;shake=Math.max(0,shake-dt*12);
  for(const q of parts){q.vy-=(q.g??200)*dt;q.y+=q.vy*dt;q.x+=(q.vx||0)*dt;q.l-=dt}
  parts=parts.filter(q=>q.l>0);
  for(const q of pops)q.t+=dt;
  pops=pops.filter(q=>q.t<1);
  if(state==='title'||state==='shop')return;
  if(state==='intro'){
    it+=dt;
    if(it<1.3){p.x=-6+78*(it/1.3);p.y=0;p.anim+=dt*10}
    else if(it<2){p.x=72;if(shake<1.5)shake=1.5;if(Math.random()<.15)snd(60,40,.12,'triangle',.08)}
    if(it>=1.6)lavaY+=14*dt;
    if(it>=2){const k=Math.min(1,(it-2)/.4);p.y=22*k+Math.sin(k*Math.PI)*10;
      if(k>=1){state='play';playT=0;p.y=22;
        if(save.boost.shield>0){save.boost.shield--;store();give('shield',BOOSTS.shield.t)}}} // starter shield from the shop
  } else if(state==='play'){
    playT+=dt;
    speed=spAt(p.y);
    if(p.stun>0)p.stun-=dt;else{p.y+=speed*dt;p.anim+=dt*(8+speed*.08)}
    p.inv-=dt;
    p.x+=(LX[p.lane]-p.x)*Math.min(1,dt*18);
    if(caught)lavaY+=160*dt;
    else if(surge>0){
      surge-=dt;
      const tg=p.y-(surge>SURGE_OUT?NEAR:NEAR+(FAR-NEAR)*(1-Math.max(0,surge)/SURGE_OUT));
      if(lavaY<tg)lavaY=Math.min(tg,lavaY+Math.max(300,speed*2.5)*dt);
      if(Math.random()<.5)parts.push({x:Math.random()*W,y:lavaY+1,vy:30+Math.random()*50,g:40,l:.6,c:Math.random()<.5?'o':'y'});
      if((beat-=dt)<=0){beat=.38;snd(70,45,.1,'triangle',.1)}
      if(surge<=0){bonus+=20;pops.push({s:'ESCAPED +20',x:p.x,y:p.y+22,t:0});snd(440,880,.2,'square',.05)}
    }
    else lavaY+=speed*(pT.cool>0?.45:.85)*Math.min(1,.4+playT/4)*dt; // cooled lava crawls
    if(p.y-lavaY>110)lavaY=p.y-110;

    while(genY<p.y+300)placeSection();
    while(gemY<p.y+180)placeGemRow();
    // bait goes in above the top of the screen so it scrolls in instead of popping up; more of it the higher you climb
    while(nextBaitY<p.y+200){
      const ok=placeBait(Math.max(nextBaitY,p.y+192),p.y+285);
      nextBaitY+=ok?(6-3.5*diff(nextBaitY)+Math.random()*2-1)*spAt(nextBaitY):60;
      if(ok)baitFails=0;else if(++baitFails>=3){baitFails=0;baitKind=null} // no spot for this kind around here: roll again
    }
    while(nextPupY<p.y+200){
      const ok=placePup(Math.max(nextPupY,p.y+192),p.y+285);
      nextPupY+=ok?(PUP_GAP[0]+Math.random()*(PUP_GAP[1]-PUP_GAP[0]))*spAt(nextPupY):80;
      if(ok)pupFails=0;else if(++pupFails>=(pupBetween?4:9)){pupFails=0;pupBetween=!pupBetween} // no room for that kind of spot here: try the other
    }
    for(const k in pT)if(pT[k]>0&&(pT[k]-=dt)<=0)snd(500,250,.15,'square',.03); // ran out
    if(ropeFx.t>0)ropeFx.t-=dt;
    for(const u of pups)if(!u.got&&!u.between&&u.lane===p.lane&&Math.abs(p.x-u.x)<5&&hands()>=u.y-6&&hands()<u.y+10)getPup(u);
    pups=pups.filter(u=>!u.got&&u.y>camY-20);
    if(chain&&T-lastGemT>2)breakChain();
    if(hintT>0)hintT-=dt;
    // after each trap, keep `w` seconds of travel clear (less of it at high speed, so the late game stays busy)
    while(nextY<p.y+230){const w=spawnAt(nextY);nextY+=150-100*diff(nextY)+Math.random()*40+w*spAt(nextY)*(1-.35*diff(nextY))}
    for(const o of traps){
      // a triggered trap that can't aim fairly right now keeps trying for a moment as the layout scrolls
      if(o.st==='wait'){if(p.y>=o.ty){if(TR[o.type].start(o))o.st=o.st==='wait'?'on':o.st;else if((o.tries=(o.tries||0)+1)>40){o.dead=true;fireWave()}}}
      else TR[o.type].tick(o,dt);
    }
    traps=traps.filter(o=>!o.dead);
    for(const w of waves)if(p.y>=w.ty){w.done=true;fireWave()}
    waves=waves.filter(w=>!w.done);

    // fragile vines: timer starts on grab, snaps after FRAG seconds
    for(const s of segs){
      if(s.type!=='F'||s.broken)continue;
      if(s.t<0&&onSeg(s)&&Math.abs(p.x-LX[s.lane])<5){s.t=0;snd(150,120,.15,'square',.04)}
      if(s.t>=0&&(s.t+=dt)>=FRAG){
        s.broken=true;shake=Math.max(shake,2);snd(300,60,.2,'square',.06);
        for(let i=0;i<14;i++)parts.push({x:LX[s.lane]+Math.random()*4-2,y:Math.max(s.y0,camY)+Math.random()*Math.min(s.y1-s.y0,H),vy:Math.random()*40,l:1,c:Math.random()<.5?'h':'o'});
      }
    }

    for(const s of spikes){
      if(s.st==='warn'){
        const b=s.w;s.w-=dt;
        if(b>=s.sw&&s.w<s.sw){
          // decided before the "!" ever shows: if this drop could leave you nowhere to go, it never appears
          const m=meetAhead(spikeV(),s.w);
          if(onlyWay(s.lane,m-20,m+42)){s.st='gone';continue}
          s.m=m;snd(880,880,.05,'square',.03);
        }
        if(s.w<=0){const m=meetY(spikeV());if(onlyWay(s.lane,m-6,m+30)){if((s.hold=(s.hold||0)+dt)>HOLD)s.st='gone'}else{s.st='fall';s.y=camY+H+4}}}
      else if(s.st==='fall'){s.y-=spikeV()*dt;
        if(s.y<p.y+16&&s.y+13.5>p.y&&Math.abs(p.x-LX[s.lane])<7){hit();s.st='gone'}
        else if(!s.chk&&s.y<p.y+8){s.chk=true;if(s.lane!==p.lane&&s.lane===p.prevLane&&T-p.switchT<.6)close('CLOSE')}}
    }
    spikes=spikes.filter(s=>s.st!=='gone'&&!(s.st==='fall'&&s.y<camY-20));

    for(const j of jets){
      const L=j.side<0,mx=L?13:131;
      if(j.st==='idle'&&(j.y-(p.y+8))/speed<.45+.7*warnK()){
        // checked before the vent starts glowing: if it couldn't leave you a lane, it stays dark
        if(!canEscape(j.lanes,j.y-30,j.y+26))j.st='done';
        else{j.st='warn';j.t=0;j.ww=.7*warnK();snd(90,60,.4,'sawtooth',.04)}
      }
      else if(j.st==='warn'){
        if(Math.random()<.5)parts.push({x:mx,y:j.y+Math.random()*2-1,vx:-j.side*(15+Math.random()*25),vy:Math.random()*20-10,g:0,l:.3,c:Math.random()<.5?'o':'y'});
        if((j.t+=dt)>=j.ww){
          if(!canEscape(j.lanes,j.y-24,j.y+20)){if((j.hold=(j.hold||0)+dt)>HOLD){j.st='done';j.t=0}else j.t=j.ww}
          else{j.st='fire';j.t=0;shake=Math.max(shake,1.5);snd(180,50,.6,'sawtooth',.07)}
        }
      } else if(j.st==='fire'){
        j.t+=dt;
        const inY=p.y<j.y+3&&p.y+16>j.y-3,inX=L?p.x<j.reach:p.x>j.reach;
        if(inY&&inX&&!j.hitDone){j.hitDone=true;hit()}
        else if(inY&&!inX&&!j.chk&&T-p.switchT<.6&&j.lanes.includes(p.prevLane)){j.chk=true;close('CLOSE')}
        if(j.t>=.9){j.st='done';j.t=0}
      } else if(j.st==='done'&&(j.t+=dt)<1.5&&Math.random()<.2)
        parts.push({x:mx+Math.random()*2-1,y:j.y+1,vx:-j.side*4,vy:4,g:-15,l:.8,c:'#5f574f'});
    }
    jets=jets.filter(j=>j.y>camY-30);
    segs=segs.filter(s=>s.y1>camY-20);

    for(const g of gems){
      if(g.got)continue;
      if((pT.magnet>0||g.lane===p.lane&&Math.abs(p.x-LX[g.lane])<5)&&hands()>=g.y-5&&hands()<g.y+6){ // magnet: any lane
        const m0=chainMult();chain++;lastGemT=T;
        const m=chainMult(),pts=g.tier.pts*m*(pT.x2>0?2:1);
        g.got=true;bonus+=pts;gemCount+=g.tier.pts/2; // bank value: orange 1, purple 3, red 6
        if(m>m0){pops.push({s:'CHAIN X'+m,x:p.x,y:p.y+30,t:0});snd(700,1400,.15,'square',.05)}
        else if(g.bait)pops.push({s:'+'+pts,x:LX[g.lane],y:g.y+10,t:0});
        for(let i=0;i<5;i++)parts.push({x:LX[g.lane]+Math.random()*4-2,y:g.y,vy:20+Math.random()*30,vx:(Math.random()-.5)*20,l:.35,c:g.tier.base});
        snd(900+Math.min(chain,50)*10,1500+Math.min(chain,50)*10,.08,'square',.03);
      }
    }
    gems=gems.filter(g=>!g.got&&g.y>camY-20);

    if(hands()>=ropeSafeY)for(const s of segs)if(isGap(s)&&s.lane===p.lane&&Math.abs(p.x-LX[s.lane])<5&&grip()>=s.y0&&hands()<s.y1){if(pT.rope>0)useRope();else die('fall');break}
    if(state==='play'&&lavaY>=p.y+2)die('burn');
  } else if(state==='dead'){
    deadT+=dt;lavaY+=10*dt;
    if(deathKind==='fall'){p.vy-=300*dt;p.y+=p.vy*dt}else p.y-=10*dt;
  }
  if(state!=='dead'){const tg=Math.max(-20,p.y-70);camY+=(tg-camY)*Math.min(1,dt*8)}
  if(Math.random()<.3)bubbles.push({x:Math.random()*W,l:.4});
  bubbles=bubbles.filter(b=>(b.l-=dt)>0);
}

  for(let r=Math.floor(camY/8)-1;r*8<camY+H+8;r++){

      if(x1<=x0)continue;
      const h=hash(r*31.7+c*7.3),t=hash(r*13.1+c*91.7),w=x1-x0;
      f(x0,ys+.5,w,7.5,t<.4?'#1d2b53':t<.75?'#212f5b':'#1a274c');
      f(x0,ys+.5,w,.5,'#2c3d72');

  const pour=state!=='title'&&(state!=='intro'||it>=1.5);
  f(0,sy(30),16,2,'k');f(0,sy(28),20,28,'k');f(20,sy(28),2,28,'d');f(16,sy(31),4,3,'d');
  if(pour)f(0,sy(4),18,4,'o');
  f(118,sy(46),14,16,'d');f(118,sy(46),14,1,'l');f(121,sy(43),2,2,'k');f(127,sy(43),2,2,'k');

function drawVines(){
  for(let l=0;l<3;l++){
    const x=LX[l]-1,ls=segs.filter(s=>s.lane===l&&s.y1>camY&&s.y0<camY+H);
    for(let wy=Math.max(30,Math.floor(camY));wy<camY+H;wy++){
      const s=ls.find(s=>wy>=s.y0&&wy<s.y1);
      if(s&&isGap(s))continue;
      const ys=sy(wy);
      if(s){ // fragile: dry, shakes, blinks red before snapping
        const jx=s.t>0&&Math.random()<.5?.5:0,red=s.t>FRAG*.45&&(T*12|0)%2,edge=red?'#be1250':'#742f29';
        f(x+jx,ys,.5,1,edge);f(x+.5+jx,ys,1,1,red?'r':(wy%5<2?'#c98a4b':'h'));f(x+1.5+jx,ys,.5,1,edge);
        if(wy%7===0)f(x+jx+(wy%14?1.5:-.5),ys,1,.5,'#742f29');
        continue;
      }
      f(x,ys,.5,1,'g');f(x+.5,ys,1,1,'G');f(x+1.5,ys,.5,1,'g');
      f(x+((wy%6)<3?.5:1),ys,.5,.5,'#a8e72e');
      if(wy%10===0){const h=hash(l*97+wy);
        if(h>.72){f(x+2,ys,1,.5,'g');f(x+2.5,ys-.5,1.5,.5,'G');f(x+3.5,ys-1,1,.5,'G');f(x+3,ys-.5,.5,.5,'#a8e72e')}
        else if(h>.45){f(x-1,ys,1,.5,'g');f(x-2,ys-.5,1.5,.5,'G');f(x-2.5,ys-1,1,.5,'G');f(x-1.5,ys-.5,.5,.5,'#a8e72e')}
      }
    }
    for(const s of ls)if(isGap(s)){
      const a=sy(s.y0),b=sy(s.y1),c=s.type==='F'?'h':'g',c2=s.type==='F'?'#c98a4b':'G';
      f(x,a-1,.5,1,c);f(x+1,a-1.5,.5,1.5,c2);f(x+1.5,a-.5,.5,.5,c);
      f(x+.5,b,.5,1.5,c);f(x+1.5,b,.5,1,c2);f(x-.5,b+1,.5,.5,c);
    }
  }
  for(const q of parts)f(q.x,sy(q.y),.5,.5,q.c);
}

// faceted 4-sided gem (a tall rhombus, pointed top/bottom): a dark outline keeps it off the green vines,
// and its width pulses with a cosine to fake a 3D spin, swapping which facet catches the light as it turns.
function drawGem(x,y,tier,ph){
  const c=Math.cos(T*2.4+ph),facing=c>=0,sc=.4+.6*Math.abs(c),maxW=2.8;
  for(let row=-3;row<=3;row++){
    let hw=maxW*(1-Math.abs(row)/3.5)*sc;
    if(hw<.35)hw=.35;
    const ry=y+row,L=facing?tier.light:tier.dark,R=facing?tier.dark:tier.light;

    f(x-hw,ry,hw,1,L);

function slabRows(x,y,w,h,round){

function makeLogo(word,pal,seed,vines){

  const img=g0=>{const im=g0.createImageData(Wd,Hd),D=im.data,rgb=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));

const PUP_ONCE={shield:1,rope:1};
const PUP_INFO={
  shield:['BLOCKS ONE HIT.','NO STUN, AND THE','LAVA STAYS DOWN.','WORKS ONCE'],
  rope:['FALL OFF A VINE','END AND IT PULLS','YOU BACK UP ONTO','A SAFE VINE.','WORKS ONCE'],
  magnet:['PULLS IN GEMS','FROM ALL THREE','VINES.'],
  x2:['EVERY GEM YOU','GRAB SCORES','DOUBLE.'],
  cool:['GET HIT AND THE','LAVA STAYS DOWN','INSTEAD OF','SURGING UP.']};
let shopInfo=null;

function drawHud(){
  btns=[];
  if(state==='title'){drawTitle();return}
  const m=height();
  txt(score(),16,7,1.5,'w');txt(m+'M',16,20,1,'l');
  if(combo>1&&T-comboT<3)txt('X'+combo,16+tw(''+score(),1.5)+4,10,1,'y');
  const hi='HI '+best;txt(hi,state==='play'?114-tw(hi,.5):128-tw(hi,.5),state==='play'?10:9,.5,'y');
  if(gemCount>0){gemTxt(gemCount,16,31,1,'y');
    // chain multiplier, blinking when it's about to run out
    const cm=chainMult();if(cm>1&&state==='play'&&(T-lastGemT<1.2||(T*10|0)%2))txt('X'+cm,24+tw(''+gemCount,1)+4,31,1,'o')}
  for(const q of pops){const tx=Math.max(14,Math.min(130-tw(q.s,1),Math.round(q.x-tw(q.s,1)/2)));
    if(q.t<.7||(T*12|0)%2)txt(q.s,tx,sy(q.y)-q.t*20,1,'y')}
  if(state==='play'){
    const gap=p.y-lavaY,hgt=Math.max(0,Math.min(1,gap/110))*80;
    f(4,40,4,80,'n');f(5,122,2,1,'o');f(4,123,4,3,'o');f(5,124,2,2,'y');f(3,124,1,1,'r');f(8,124,1,1,'r');f(4,120-hgt,4,hgt,gap<40?((T*8|0)%2?'r':'o'):'G');
    if(firstRun&&playT<2.5&&!paused&&(T*3|0)%2===0)txt('SWIPE < >','c',110,1,'w'); // first run ever only
    // one row for whatever is running: icon over a draining bar, blinking for its last 2 seconds
    {let hx=21;for(const k of PUP_KINDS)if(pT[k]>0){
      if(pT[k]>2||(T*8|0)%2)drawIcon(k,hx,48);
      f(hx-5.5,55,11,2.5,'k');f(hx-5,55.5,10*Math.min(1,pT[k]/pMax[k]),1.5,PUPS[k].c);hx+=13}}
    if(hintT>0&&!paused){txt('LAVA IS CLOSE!','c',222,1,'y');if((T*4|0)%2===0)txt('DO NOT GET HIT AGAIN!','c',233,1,'w')}
    if(!paused){btns.push({x:106,y:0,w:38,h:34,fn:pause}); // thumb-sized hit area
      btn('',119,4,19,19,pause,{kind:'pink',round:true,still:true,icon:icoPause})}
    else if(resumeT>0)heading(Math.ceil(resumeT/.7),96,3,'y','w','#8a4f00');
    else{
      dim();panel(20,60,104,108);
      heading('PAUSED',70,1.5,'o','y','#8a2a00');
      if((performance.now()/500|0)%2===0)txt('TAP TO RESUME','c',92,1,'w');
      btn('SOUND: '+(muted?'OFF':'ON'),32,108,80,22,()=>setMute(!muted),{kind:muted?'off':'alt'});
      btn('QUIT',32,135,80,22,quit,{kind:'red'});
    }
  }
  if(state==='dead'){
    dim();panel(10,28,124,194);
    const fell=deathKind==='fall';
    heading(fell?'YOU FELL!':'TOO HOT!',38,2,fell?'#5a8cff':'o',fell?'b':'y',fell?'#1d2b53':'#8a2a00');
    inset(30,60,84,30);txt('SCORE','c',63,.5,'l');txt(score(),'c',71,2,'w');
    txt('HEIGHT '+m+'M   CLOSE CALLS '+closes,'c',95,.5,'l');
    gemTxt('+'+gemCount,'c',103,1,'y');txt('BANK '+save.bank,'c',113,.5,'l');
    if(newBest){if((T*4|0)%2)txt('NEW BEST!','c',120,1,'G')}else txt('BEST '+best,'c',121,.5,'y');
    // buttons wake up after a moment so a swipe that was already on its way can't press one
    const ok=deadT>.8,rv=canRevive();let y=rv?131:140;
    if(rv){btn('REVIVE',24,y,96,26,ok&&revive,{kind:'gold',sub:save.boost.revive>0?save.boost.revive+' IN STOCK':BOOSTS.revive.cost+' GEMS'});y+=29}
    btn('RETRY',24,y,96,26,ok&&play,{kind:'go',sc:1.5});if(ok){arrow(19,y+9,1);arrow(125,y+9,-1)}y+=29;
    btn('SHOP',24,y,47,20,ok&&(()=>openShop('up')),{kind:rv?'alt':'gold'});btn('HOME',73,y,47,20,ok&&(()=>{reset();state='title'}),{kind:'pink'});
  }
}

function draw(){
  // the finger that's down (before it lifts) presses the button under it
  ptr=null;if(down&&!swiped){const r=cv.getBoundingClientRect();ptr={x:(sx0-r.left)/r.width*W,y:(sy0-r.top)/r.height*H}}
  if(state==='shop'){drawBg();cx.globalAlpha=.45;f(0,0,W,H,'k');cx.globalAlpha=1;dim();btns=[];drawShop();return}
  cx.save();
  if(shake>0)cx.translate(Math.round((Math.random()-.5)*shake)*S,Math.round((Math.random()-.5)*shake)*S);
  drawBg();drawVines();drawGems();drawPups();drawTrapsBack();drawObstacles();drawPlayer();drawFlames();drawTrapsFront();drawLava();
  cx.restore();
  if(state==='play'&&(surge>0||caught)){ // lava at your heels: red pulse on the screen edges
    const a=.12+.08*Math.sin(T*12);
    cx.globalAlpha=a;f(0,0,6,H,'r');f(W-6,0,6,H,'r');f(0,0,W,5,'r');
    cx.globalAlpha=a*.5;f(6,5,4,H,'r');f(W-10,5,4,H,'r');f(6,5,W-12,3,'r');cx.globalAlpha=1;
  }
  drawHud();
}

let last=performance.now();
function loop(t){update(Math.min(.05,(t-last)/1000));last=t;draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);

function fit(){const s=Math.min(innerWidth/W,innerHeight/H);cv.style.width=W*s+'px';cv.style.height=H*s+'px'}
addEventListener('resize',fit);fit();

// fairness checks: open the game with ?bot in the address, then run botCheck() in the console (see tools/botcheck.js)
if(/[?&]bot\b/.test(location.search)){const s=document.createElement('script');s.src='tools/botcheck.js';document.body.appendChild(s)}

// input: swipe, tap, keys
let down=false,sx0=0,sy0=0,swiped=false;
const stage=document.getElementById('stage');
stage.addEventListener('pointerdown',e=>{unlock();down=true;swiped=false;sx0=e.clientX;sy0=e.clientY});
stage.addEventListener('pointermove',e=>{if(down&&!swiped&&Math.abs(e.clientX-sx0)>22){move(e.clientX>sx0?1:-1);swiped=true}});
addEventListener('pointerup',()=>{if(down&&!swiped)tap(sx0,sy0);down=false});
// switching apps or locking the phone pauses the run
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});
addEventListener('keydown',e=>{
  unlock();
  if(e.key==='ArrowLeft'||e.key==='a')move(-1);
  else if(e.key==='ArrowRight'||e.key==='d')move(1);
  else if(e.key==='Escape'&&state==='shop'){if(shopInfo)shopInfo=null;else closeShop()}
  else if(e.key==='Escape'&&state==='title')settingsOpen=false;
  else if(e.key==='p'||e.key==='Escape'){if(paused)resume();else pause()}
  else if(e.key==='m')setMute(!muted);
  else if(e.key===' '||e.key==='Enter'){tap();e.preventDefault()}
});
</script>
</body>
</html>
